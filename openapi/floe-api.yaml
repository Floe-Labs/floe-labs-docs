            type: integer
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeySummary"
        "404":
          description: Agent not found or not owned by caller
    post:
      tags: [Developer]
      summary: Mint API key for agent (optionally with a spend budget)
      description: |
        Emits the `key.created` webhook event. When `budgetRaw` is provided
        the key is capped at creation time (fail-closed — if the budget
        write fails, no key is issued).
      operationId: devCreateKey
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 100
                permissions:
                  type: string
                  enum: [read, read_write]
                budgetRaw:
                  type: string
                  pattern: "^[1-9]\\d*$"
                  description: Optional per-key spend budget (raw USDC, 6 decimals).
                windowSeconds:
                  type: integer
                  minimum: 60
                  maximum: 31536000
      responses:
        "201":
          description: Key created (plaintext `key` shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "409":
          description: >
            Two distinct refusals share this status, because two different
            things can cap an agent's keys. `plan_limit_exceeded` — the agent
            is at its plan's `keysPerAgentMax` (free 5, pro 10, agency 25;
            Enterprise unlimited), and upgrading raises it.
            `deployment_limit_exceeded` — the MAX_KEYS_PER_AGENT env var is
            set and binds regardless of plan, including on Enterprise. That
            body carries NO `upgradeUrl`: no purchase can lift an operator's
            environment override, so advertising one would be false.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlanLimitExceeded"
                  - type: object
                    required: [error, message, limit, max, current]
                    properties:
                      error:
                        type: string
                        enum: [deployment_limit_exceeded]
                      message:
                        type: string
                      limit:
                        type: string
                        enum: [keys_per_agent]
                      max:
                        type: integer
                        description: The MAX_KEYS_PER_AGENT value this deployment is running with.
                      current:
                        type: integer
                        description: Active keys observed on the agent at the moment of refusal.

