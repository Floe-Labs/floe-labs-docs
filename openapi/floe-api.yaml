      type: object
      properties:
        trackedSpendCapRaw:
          type: string
          nullable: true
          description: Soft monthly tracked-spend cap, raw 6-dp USDC string (free 2000000000, pro 10000000000, agency 50000000000). null = uncapped. Soft — never enforced on the proxy hot path; 80 % / 100 % emit billing.usage_threshold.
        historyDays:
          type: integer
          nullable: true
          description: Read-history window on ledger/analytics/activity routes (free 30, pro 365). null = unlimited. Older data is clamped, not deleted — responses carry `historyFloor` + `historyClamped`.
        billedClientsMax:
          type: integer
          nullable: true
          description: Max distinct end-clients with a rate card or billing period (free 0, pro 0, agency 150). null = unlimited. Exceeding it returns 409 plan_limit_exceeded.
        agentsMax:
          type: integer
          nullable: true
          description: P2.5 — max agents per account (free 5, pro 25, agency 100). null = unlimited (Enterprise). Exceeding it returns 409 plan_limit_exceeded with limit=agents.
        apiKeysMax:
          type: integer
          nullable: true
          description: P2.5 — max active developer (`floe_live_*`) API keys per ACCOUNT (free 5, pro 25, agency 100). null = unlimited. Exceeding it returns 409 plan_limit_exceeded with limit=api_keys.
        keysPerAgentMax:
          type: integer
          nullable: true
          description: >
            P2.5 — max active agent (`floe_*`) keys per AGENT (free 5, pro 10, agency 25).
            null = unlimited. Distinct from apiKeysMax, which is account-wide developer keys.
            Exceeding it returns 409 plan_limit_exceeded with limit=keys_per_agent. The
            MAX_KEYS_PER_AGENT env var overrides this per deployment when set.

