        qualityWindowSeconds:
          type: integer

    CreateTeamPolicyRequest:
      type: object
      description: |
        Body for POST /v1/developer/policies (team/developer-scoped caps),
        mirroring `createTeamPolicySchema` in routes/policy-schemas.ts.

        This is a STANDALONE schema, not `allOf` over CreatePolicyRequest.
        `allOf` intersects constraints, so composing it could only ever
        NARROW the agent-surface `kind` enum — it could never add `session`
        or `customer`. The previous prose note ("team policies additionally
        allow kind 'session'") was therefore unenforceable, and a generated
        client rejected a valid `session` body.

        Differences from the agent surface, all of which the server already
        accepts: `kind` adds `session` and `customer`; `windowKind` adds
        `session`; `matchKey` is omitted for `session` rather than required;
        and the calendar bounds are documented.
      required: [kind, limitRaw]
      properties:
        kind:
          type: string
          enum: [session, task, api, vendor, customer]
          description: |
            `session` caps all spend across every agent on the account.
            `customer` caps one END-CLIENT (matchKey = the client id) and is
            team-only, because scope changes the spend-aggregation set rather
            than applicability — an agent-scoped client cap would count a
            single agent's spend while reading as the whole client's budget.
        matchKey:
          type: string
          maxLength: 255
          description: >
            Required for every kind except `session`, which omits it. The 255
            bound is the outer limit; per-kind shape is enforced server-side
            (PolicyService.validateInput) — `task` and `customer` keys are
            opaque strings of at most 128 characters, `vendor` is a payee
            wallet, `api` is a host or a leading-dot suffix.
        matchKind:
          type: string
          enum: [host_exact, host_suffix, recipient]
          description: >
            Derived when omitted — `api` defaults to host_suffix, `vendor` to
            recipient. Null for session, task and customer: a client id is
            matched by plain equality, so there is nothing to discriminate on.
        limitRaw:
          type: string
          pattern: "^\\d+$"
        windowKind:
          type: string
          enum: [once, rolling, session]
          default: rolling
        windowSeconds:
          type: integer
        expiresAt:
          type: integer
        effectiveFrom:
          type: integer
          description: UNIX seconds; the cap is inert before this instant.
        effectiveUntil:
          type: integer
          description: UNIX seconds; must be in the future and after effectiveFrom.
        label:
          type: string
          maxLength: 255
        action:
          type: string
          enum: [block, suspend_agent]
        limitFloorRaw:
          type: string
        limitCeilingRaw:
          type: string
        qualityThrottleFloorBps:
          type: integer
        qualityWindowSeconds:
          type: integer

    SubscribableEvent:
      description: >
        A subscribable event value: a catalog event name
        (WebhookCatalogEventName) or a wildcard
        (WebhookSubscriptionWildcard — the global `*` or a `<prefix>.*`
        covering at least one catalog event). Wildcards are accepted in
        subscriptions and echoed back verbatim in Webhook.events. Full
        catalog with titles, descriptions, categories, and scope dimensions:
        GET /v1/developer/webhooks/events.
      oneOf:
        - $ref: "#/components/schemas/WebhookCatalogEventName"
        - $ref: "#/components/schemas/WebhookSubscriptionWildcard"
      example: call.ended

    WebhookSubscriptionWildcard:
      type: string
      description: >
        A wildcard subscription value: `*` (every event) or a dot-prefix
        wildcard. Only prefixes that cover at least one catalog event are
        valid (any dot level), so this enum is derived from the catalog —
        a typo like `lone.*` is rejected server-side.
      enum: ["*", "loan.*", "agent.*", "key.*", "x402.*", "provider_key.*", "credit.*", "call.*", "call.report.*", "call.recording.*", "phone.*", "phone.number.*", "marketplace.*", "marketplace.job.*", "marketplace.payment.*", "marketplace.spend_cap.*", "marketplace.tripwire.*", "marketplace.vendor.*", "billing.*", "billing.plan.*", "billing.invoice.*", "client_invoice.*", "stripe.*"]

    WebhookCatalogEventName:
      type: string
      description: >
        A catalog event name (no wildcards). The `billing` category (FLO-701 /
        FLO-733) is account-scoped: `billing.plan.changed` (effective plan
        flipped — checkout, portal change, cancellation, admin grant),
        `billing.payment_failed` (a plan invoice failed / needs action),
        `billing.invoice.paid` (Floe's plan invoice paid),
        `billing.renewal_upcoming` (Stripe `invoice.upcoming`),
        `billing.usage_threshold` (tracked spend crossed 80 % / 100 % of the
        plan cap, once per month per level), `client_invoice.sent|paid|voided|
        uncollectible` (an agency's connected-account invoice for a billing
        period changed state), `stripe.connected` / `stripe.disconnected`
        (Stripe Connect link lifecycle), and the FLO-746 vendor-cost events:
        `vendor_actuals.connection.created|updated|deleted` (a read-only vendor
        billing credential was stored, retuned, or withdrawn — payloads carry
        the non-secret mask, never credential material),
        `vendor_actuals.invoice.footed` (an invoice reconciled, or was left
        `disputed` on an unexplained variance), and
        `vendor_actuals.close_gate_overridden` (a period was closed while some
        vendor costs were still unconfirmed). There is deliberately NO per-leg
        restatement event: a vendor restatement can touch tens of thousands of
        legs in one run and would flood every subscriber.
      enum: [loan.health_warning, loan.expiry_warning, loan.overdue, loan.liquidated, loan.repaid, agent.created, agent.suspended, key.created, key.rotated, x402.first_settlement, provider_key.created, provider_key.updated, provider_key.deleted, credit.warning, credit.at_limit, credit.recovered, call.started, call.ended, call.report.ready, call.recording.ready, call.analyzed, call.rejected, phone.number.grace, phone.number.released, marketplace.job.completed, marketplace.payment.settled, marketplace.spend_cap.hit, marketplace.tripwire.triggered, marketplace.vendor.degraded, marketplace.vendor.recovered, billing.plan.changed, billing.payment_failed, billing.invoice.paid, billing.renewal_upcoming, billing.usage_threshold, client_margin.negative, client_invoice.sent, client_invoice.paid, client_invoice.voided, client_invoice.uncollectible, stripe.connected, stripe.disconnected, vendor_actuals.connection.created, vendor_actuals.connection.updated, vendor_actuals.connection.deleted, vendor_actuals.invoice.footed, vendor_actuals.close_gate_overridden]

