  /v1/developer/agents/{agentId}/actions/{actionId}/outcome:
    post:
      tags: [Developer]
      summary: Report (upsert) the outcome for one action
      description: |
        Floe never judges quality — status/score are caller-supplied
        verbatim. The same report is available agent-key-authed at
        POST /v1/agents/actions/{actionId}/outcome for runtimes that
        self-report.
      operationId: devReportActionOutcome
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [success, failure, partial, unknown]
                scoreBps:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  nullable: true
                note:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  actionId:
                    type: string
