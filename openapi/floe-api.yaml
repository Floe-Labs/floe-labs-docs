  /v1/developer/auth/verify:
    post:
      tags: [Developer]
      summary: Exchange a fresh wallet signature for a dashboard session
      operationId: devAuthVerify
      description: |
        Wallet sign-in for the dashboard: the request carries the wallet
        signature headers (X-Wallet-Address + X-Signature + X-Timestamp, the
        same EIP-191 message the SDKs sign), and the server issues the
        `floe_session` cookie for exactly that wallet. On this path the
        signature headers alone decide identity: an existing `floe_session`
        cookie or Bearer JWT is ignored, and a request authenticated by an
        API key or a session (rather than a fresh signature) is refused — a
        key or a stale cookie can never start a new dashboard session. The
        session is always for the wallet that signed, never for an account
        selected with `X-Floe-Account` / the `floe_account` cookie.

        This route never links or pins a Privy user to the account: any body
        field other than `src` — including a `privyAccessToken` — is ignored.
        The signed message names no route or Privy user and is valid for
        five minutes, so it cannot be allowed to bind one; Privy users are
        pinned only by POST /v1/developer/auth/privy, from a verified token.
      security:
        - walletAddress: []
          walletSignature: []
          walletTimestamp: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                src:
                  type: string
                  description: >
                    First-touch acquisition source (`?src=` / utm_source).
                    Sanitized to `[a-z0-9_-]`, max 64 chars; written only when
                    this sign-in creates the account.
      responses:
        "200":
          description: >
            Session issued — `floe_session` set as an HttpOnly cookie (7-day
            sliding window). `developer.privyDid` is the Privy user the
            account is already pinned to (by an earlier email / Google
            sign-in), or null; this route never changes it.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [developer]
                properties:
                  developer:
                    $ref: "#/components/schemas/DeveloperSession"
        "401":
          description: >
            Missing, stale (outside 5 minutes) or invalid wallet signature
            headers, or the request was authenticated by an API key or an
            existing session instead of a fresh signature

  /v1/developer/auth/privy:
    post:
      tags: [Developer]
      summary: Exchange a Privy access token for a dashboard session (email / Google sign-in)
      operationId: devAuthPrivy
      description: |
        FLO-784. Email and Google sign-in for the dashboard: exchanges a
        verified Privy access token for the same `floe_session` cookie that
        POST /v1/developer/auth/verify issues — with no wallet signature.

        The token is read ONLY from `Authorization: Bearer <Privy access
        token>` (never the body); a `Bearer floe_…` API key is refused. The
        server verifies it (ES256 signature, issuer `privy.io`, audience = this
        deployment's Privy app, expiry), fetches the user's current linked
        accounts from Privy and picks the Floe account itself. A Privy token
        minted for a DIFFERENT Privy app is a deployment misconfiguration
        (503 `privy_app_mismatch`), not a bad token (401). Nothing else the
        client sends — wallet headers, `X-Floe-Account`, the `floe_account` or
        an existing `floe_session` cookie — can choose it.

        Account resolution is existing-account-first: the account already
        pinned to this Privy user; else the one existing account among the
        user's linked Ethereum wallets (several → the Privy embedded wallet's,
        else `identity_ambiguous`); else a NEW account keyed by the Privy
        embedded wallet (or by the single linked external wallet). Before a
        new account is created, a `walletHint` naming a different, existing
        account refuses with `wallet_signature_required` unless the request
        says `allowNew: true`. The Privy user id is then pinned to the
        account, write-once. On success a verified email fills an empty
        `email`, the embedded wallet is recorded as `embeddedWalletAddress`,
        and a first-ever sign-in sends the welcome email.

        On `wallet_signature_required` the caller already has a Floe account
        and must choose: create a new one (repeat this request with
        `allowNew: true`), or continue with the existing one by signing in to
        Privy the way that account was created — with its wallet, or with the
        email / Google account used before — which this route then resolves to
        that account. `identity_ambiguous` and `identity_conflict` cannot be
        settled here: sign in with a wallet signature (POST
        /v1/developer/auth/verify), which proves which account is meant.
        `embedded_wallet_pending` means retry shortly.

        This is the only route that pins a Privy user to an account; POST
        /v1/developer/auth/verify never does.

        Rate limited per Privy user to 24 requests per minute — sized above
        the dashboard's own `embedded_wallet_pending` retries, Try again
        included. That bucket is keyed on a DID taken from a token that has
        already verified, so it cannot be forged, and it is the real control.

        A 30/minute per-client-IP bucket sits in front of it as defence in
        depth only. It keys on the left-most `X-Forwarded-For` hop, which is
        caller-supplied wherever the proxy appends rather than overwrites, so
        treat it as best-effort: rotating the header dodges it. Keying the
        right-most hop instead would lump every user behind one shared proxy
        into a single bucket and lock them out of sign-in.
      security:
        - privyAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                src:
                  type: string
                  description: >
                    First-touch acquisition source (`?src=` / utm_source).
                    Sanitized to `[a-z0-9_-]`, max 64 chars; written only when
                    this sign-in creates the account.
                walletHint:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{40}$"
                  description: >
                    The Floe account this browser already uses (its live or
                    last session). Never chooses the account: it is read only
                    when this sign-in would CREATE a new account, and then can
                    only downgrade the exchange to `wallet_signature_required`
                    — when it is NOT one of the Privy user's linked wallets but
                    already has a Floe account.
                allowNew:
                  type: boolean
                  description: >
                    `true` = the user explicitly chose to create a new account
                    over the one `walletHint` names (the answer to
                    `wallet_signature_required`): skips the `walletHint` check.
                    It is also the answer to `case_identity`
                    (`canContinueAsDeveloper: true`): the person chose their
                    own developer account, and signup proceeds. It never overrides an existing or pinned account, nor
                    `identity_ambiguous` / `embedded_wallet_pending`. Only
                    `true` has an effect; `false` / null are the same as
                    absent.
      responses:
        "200":
          description: Session issued — `floe_session` set as an HttpOnly cookie (7-day sliding window). The token is never in the body.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [developer, isNew]
                properties:
                  developer:
                    $ref: "#/components/schemas/DeveloperSession"
                  isNew:
                    type: boolean
                    description: True when this sign-in created the account.
        "400":
          description: invalid_request — Content-Type is not application/json, the body is not a JSON object, `walletHint` is not an address, or `allowNew` is not a boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyAuthError"
        "401":
          description: >
            invalid_privy_token — the Authorization header is missing, carries
            a `floe_` API key, or the token is expired / invalid (malformed,
            bad signature, not issued by `privy.io`), or its Privy user no
            longer exists. A token for another Privy app is a 503, not this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyAuthError"
        "403":
          description: >
            case_identity — no developer account exists for this identity and
            the verified email is an ACTIVE member of a shared case: that
            person signs in on the case link (a case session), not here. The
            body names no case and carries `canContinueAsDeveloper: true`: the
            person may still create their own developer account by repeating
            the request with `allowNew: true`. An existing developer, or an
            email whose case memberships are all revoked, signs in as usual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyAuthError"
        "409":
          description: >
            embedded_wallet_pending (`retryable: true` — the Privy user has no
            Ethereum wallet yet; the dashboard creates the embedded wallet just
            after sign-in, so retry shortly), wallet_signature_required (this
            sign-in would create a new account but the `walletHint` account
            already exists — continue with that account, or repeat with
            `allowNew: true`),
            identity_ambiguous (several candidate accounts, or several linked
            external wallets and no embedded wallet), identity_conflict (the
            account is already pinned to a different Privy user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyAuthError"
        "429":
          description: rate_limited — too many attempts for this client IP or Privy user (`retryAfterSeconds` + a `Retry-After` header say when)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyAuthError"
        "502":
          description: >
            privy_unavailable — Privy could not be reached, timed out,
            rate-limited this server or answered 5xx while verifying the token
            or reading the user. Transient: retry with backoff (the dashboard
            does).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyAuthError"
        "503":
          description: >
            Not transient; retrying does not help.
            privy_auth_unavailable — Privy sign-in is not usable on this
            deployment: it is not configured (PRIVY_APP_ID / PRIVY_APP_SECRET
            unset), or Privy rejects the configured app credentials (a wrong
            or rotated PRIVY_APP_SECRET, or an app id Privy does not
            recognize). Sign in with a wallet signature (POST
            /v1/developer/auth/verify) instead.
            privy_app_mismatch — the token was minted for a different Privy
            app than this deployment's PRIVY_APP_ID (the dashboard's
            NEXT_PUBLIC_PRIVY_APP_ID must name the same app; the server logs
            `privy_login_app_mismatch` with both ids). Do NOT fall back to a
            wallet signature: the caller's Privy wallet belongs to the other
            app, so /auth/verify would sign it in to a different, new
            account. Nothing signs in until the deployment is fixed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivyAuthError"

  /v1/developer/profile:
    get:
      tags: [Developer]
      summary: Developer profile + agents + credit usage
      operationId: devGetProfile
      security:
        - developerSession: []
      responses:
        "200":
          description: Profile (includes `aiToolConnectedAt`, the first floe-cli/ / floe-mcp/ User-Agent seen) + full agents list with per-agent creditUsed
          content:
            application/json:
              schema:
                type: object
                properties:
                  developer:
                    type: object
                    properties:
                      walletAddress:
                        type: string
                      displayName:
                        type: string
                        nullable: true
                      email:
                        type: string
                        nullable: true
                      accountId:
                        type: string
                        nullable: true
                      role:
                        type: string
                        nullable: true
                        enum: [owner, admin, member, viewer, null]
                      createdAt:
                        type: string
                        format: date-time
                      embeddedWalletAddress:
                        type: string
                        nullable: true
                      embeddedWalletExportedAt:
                        type: string
                        format: date-time
                        nullable: true
                      privyDid:
                        type: string
                        nullable: true
                        description: |
                          FLO-784 — the SIGNED-IN human's Privy user id
                          (`did:privy:…`), pinned on their first
                          POST /v1/developer/auth/privy sign-in. NULL for a
                          human who has only ever signed in with a wallet
                          signature. Read from the caller's own account, even
                          when a teammate is acting in someone else's.
                      walletActivatedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: |
                          FLO-784 — when the signed-in human opted into the
                          wallet UI (PATCH /v1/developer/me
                          `walletActivated: true`); NULL until then. UI gating
                          only — money routes enforce their own auth. Read from
                          the caller's own account, like `privyDid`.
                      aiToolConnectedAt:
                        type: string
                        format: date-time
                        nullable: true
                      customerAttribution:
                        type: string
                        enum: [optional, required]
                        description: |
                          Rebilling T1 — `required` makes the gateway refuse
                          untagged metered calls pre-spend.
                      unitNoun:
                        type: string
                        enum: [call, conversation, task, meeting, interaction, resolution]
                        description: |
                          P1.8 — the console's noun for ONE unit of work.
                          DISPLAY ONLY: nothing prices, groups or reconciles by
                          it, and the rate-card engine keeps its own unit.
                          Defaults to `call`.
                      campaignNoun:
                        type: string
                        enum: [campaign, queue]
                        description: |
                          P2.3 — the console's noun for a GROUP of work (what
                          /campaigns and its nav entry are called). DISPLAY
                          ONLY: `campaign_id` keeps its name on the wire and in
                          the `X-Floe-Campaign-Id` header whatever this says,
                          so renaming the header never renames the tag.
                          Defaults to `campaign`.
                      plan:
                        type: object
                        description: FLO-701 effective plan summary (resolved by planContext, no extra read). Drives PlanGate, the past-due banner and history clamps in the dashboard.
                        properties:
                          name:
                            $ref: "#/components/schemas/AccountPlanName"
                          source:
                            $ref: "#/components/schemas/AccountPlanSource"
                          limits:
                            $ref: "#/components/schemas/PlanLimits"
                          features:
                            type: array
                            items:
                              $ref: "#/components/schemas/PlanFeature"
                          subscriptionStatus:
                            type: string
                            nullable: true
                          pastDue:
                            type: boolean
                          currentPeriodEnd:
                            type: string
                            format: date-time
                            nullable: true
                          cancelAt:
                            type: string
                            format: date-time
                            nullable: true
                          upgradeUrl:
                            type: string
                  agents:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ManagedAgent"
                        - type: object
                          properties:
                            creditUsed:
                              type: string
        "404":
          description: Developer not registered

  /v1/developer/me:
    patch:
      tags: [Developer]
      summary: Update the account name, console settings, embedded-wallet audit fields, or the wallet opt-in
      operationId: devUpdateMe
      description: |
        Partial update — send only the fields that change (at least one).
        Every field is validated and permission-checked before anything is
        written, so a request refused on any field (400 / 403 / 404) leaves
        the account untouched — including the fields that were valid.

        `displayName` and `customerAttribution` change the ACCOUNT and need the
        owner or admin role. `embeddedWalletAddress` / `embeddedWalletExported`
        concern the Privy embedded wallet for the CDP non-custodial review and
        are accepted only on your own account, once the SERVER has recorded
        your session wallet as your Privy embedded wallet (POST
        /v1/developer/auth/privy does this from Privy's verified linked
        accounts at email / Google sign-in). A Privy user id alone is not
        enough — external-wallet accounts have one too. `walletActivated`
        records the signed-in human's own opt-in to the wallet UI.
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Account name. Owner / admin only.
                customerAttribution:
                  type: string
                  enum: [optional, required]
                  description: |
                    Rebilling T1 — `required` makes the gateway refuse untagged
                    metered calls pre-spend. Owner / admin only.
                unitNoun:
                  type: string
                  enum: [call, conversation, task, meeting, interaction, resolution]
                  description: The console's noun for one unit of work. Display only.
                campaignNoun:
                  type: string
                  enum: [campaign, queue]
                  description: The console's noun for a group of work. Display only.
                embeddedWalletAddress:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{40}$"
                  description: |
                    The Privy embedded wallet. Accepted only as a confirmation
                    of the value the server already recorded — it must equal
                    both the session wallet and the recorded embedded wallet,
                    and never writes. Kept for older dashboards; anything else
                    is 403.
                embeddedWalletExported:
                  type: boolean
                  enum: [true]
                  description: Record a private-key export (audit trail). Requires the server-recorded embedded wallet to be the session wallet; otherwise 403.
                walletActivated:
                  type: boolean
                  enum: [true]
                  description: |
                    FLO-784 — the signed-in human opts into the wallet UI (the
                    dashboard's "Activate wallet" step on Funding). Stamped
                    once on the CALLER's own account, never cleared; a repeat
                    returns the original time. Only `true` is accepted.
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  developer:
                    type: object
                    properties:
                      walletAddress:
                        type: string
                      displayName:
                        type: string
                        nullable: true
                      accountId:
                        type: string
                        nullable: true
                      embeddedWalletAddress:
                        type: string
                        nullable: true
                      embeddedWalletExportedAt:
                        type: string
                        format: date-time
                        nullable: true
                      customerAttribution:
                        type: string
                        enum: [optional, required]
                      walletActivatedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: The signed-in human's own wallet opt-in (see GET /v1/developer/profile).
        "400":
          description: Body is not a JSON object, no updatable field was sent, or a field is invalid (e.g. `walletActivated` other than `true`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Developer credential required
        "403":
          description: Role below owner / admin for an account-level field, or an embedded-wallet field when your own account has no server-recorded embedded wallet equal to the session wallet (external-wallet accounts, signature-only sign-ins, or another account)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Developer not registered — the account, or (with `walletActivated`) your own row when you are acting in a teammate's account

  /v1/developer/keys:
    get:
      tags: [Developer]
      summary: List developer API keys (prefix only)
      operationId: devListDeveloperKeys
      security:
        - developerSession: []
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeySummary"
    post:
      tags: [Developer]
      summary: Mint a developer key (floe_live_*, plaintext shown once)
      description: Owner/admin role required. Emits the `key.created` webhook event.
      operationId: devCreateDeveloperKey
      security:
        - developerSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 100
                permissions:
                  type: string
                  enum: [read, read_write]
      responses:
        "201":
          description: Key created (plaintext `key` shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "409":
          description: >
            plan_limit_exceeded — the account is at its plan's `apiKeysMax`
            (free 5, pro 25, agency 100; Enterprise unlimited). Body carries
            `limit: api_keys`, `max`, `current` and `upgradeUrl`. P2.5 CHANGED
            THIS: it was previously `400 Limit exceeded` against a flat cap of 5.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanLimitExceeded"

  /v1/developer/keys/{keyId}:
    delete:
      tags: [Developer]
      summary: Revoke a developer key
      operationId: devRevokeDeveloperKey
      security:
        - developerSession: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
        "404":
          description: Key not found or already revoked

  /v1/developer/keys/{keyId}/rotate:
    post:
      tags: [Developer]
      summary: Atomic developer-key rotation (revoke + mint)
      description: Emits the `key.rotated` webhook event.
      operationId: devRotateDeveloperKey
      security:
        - developerSession: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 100
                permissions:
                  type: string
                  enum: [read, read_write]
      responses:
        "201":
          description: New key (plaintext `key` shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          description: Key not found or already revoked

  /v1/developer/provider-keys:
    get:
      tags: [Developer]
      summary: List stored BYOK provider keys (masked — never key material)
      operationId: devListProviderKeys
      security:
        - developerSession: []
      responses:
        "200":
          description: Stored vendor keys + the vendors a key can be stored for
          content:
            application/json:
              schema:
                type: object
                properties:
                  providerKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderKeySummary"
                  supportedProviders:
                    type: array
                    items:
                      type: string

  /v1/developer/provider-keys/{provider}:
    put:
      tags: [Developer]
      summary: Save or replace the account's own vendor API key (BYOK)
      description: >
        Owner/admin role required. With a key stored, gateway calls from the
        account's agents route through it — the developer's own vendor credits
        pay for inference and Floe bills only the BYOK service fee; keyless
        rails remain as fallback. The per-request X-Floe-Provider-Key header
        still overrides. Emits the `provider_key.created` webhook event (covers
        replace). The plaintext key is never returned by any endpoint.
      operationId: devPutProviderKey
      security:
        - developerSession: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: Catalog provider id (openai, anthropic, google, ...)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  minLength: 8
                  maxLength: 512
                  description: The vendor API key. Stored AES-256-GCM encrypted.
                label:
                  type: string
                  maxLength: 100
                  description: >
                    When OMITTED on a replace, the existing row's label is
                    preserved.
                enabled:
                  type: boolean
                  description: >
                    New rows default to true. When OMITTED on a replace, the
                    existing row's enabled state is preserved — rotating a key
                    never silently re-enables a deliberately disabled provider.
      responses:
        "201":
          description: Stored (masked summary — plaintext never echoed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeySummary"
        "400":
          description: Unknown provider or invalid key shape
    patch:
      tags: [Developer]
      summary: Enable/disable a stored provider key without re-entering it
      description: Emits the `provider_key.updated` webhook event.
      operationId: devPatchProviderKey
      security:
        - developerSession: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated
        "404":
          description: No stored key for this provider
    delete:
      tags: [Developer]
      summary: Remove a stored provider key (hard delete of the ciphertext)
      description: Emits the `provider_key.deleted` webhook event.
      operationId: devDeleteProviderKey
      security:
        - developerSession: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
        "404":
          description: No stored key for this provider

  /v1/developer/agents/{agentId}/status:
    patch:
      tags: [Developer]
      summary: Pause / resume an agent (kill-switch)
      description: |
        Allowed transitions only: active → suspended (pause) and
        suspended → active (resume). A pause takes effect on the agent's
        next call (agent-key auth 403s suspended agents).
      operationId: devPatchAgentStatus
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        "200":
          description: Updated (idempotent when already in the requested state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                  suspendedReason:
                    type: string
                    nullable: true
        "404":
          description: Agent not found or not owned by caller
        "409":
          description: invalid_status_transition | status_conflict

  /v1/developer/agents/{agentId}/funding:
    get:
      tags: [Developer]
      summary: Machine-readable funding instructions
      operationId: devGetAgentFunding
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Funding card — deposit address, chain, token contract, forwarding status, spendable balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingInstructions"
        "404":
          description: Agent not found or not owned by caller
        "409":
          description: agent_not_provisioned (no deposit wallet yet)

  /v1/developer/agents/{agentId}/self-service-lock:
    get:
      tags: [Developer]
      summary: Read the agent's tighten-only lock
      operationId: devGetSelfServiceLock
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lock state
          content:
            application/json:
              schema:
                type: object
                properties:
                  locked:
                    type: boolean
        "404":
          description: Agent not found or not owned by caller
    put:
      tags: [Developer]
      summary: Set the agent's tighten-only lock
      description: |
        When locked, the agent's OWN key may only tighten its guardrails —
        PUT /v1/agents/spend-limit must lower the cap, DELETE is refused,
        and policy writes may only add/tighten. Developer-authed surfaces
        are unaffected.
      operationId: devSetSelfServiceLock
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              properties:
                locked:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  locked:
                    type: boolean
        "404":
          description: Agent not found or not owned by caller

  /v1/developer/agents/{agentId}/credit-line-bounds:
    get:
      tags: [Developer]
      summary: Credit-line preview — LTV bounds, funded balances, in-flight/active loan
      operationId: devGetCreditLineBounds
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bounds + balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  minLtvBps:
                    type: integer
                  maxLtvBps:
                    type: integer
                  maxRateBpsCap:
                    type: integer
                  agentMaxRateBps:
                    type: integer
                    nullable: true
                  walletBalanceRaw:
                    type: string
                  spendableBalanceRaw:
                    type: string
                  paymentSignerWalletAddress:
                    type: string
                    nullable: true
                  fundingMode:
                    type: string
                    enum: [wallet, credit_line]
                  fundedSpendableRaw:
                    type: string
                    nullable: true
                  fundedPendingRaw:
                    type: string
                    nullable: true
                  availableRaw:
                    type: string
                    nullable: true
                    description: |
                      Ledger-derived spendable balance for EVERY funding mode (raw
                      6-dp USDC) — the exact number every enforcement path gates on
                      (x402 tools, phone rental, the limit chain, Test-a-call). This
                      is the "Spendable now" figure; walletBalanceRaw /
                      spendableBalanceRaw are on-chain holdings, which the ledger may
                      or may not count. Null only on a ledger derive failure.
                  ledgerSpentRaw:
                    type: string
                    nullable: true
                    description: Ledger creditOut (settled + in-flight spend, platform fee included) that pairs with availableRaw.
                  ledgerCreditInRaw:
                    type: string
                    nullable: true
                    description: Ledger creditIn (wallet_credits for wallet mode, active loan principal for credit_line). availableRaw = creditIn − ledgerSpentRaw − unspent task holds.
                  inFlightLoan:
                    type: object
                    nullable: true
                  activeLoan:
                    type: object
                    nullable: true
                  closePreview:
                    type: object
