                    $ref: "#/components/schemas/ActionOutcome"
        "400":
          description: invalid_action_id or invalid body
        "404":
          description: Agent not found or not owned by caller

  # ── P3.1 · the OPERATOR half of the outcome fact ───────────────────────────
  #
  # An agent key REPORTS a claim (POST /v1/agents/outcomes). Everything that
  # moves money — confirming, voiding, resolving a collision — lives here, on a
  # developer credential, because the evidence that justifies it (a CRM
  # webhook, a calendar invitation) reaches the operator's backend minutes to
  # days after the call and never the agent's process.
  #
  # Every write is append-only: a NEW event superseding the old, never an
  # UPDATE. `source` and `asserted_by` are stamped from the credential at write
  # and frozen, so a dispute a year out reads the value as it was rather than a
  # recomputation under whatever rules apply then.

  /v1/developer/outcomes/{eventId}/confirm:
    post:
      tags: [Developer]
      summary: Confirm an outcome claim — the act that makes it billable
      description: |
        Only `operator` and `client` confirmations may bill, which is why this
        is not reachable with an agent key.

        Appends a new `confirmed` event superseding the reported one and
        re-binds it to the same call — the predecessor's binding belongs to the
        predecessor, and a confirmed claim that lost its binding would be
        invisible to every rollup that reads through one.

        `confirmedAt` is the billing anchor for THIS confirmation, and the
        server stamps it at the moment of confirmation — it is not a request
        field, so a caller cannot choose which period a confirmation lands in.
        A later reversal anchors on its own, never on this one, which is what
        keeps a closed statement immutable.

        Operator evidence wins where given; otherwise the reported claim's own
        evidence carries forward rather than being dropped.
      operationId: devConfirmOutcomeClaim
      security:
        - developerSession: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            pattern: '^oev_[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey:
                  type: string
                  maxLength: 200
                  description: Required — an operator's backend retries too.
                quantity:
                  type: integer
                  minimum: 1
                  description: >
                    Corrects the reported count, e.g. the CRM shows two
                    meetings booked against one call.
                externalSystem:
                  type: string
                  maxLength: 64
                externalRef:
                  type: string
                  maxLength: 256
                  description: Stored verbatim; case-sensitive.
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Replay of a known idempotency key — the stored event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEventEnvelope'
        "201":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEventEnvelope'
        "400":
          description: Invalid body, or an unknown field (rejected, not ignored)
        "403":
          description: Requires the admin role
        "404":
          description: outcome_not_found
        "409":
          description: >
            outcome_claim_billed — the claim sits in a closed statement, which
            is immutable. The correction is a reversal in the next open period,
            never an edit.

  /v1/developer/outcomes:
    get:
      tags: [Developer]
      summary: List outcome claims — discovery by the call, not by the event id
      description: |
        The read half of the outcome fact. Until this existed a claim could be
        created and corrected but never looked up, which is why discovery here
        is by the CALL — `taskId`, `interactionId`, `customerId`, `campaignId`
        — and not by an `oev_…` nobody has yet. The event id from an emit
        response or a webhook is the shortcut, not the front door.

        Returns CHAIN HEADS only. A corrected claim's predecessors are history
        and are reachable through `GET /v1/developer/outcomes/{eventId}`;
        listing them here would double-count one fact.

        UNBOUND CLAIMS ARE RETURNED, never dropped. A claim with no current
        binding comes back with `binding.unresolvedReason` instead of a call.
        Hiding it would leave a silent hole in the number this lane exists to
        produce.

        `binding.matchedVia` is the claim's own identifier kind — HOW it
        reached the call. It is derived, not a stored column: `matched_via`
        lives on `interaction_legs`, and a binding has no such field.

        Ranges key on one of two anchors (`anchor`). `spend`, the default, is
        `occurredAt`: when the work HAPPENED, like every other range read in
        this lane. `report` is `receivedAt`: when Floe was TOLD. They differ
        whenever an outcome is reported late. Neither is `confirmedAt` —
        anchoring on that would hide every reported-but-unconfirmed claim
        from a range that plainly contains it.

        This is NOT the billable-in-period view. That one anchors on
        `confirmedAt` and belongs to Phase 4 pricing; here a claim appears as
        soon as it is reported, confirmed or not.
      operationId: devListOutcomes
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: anchor
          in: query
          description: >
            Which time the range and ordering use: `spend` (occurredAt, when
            the work happened) or `report` (receivedAt, when Floe was told).
            Page with the same anchor you started with — the cursor holds
            that anchor's timestamp.
          schema: { type: string, enum: [spend, report], default: spend }
        - name: taskId
          in: query
          description: >
            Claims bound to a call carrying this task id. Matched through the
            call's `floe_task` link, so a claim keyed on a CallSid is still
            found by the task id you know.
          schema: { type: string }
        - name: interactionId
          in: query
          schema: { type: string, pattern: '^int_[0-9a-f]{16}$' }
        - name: customerId
          in: query
          schema: { type: string }
        - name: campaignId
          in: query
          schema: { type: string }
        - name: outcomeKind
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: Comma-separated subset.
          schema:
            type: string
            example: reported,confirmed
        - name: source
          in: query
          schema:
            type: string
            enum: [agent, operator, orchestrator, client, floe]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: cursor
          in: query
          description: Opaque keyset cursor; pass a previous page's nextCursor verbatim.
          schema: { type: string }
      responses:
        "200":
          description: A page of outcome claims
          content:
            application/json:
              schema:
                type: object
                required: [outcomes, nextCursor, hasMore, range, anchor, historyFloor, historyClamped]
                properties:
                  outcomes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutcomeClaimRow'
                  anchor:
                    type: string
                    enum: [spend, report]
                    description: The time anchor this page's range and order used.
                  nextCursor:
                    type: string
                    nullable: true
                  hasMore:
                    type: boolean
                  range:
                    type: object
                    required: [since, until]
                    properties:
                      since: { type: string, format: date-time }
                      until: { type: string, format: date-time }
                  historyFloor:
                    type: string
                    nullable: true
                    description: The plan's history floor, when the range was clamped to it.
                  historyClamped:
                    type: boolean
        "400":
          description: Invalid query parameter
        "403":
          description: Plan lacks `ledger_read`

  /v1/developer/outcomes/{eventId}:
    get:
      tags: [Developer]
      summary: One outcome claim — the current head, with its chain
      description: |
        A SAVED LINK TO A CORRECTED CLAIM NEVER 404s. Naming any event in a
        chain answers with the CURRENT head and reports which id was asked
        for, the same courtesy `GET /v1/developer/interactions/{publicId}`
        extends to a merged call. `isHead` tells you whether the id you held
        is still the billable one.

        The head is resolved through the claim's identity tuple — vendor,
        identifier kind, identifier, outcome kind — which is exactly what the
        current-claim unique index keys on.

        `predecessors` walks back through what this claim corrected, newest
        first, capped at 32 hops: a cycle is corruption, and a read must not
        spin on one.

        `assertedBy` appears here and NOT on the agent surface. It carries a
        key id or a wallet, frozen at write, and answering "who asserted this?"
        a year later is the operator's question, not the agent's.
      operationId: devGetOutcome
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            pattern: '^oev_[0-9a-f]{16}$'
      responses:
        "200":
          description: The claim, its binding and its chain
          content:
            application/json:
              schema:
                type: object
                required: [requested, isHead, outcome, predecessors]
                properties:
                  requested:
                    type: string
                    description: The event id asked for, which may not be the head.
                  isHead:
                    type: boolean
                  outcome:
                    $ref: '#/components/schemas/OutcomeClaimRow'
                  predecessors:
                    type: array
                    description: What this claim corrected, newest first.
                    items:
                      type: object
                      required: [eventId, status, quantity, source, assertedBy, occurredAt, receivedAt, confirmedAt, supersededAt, billedInPeriodId]
                      properties:
                        eventId: { type: string, pattern: '^oev_[0-9a-f]{16}$' }
                        status: { type: string, enum: [reported, confirmed, disputed, void, reversed] }
                        quantity: { type: integer }
                        source: { type: string, enum: [agent, operator, orchestrator, client, floe] }
                        assertedBy: { type: string }
                        occurredAt: { type: string, format: date-time }
                        receivedAt: { type: string, format: date-time }
                        confirmedAt: { type: string, format: date-time, nullable: true }
                        supersededAt: { type: string, format: date-time, nullable: true }
                        billedInPeriodId: { type: integer, nullable: true }
        "400":
          description: Malformed outcome id
        "404":
          description: No claim with this id exists in the account
        "403":
          description: Plan lacks `ledger_read`

  /v1/developer/outcomes/{eventId}/reverse:
    post:
      tags: [Developer]
      summary: Reverse a billed outcome claim
      description: |
        P4.4. Only a claim already billed on a closed statement can be
        reversed (an unbilled one is voided: 409 `outcome_claim_not_billed`).
        The statement never changes: the hourly carry prices the reversal from
        the origin period's quantity snapshot under the origin card version
        (included allotments and tiers make this non-linear) and writes a
        `true_up` credit line in the customer's next open period, then stamps
        the reversal with that period. Admin role.
      operationId: devReverseOutcomeClaim
      security:
        - developerSession: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            pattern: '^oev_[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The reversal event
        "200":
          description: Idempotent replay
        "404":
          description: outcome_not_found
        "409":
          description: outcome_claim_not_billed, or outcome_claim_conflict
  /v1/developer/outcomes/{eventId}/void:
    post:
      tags: [Developer]
      summary: Retire an outcome claim
      description: |
        `duplicateOfEventId` is a justification, not a guess: set it only when
        duplication was PROVEN by an identical (externalSystem, externalRef) or
        idempotency key. An *inferred* duplicate stays an
        `outcome_claim_collision` finding for a human — Floe never picks.
      operationId: devVoidOutcomeClaim
      security:
        - developerSession: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            pattern: '^oev_[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey:
                  type: string
                  maxLength: 200
                duplicateOfEventId:
                  type: string
                  pattern: '^oev_[0-9a-f]{16}$'
                  description: The surviving claim this one duplicates.
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Replay of a known idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEventEnvelope'
        "201":
          description: Voided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEventEnvelope'
        "400":
          description: Invalid body, or an unknown field
        "403":
          description: Requires the admin role
        "404":
          description: outcome_not_found
        "409":
          description: outcome_claim_billed

  /v1/developer/outcomes/collisions/confirm-distinct:
    post:
      tags: [Developer]
      summary: Resolve an outcome collision as two real facts
      description: |
        Two current claims of one kind on one call is a legal state meaning
        something exact: the system knows the rows describe one call and cannot
        know whether they are one meeting reported twice (a post-call webhook
        against the orchestrator id AND the agent against the task id) or two
        meetings genuinely booked. It picks neither and opens a finding.

        This is one of the two resolutions. The other is a void with
        `duplicateOfEventId`, after which the survivor rates alone. Here the
        operator asserts both are genuine, both rate, and each keeps its own
        evidence trail rather than collapsing into one row.

        It acts on the FINDING, not on an event — the finding is what named the
        ambiguity, so clearing it is what records the answer. Resolution is
        `acknowledged`: a human decided, as distinct from `auto_cleared`, which
        is the machine's verdict.
      operationId: devConfirmOutcomeDistinct
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interactionId, outcomeKind]
              properties:
                interactionId:
                  type: string
                  pattern: '^int_[0-9a-f]{16}$'
                outcomeKind:
                  type: string
                  maxLength: 64
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Resolved — both claims now rate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved:
                    type: string
                    description: The finding key that was cleared.
                  claimsRating:
                    type: string
                    enum: [both]
        "400":
          description: Invalid body, or an unknown field
        "403":
          description: Requires the admin role
        "404":
          description: collision_not_found — no open collision for that call and kind

  # ── FLO-746 · vendor actuals ───────────────────────────────────────────────
  #
  # Two halves with two different gates. The READS ride Pro's existing
  # `attribution_reports`: a Pro agency already pays for cost attribution and
  # must not find its cost column paywalled. The credential-holding,
  # money-asserting WRITES (connections, invoice documents, foot, finding
  # resolution) ride the Agency feature `vendor_connections`, mirroring
  # `stripe_connect`.
  #
  # THE ACCURACY CONTRACT, which every response below obeys:
  #   * `costRaw` is null for `pending` and `manual` legs. No cost, ever,
  #     without a current stamp of exact / period-rate / invoiced.
  #   * `exact` and `period-rate` carry SEPARATE subtotals and are never summed
  #     into an "exact" figure.
  #   * a row gets a single `totalRaw` only when every leg in it is
  #     exact/period-rate/invoiced AND USD-denominated; otherwise `totalRaw` is
  #     null with `totalLabel: "partial — lower bound"`. Never zero, never a
  #     partial sum.
  #   * non-USD actuals are never FX-converted. They render null with
  #     `nonUsd: true` and the vendor's verbatim string in `provenance`.
  #   * every query filters `cost_owner = 'developer'`. Floe-carried legs
  #     (cost_owner = platform) are Floe's COGS and are omitted ENTIRELY — not
  #     shown at zero. Every response echoes `costOwner` to say so.
  #   * cursors are keyset. Range-wide totals come from a second aggregate
  #     query, never summed from the page.
  /v1/developer/vendor-connections:
    get:
      tags: [Developer]
      summary: List vendor billing connections (masked)
      description: |
        Read-only vendor billing credentials Floe uses to pull each vendor's own
        cost records. Responses carry the non-secret `credentialPublic` mask
        only — never credential material, and never the sealed ciphertext. The
        mask keeps identifiers (region, project id, account SID) verbatim,
        because recognising WHICH of two Twilio subaccounts a row is IS the
        point of a mask; secrets are elided head/tail and key material gets a
        length. Also returns `credentialFields` (which fields each credential
        kind needs) and `connectors` (which vendors are connectable, and the
        best status each can ever reach) so a client never hardcodes the form.
        Agency plan (`vendor_connections` feature); any role.
      operationId: devListVendorConnections
      security:
        - developerSession: []
        - developerApiKey: []
      responses:
        "200":
          description: Connections plus the form catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        vendor: { type: string }
                        name: { type: string }
                        kind:
                          type: string
                          enum: [api_key, basic_auth, aws_sigv4, gcp_service_account, azure_client_secret, oauth_client]
                        credentialPublic:
                          type: object
                          description: Non-secret per-kind mask. Never credential material.
                          additionalProperties: { type: string }
                        credentialUnreadable: { type: boolean }
                        status:
                          type: string
                          enum: [unverified, active, degraded, unauthorized, disabled]
                        enabled: { type: boolean }
                        bestStatus:
                          type: string
                          nullable: true
                          enum: [exact, period-rate, manual]
                          description: The ceiling status a leg served by this connection can ever reach.
                        capabilities:
                          type: object
                          additionalProperties: { type: string }
                        lastSuccessAt: { type: string, nullable: true }
                        lastError: { type: string, nullable: true }
                        freshnessSlaMinutes: { type: integer }
                        actualsSlaHours: { type: integer }
                        billingTimeZone: { type: string }
                        captureSince: { type: string, nullable: true }
                  credentialFields:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
                  connectors:
                    type: array
                    items:
                      type: object
        "403":
          description: plan_required — the Agency `vendor_connections` feature
    post:
      tags: [Developer]
      summary: Create or re-key a vendor billing connection
      description: |
        Create-or-replace by (account, vendor, name) — two Twilio subaccounts
        are two rows with two names. Re-keying goes through THIS route rather
        than PATCH: the upsert re-seals with a fresh IV, re-derives the mask,
        clears `credentialUnreadable` and the failure counter, re-arms a
        disabled row, and RESETS `status` to `unverified` — the old scope check
        said nothing about the new key, so the row must be verified again
        before anything trusts it.

        `credential` is projected onto exactly the fields the `kind` declares;
        anything else is dropped rather than sealed. 400 `invalid_credential`
        names the missing fields, 400 `unknown_vendor` refuses a vendor with no
        billing connector (a connection that can never pull anything), and 400
        `invalid_time_zone` refuses a non-IANA `billingTimeZone` — the zone is
        the VENDOR's billing zone, and an unchecked guess there is a permanent
        silent coverage gap on any vendor that cuts daily buckets locally.
        Agency plan; owner/admin role.
      operationId: devCreateVendorConnection
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, name, kind, credential]
              properties:
                vendor:
                  type: string
                  maxLength: 64
                  description: A registered connector id (twilio, telnyx, deepgram, openai, anthropic, bedrock, gcp, azure, elevenlabs, cartesia, assemblyai, rime, sarvam).
                name:
                  type: string
                  maxLength: 64
                kind:
                  type: string
                  enum: [api_key, basic_auth, aws_sigv4, gcp_service_account, azure_client_secret, oauth_client]
                credential:
                  type: object
                  description: The per-kind fields, e.g. { accountSid, authToken } for basic_auth. Sealed at rest; never returned.
                  additionalProperties: { type: string }
                billingTimeZone:
                  type: string
                  description: IANA zone the VENDOR cuts its billing buckets in.
                freshnessSlaMinutes: { type: integer, minimum: 5, maximum: 10080 }
                actualsSlaHours: { type: integer, minimum: 1, maximum: 720 }
                captureSince: { type: string, nullable: true }
      responses:
        "201":
          description: Stored (masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { type: object }
        "400":
          description: invalid_body, invalid_credential, unknown_vendor, or invalid_time_zone
        "403":
          description: plan_required (Agency) or Forbidden (admin role)
  /v1/developer/vendor-connections/{id}:
    get:
      tags: [Developer]
      summary: One vendor billing connection (masked)
      description: |
        Cross-account ids 404 rather than 403 — a 403 would confirm the row
        exists. Agency plan; any role.
      operationId: devGetVendorConnection
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connection (masked)
        "404":
          description: connection_not_found
    patch:
      tags: [Developer]
      summary: Enable, disable, or retune a vendor billing connection
      description: |
        Non-secret settings only. Credential material is NOT accepted here —
        re-keying is POST /vendor-connections, so the mask, the seal version and
        the verification reset always move together. Changing `billingTimeZone`
        RESETS verification, because verify is where a vendor's bucket zone is
        cross-checked against its per-call price sums: a verification taken under
        the old zone says nothing about the new one.
        Agency plan; owner/admin role.
      operationId: devUpdateVendorConnection
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                billingTimeZone: { type: string }
                freshnessSlaMinutes: { type: integer, minimum: 5, maximum: 10080 }
                actualsSlaHours: { type: integer, minimum: 1, maximum: 720 }
                captureSince: { type: string, nullable: true }
      responses:
        "200":
          description: Updated (masked)
        "400":
          description: invalid_body or invalid_time_zone
        "403":
          description: plan_required (Agency) or Forbidden (admin role)
        "404":
          description: connection_not_found
    delete:
      tags: [Developer]
      summary: Disable a vendor billing connection (soft delete)
      description: |
        There is no hard delete anywhere in this lane. The actuals and stamps
        this connection already produced are never retracted — they are
        append-only and the dollars were real. What stops is the pull: legs this
        vendor would have resolved now stay `pending`, and will block a period
        close once the vendor's `actualsSlaHours` window lapses.
        Agency plan; owner/admin role.
      operationId: devDeleteVendorConnection
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Disabled (the row survives, masked)
        "403":
          description: plan_required (Agency) or Forbidden (admin role)
        "404":
          description: connection_not_found
  /v1/developer/vendor-connections/{id}/verify:
    post:
      tags: [Developer]
      summary: Verify a stored vendor billing credential against the vendor
      description: |
        The one route that opens the sealed box, and the only one that can tell
        an operator WHICH seal failure they have — the two need different fixes,
        so they get different codes and different messages:

        * 409 `sealed_key_unavailable` — the box names an encryption key this
          deployment no longer holds. Nothing is lost: set
          PROVIDER_KEY_ENCRYPTION_SECRET_PREVIOUS and reseal, or re-enter the
          credential.
        * 409 `sealed_credential_integrity` — the key id matched but the auth
          tag did not. The row was modified. Do NOT reseal; investigate first.

        Both mark the row `credentialUnreadable` and `unauthorized`, because a
        silently dead connector inside an audit system is worse than a loud one.

        Otherwise: 200 on success (records `scopesVerifiedAt`, status `active`),
        409 `verification_failed` with the connector's own operator-facing
        `detail` when the vendor refuses the credential (status becomes
        `unauthorized` for a scope/auth refusal, `degraded` otherwise), 409
        `connector_unavailable` when this deployment has no connector for the
        vendor, and 502 `verification_unavailable` when the vendor could not be
        reached — the credential is unchanged in that case.
        Agency plan; owner/admin role.
      operationId: devVerifyVendorConnection
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: { type: object }
                  verification:
                    type: object
                    properties:
                      ok: { type: boolean }
                      reason: { type: string, nullable: true }
                      detail: { type: string, nullable: true }
                      discovered:
                        type: object
                        nullable: true
                        description: Facts the connector discovered (project ids, subaccounts). Never credential material.
        "403":
          description: plan_required (Agency) or Forbidden (admin role)
        "404":
          description: connection_not_found
        "409":
          description: sealed_key_unavailable, sealed_credential_integrity, connector_unavailable, or verification_failed
        "502":
          description: verification_unavailable — the vendor could not be reached
  /v1/developer/actuals/assurance:
    get:
      tags: [Developer]
      summary: Reconciliation assurance — % of COGS reconciled to vendor actuals
      description: |
        The ONE reconciliation-assurance scalar for the /actuals and /close
        finance surfaces, computed in a single aggregate (never paginated).

        FREE (`ledger_read`) — the wedge; it must not 403 on Free, unlike the
        Pro `/actuals/rollups`.

        ACCOUNT scope (no `customerId`): `coverageBps` = reconciled ÷
        (reconciled + pending/manual captured cost + residual), where
        reconciled = Σ exact/period-rate/invoiced stamp cost over CURRENT
        (non-superseded) USD legs in the half-open window, captured cost is the
        Floe-metered payment of legs not yet reconciled (deduped per
        proxy_request, exactly as the per-client scope), and residual = Σ
        `uncaptured_usage` period adjustments. The true "% of this period's
        COGS reconciled to vendor actuals". (Before this fix the account
        denominator omitted captured legs still pending, so $100 matched
        against $9,900 pending read as 100%.)

        Grades: `reconciledRaw` and `unreconciledRaw` each carry a figure grade
        + mix (see FigureGrade): exact/invoiced → A, period-rate → B, residual
        → B, captured cost → the provenance of its money row. `coverageBps` is
        a ratio and is not graded.

        PER-CLIENT scope (`customerId`): `coverageBps` = reconciled ÷
        (reconciled + that client's pending/manual Floe-metered captured cost,
        from `proxy_requests.payment_amount_raw`, DEDUPED per proxy_request). The
        account residual is unattributable to a customer and is EXCLUDED.

        `coverageBps` is null when the window has no known spend, OR when it
        holds non-USD spend — in which case `coverageBlockedBy` is `["non_usd"]`
        (no FX anywhere; the ratio is suppressed, never filter-and-understated).
      operationId: devActualsAssurance
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound. Defaults to 30 days before `until`; clamped to the plan's history floor.
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound. Defaults to now.
        - name: customerId
          in: query
          schema: { type: string }
          description: Present → per-client scope (of this client's captured spend). Absent → account scope.
      responses:
        "200":
          description: The reconciliation-assurance scalar for the scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualsAssuranceResponse"
              example:
                scope: account
                reconciledRaw: "8000000"
                reconciledGrade: B
                reconciledGradeMix: { A: "6000000", B: "2000000", C: "0", D: "0" }
                unreconciledRaw: "4000000"
                unreconciledGrade: B
                unreconciledGradeMix: { A: "0", B: "4000000", C: "0", D: "0" }
                unreconciledHeldRaw: "0"
                coverageBps: 6666
                coverageBlockedBy: []
                range: { since: "2026-09-01T00:00:00.000Z", until: "2026-09-29T00:00:00.000Z" }
                historyFloor: null
                historyClamped: false
        "400":
          description: invalid_query (malformed since/until)

  /v1/developer/actuals/cogs-by-channel:
    get:
      tags: [Developer]
      summary: COGS by channel — the per-channel share of captured vendor cost
      description: |
        Per-CHANNEL COGS over the window: what voice, SMS, chat, email, video
        and non-call jobs each cost. Drives the COGS-home channel band.

        FREE (`ledger_read`), like `/actuals/cogs-by-leg`, and deliberately not
        the Pro `/interactions/rollups?by=channel`: that route is
        interaction-grain and INNER-joined through the task bindings, so an
        unbound leg's spend is absent from it. This one groups the SAME legs,
        with the SAME reconciliation-stamp cost, scope, range and filters as
        `/actuals/cogs-by-leg`, so the two dimensions FOOT to each other —
        `totalRaw` here equals `totalRaw` there for the same query.

        Cost is the reconciliation stamp's cost and sums USD stamps only; a
        pending or non-USD leg adds 0 while still being counted in `legs`.
        Reconciled cost is SIGNED: a vendor credit makes a channel's `costRaw`
        (and `totalRaw`) negative, and must never be clamped to zero.

        An UNTAGGED leg (`vendor_legs.channel` is null) falls back to its leg
        kind — voice kinds → `voice`, anything else → `job`, mirroring the
        resolver — so every captured leg is bucketed, never dropped. `job` is
        therefore the untagged-non-voice bucket, not a channel anyone chose.
      operationId: devActualsCogsByChannel
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound. Defaults to 30 days before `until`; clamped to the plan's history floor.
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound. Defaults to now.
        - name: vendor
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: agentId
          in: query
          schema: { type: string }
        - name: campaignId
          in: query
          schema: { type: string }
        - name: taskId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
          description: Comma-separated subset of the reconciliation statuses (exact, period-rate, invoiced, pending, manual).
      responses:
        "200":
          description: Per-channel COGS for the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualsCogsByChannelResponse"
        "400":
          description: invalid_query (malformed since/until, or an unknown status)

  /v1/developer/actuals/legs:
    get:
      tags: [Developer]
      summary: Captured vendor legs with their current cost resolution
      description: |
        Keyset-paginated over (occurredAt, id). Pass `nextCursor` back verbatim;
        a tampered cursor 400s `invalid_query` rather than feeding garbage into
        the keyset predicate.

        `costRaw` is 6-dp USDC integer text and is NULL for `pending`, `manual`,
        group-scoped and non-USD legs. A leg the reconcile pass has not reached
        yet has no stamp at all and reads as `pending` — it is not missing, and
        it counts toward `subtotals.unstampedLegs`.

        `subtotals` is a SECOND, range-wide aggregate — never the page summed.
        It carries per-status counts and sums, and a single `totalRaw` only when
        nothing in the range blocks one (`totalBlockedBy` names what did).

        Pro plan (`attribution_reports`); any role.
      operationId: devListVendorLegs
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound. Defaults to 30 days before `until`; clamped to the plan's history floor.
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound. Defaults to now.
        - name: vendor
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: agentId
          in: query
          schema: { type: string }
        - name: campaignId
          in: query
          schema: { type: string }
        - name: taskId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
          description: Comma-separated subset of pending, manual, exact, period-rate, invoiced.
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of legs plus range-wide subtotals
          content:
            application/json:
              schema:
                type: object
                properties:
                  legs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        occurredAt: { type: string }
                        vendor: { type: string }
                        legKind: { type: string }
                        captureSource: { type: string }
                        vendorRequestId: { type: string, nullable: true }
                        units:
                          type: object
                          additionalProperties: { type: string }
                        unitsProvenance:
                          type: string
                          enum: [vendor_reported, floe_measured, caller_reported]
                        attribution: { type: object }
                        status:
                          type: string
                          enum: [pending, manual, exact, period-rate, invoiced]
                        grain: { type: string }
                        costScope:
                          type: string
                          enum: [leg, group, period]
                        groupKey: { type: string, nullable: true }
                        costRaw:
                          type: string
                          nullable: true
                          description: 6-dp USDC integer text. NULL for pending, manual, group-scoped and non-USD legs. Never 0 in place of "unknown".
                        currency: { type: string }
                        nonUsd:
                          type: boolean
                          description: True when the vendor billed in something other than USD. Never FX-converted.
                        provenance:
                          type: object
                          description: Status reason, the vendor's verbatim cost string and unit, the actual/rate ids and versions, and the stamp's revision.
                  nextCursor: { type: string, nullable: true }
                  hasMore: { type: boolean }
                  range: { type: object }
                  costOwner:
                    type: string
                    enum: [developer]
                    description: Always `developer`. Floe-carried legs are omitted entirely — see `costOwnerNote`.
                  costOwnerNote: { type: string }
                  subtotals:
                    type: object
                    description: >
                      Range-wide figures from a SECOND aggregate query, never the
                      page summed. `perStatus` carries per-status counts and sums;
                      it is NULL when the request used a filter the aggregate
                      cannot apply (`unsupportedFilters` names them), because a
                      figure computed over a wider scope than the rows beside it
                      is a wrong number with a confident label. `legs`,
                      `unstampedLegs`, `nonUsdLegs` and `groupScopeLegs` honour
                      every filter and are always accurate. `totalRaw` is a
                      single combined figure only when nothing blocks one —
                      `totalBlockedBy` names what did (empty_scope,
                      unresolved_legs, manual_legs, non_usd, group_scope,
                      filtered_scope).
                    properties:
                      perStatus: { type: object, nullable: true }
                      unsupportedFilters:
                        type: array
                        items: { type: string }
                      legs: { type: integer }
                      unstampedLegs: { type: integer }
                      nonUsdLegs: { type: integer }
                      groupScopeLegs: { type: integer }
                      totalRaw: { type: string, nullable: true }
                      totalBlockedBy:
                        type: array
                        items: { type: string }
                      totalLabel: { type: string, nullable: true }
                  historyFloor: { type: string, nullable: true }
                  historyClamped: { type: boolean }
        "400":
          description: invalid_query (since, until, status, cursor)
        "403":
          description: plan_required — the Pro `attribution_reports` feature
  /v1/developer/actuals/legs.csv:
    get:
      tags: [Developer]
      summary: Server-rendered CSV of vendor legs
      description: |
        The same scope and filters as GET /actuals/legs, rendered server-side so
        a large export is an `<a href>` rather than a client-side blob. Every
        field goes through the formula-injection guard — vendor request ids and
        invoice line descriptions are vendor-controlled strings and they reach
        this file.

        `cost_raw` is BLANK, never `0`, wherever there is no resolution: a zero
        in a spreadsheet column named "cost" is a claim, a blank is the truth.
        Over 100,000 rows the request is REFUSED with 413 `export_too_large`
        rather than truncated — a short CSV opened in a spreadsheet is
        indistinguishable from a complete one. `historyFloor` and
        `historyClamped` ride on the X-Floe-History-Floor and
        X-Floe-History-Clamped response headers and in the file's `#` preamble.
        Pro plan (`attribution_reports` and `exports`); any role.
      operationId: devExportVendorLegsCsv
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: vendor
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: text/csv
          content:
            text/csv:
              schema:
                type: string
        "403":
          description: plan_required — `attribution_reports` and `exports`
        "413":
          description: export_too_large — narrow the range or add a filter
  /v1/developer/actuals/calls:
    get:
      tags: [Developer]
      summary: By-call rollup of vendor cost (server-side grouping)
      description: |
        Groups server-side on `COALESCE(task_id, 'leg:' || legId)` — a leg with
        no task id is its own call. The GROUPS are keyset-paginated and each
        selected group is then loaded WHOLE, so a call is either fully counted
        or not on the page at all. There is no truncating cap that could drop a
        leg out of a group and leave an unlabelled lower bound.

        Each row carries a composition line, a SEPARATE `exactRaw` and
        `periodRateRaw` (D4 — these are different claims and are never summed
        into an "exact" figure), and a single `totalRaw` ONLY when every leg in
        the call is exact/period-rate/invoiced and USD-denominated. Otherwise
        `totalRaw` is null and `totalLabel` is "partial — lower bound", with
        `totalBlockedBy` naming the reasons. Never zero, never a partial sum.
        Pro plan (`attribution_reports`); any role.
      operationId: devListVendorCalls
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: vendor
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: agentId
          in: query
          schema: { type: string }
        - name: campaignId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of calls plus range-wide subtotals
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: array
                    items:
                      type: object
                      properties:
                        callKey: { type: string }
                        taskId: { type: string, nullable: true }
                        legCount: { type: integer }
                        firstOccurredAt: { type: string }
                        lastOccurredAt: { type: string }
                        vendors:
                          type: array
                          items: { type: string }
                        composition:
                          type: object
                          properties:
                            exact: { type: integer }
                            periodRate: { type: integer }
                            invoiced: { type: integer }
                            pending: { type: integer }
                            manual: { type: integer }
                            groupLegs: { type: integer }
                        exactRaw: { type: string }
                        periodRateRaw: { type: string }
                        invoicedRaw: { type: string }
                        groupsRaw: { type: string }
                        totalRaw:
                          type: string
                          nullable: true
                          description: Null unless every leg is exact/period-rate/invoiced AND USD. Never 0, never a partial sum.
                        totalLabel:
                          type: string
                          nullable: true
                          description: '"partial — lower bound" whenever totalRaw is null.'
                        totalBlockedBy:
                          type: array
                          items: { type: string }
                        nonUsd: { type: boolean }
                  nextCursor: { type: string, nullable: true }
                  hasMore: { type: boolean }
                  costOwner: { type: string, enum: [developer] }
                  subtotals:
                    type: object
                    description: Same range-wide block as GET /actuals/legs — `perStatus` is null under a filter the aggregate cannot apply.
                  historyFloor: { type: string, nullable: true }
                  historyClamped: { type: boolean }
        "400":
          description: invalid_query
        "403":
          description: plan_required — the Pro `attribution_reports` feature
  /v1/developer/actuals/rollups:
    get:
      tags: [Developer]
      summary: Vendor cost rolled up by customer, campaign, agent, vendor, day, channel, or task type
      description: |
        Same row shape and the same total rules as /actuals/calls, grouped on a
        different key. `by=time` buckets by UTC calendar day. `by=channel`
        groups on each leg's X-Floe-Channel tag; an untagged leg counts as
        `voice` (voice leg kinds) or `job`. `by=task_type` groups on
        X-Floe-Task-Type, resolved through the leg's binding so every leg of
        one task shares a bucket and this key set matches
        /interactions/rollups?by=task_type; unlike channel there is no fallback
        to derive a type from, so an untagged leg is `(none)`. Groups are
        keyset-paginated and loaded whole. Pro plan (`attribution_reports`);
        any role.
      operationId: devListVendorRollups
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: by
          in: query
          schema:
            type: string
            enum: [customer, campaign, agent, vendor, time, channel, task_type]
            default: customer
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: vendor
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of rollup rows plus range-wide subtotals
          content:
            application/json:
              schema:
                type: object
