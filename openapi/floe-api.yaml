        cursor), use GET /v1/developer/webhook-deliveries.
      operationId: devListWebhookDeliveries
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
