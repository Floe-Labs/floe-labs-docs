                  by: { type: string }
                  rollups:
                    type: array
                    items: { type: object }
                  nextCursor: { type: string, nullable: true }
                  hasMore: { type: boolean }
                  costOwner: { type: string, enum: [developer] }
                  subtotals:
                    type: object
