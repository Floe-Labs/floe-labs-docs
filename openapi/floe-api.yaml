        "403":
          description: plan_required — the Pro `attribution_reports` feature
  /v1/developer/actuals/findings:
    get:
      tags: [Developer]
      summary: Reconciliation findings
      description: |
        A finding names a CONDITION, not a sighting: a leg still unmatched 96
        sweeps later is ONE row whose `lastSeenAt` moves. Keyset-paginated
        descending by id. Pro plan (`attribution_reports`); any role.
      operationId: devListReconciliationFindings
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [unmatched_actual, unmatched_leg, units_mismatch, over_coverage, unknown_line_item, bucket_reopened, platform_zero_cost, connector_stale, invoice_foot_variance, currency_unsupported]
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warn, error]
        - name: state
          in: query
          schema:
            type: string
            enum: [open, cleared, all]
            default: open
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Findings plus open counts by kind
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items: { type: object }
                  nextCursor: { type: string, nullable: true }
                  hasMore: { type: boolean }
                  openCounts:
                    type: object
                    additionalProperties: { type: integer }
                  historyFloor: { type: string, nullable: true }
                  historyClamped: { type: boolean }
        "400":
          description: invalid_query
        "403":
          description: plan_required — the Pro `attribution_reports` feature
  /v1/developer/actuals/findings/{id}/resolve:
    post:
      tags: [Developer]
      summary: Resolve one reconciliation finding
      description: |
        CAS on `clearedAt IS NULL` — an already-resolved finding 404s rather
        than being silently re-sealed with a different resolution. `auto_cleared`
        is deliberately not accepted: it is the machine's verdict, and a human
        claiming it would erase the difference between "the condition went away"
        and "a person decided to live with it". A condition that recurs after
        being resolved opens a NEW finding with a new `openedAt`.
        Agency plan (`vendor_connections` feature).
      operationId: devResolveReconciliationFinding
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [acknowledged, wont_fix, fixed]
      responses:
        "200":
          description: Resolved
        "400":
          description: invalid_body or invalid_json
        "403":
          description: plan_required — the Agency `vendor_connections` feature
        "404":
          description: finding_not_found — no OPEN finding with this id
  /v1/developer/actuals/documents:
    get:
      tags: [Developer]
      summary: The vendor invoice queue
      description: |
        `state` flattens three orthogonal statuses (upload, parse, foot) for a
        human: awaiting_upload, upload_failed, unparsed, parsing, parse_failed,
        review_only, needs_review, ready_to_foot, footed, disputed.
        `objectLaneAvailable: false` means this deployment has no bucket and only
        the inline lane works — stated up front rather than surfaced as a
        mystery 503. Agency plan (`vendor_connections` feature).
      operationId: devListVendorDocuments
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: vendor
          in: query
          schema: { type: string }
        - name: footStatus
          in: query
          schema:
            type: string
            enum: [unfooted, footed, disputed]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { type: object }
                  objectLaneAvailable: { type: boolean }
        "400":
          description: invalid_query
        "403":
          description: plan_required — the Agency `vendor_connections` feature
    post:
      tags: [Developer]
      summary: Ingest a vendor invoice inline (no object storage needed)
      description: |
        The inline lane, for documents up to 256 KiB. Not a demo path: parse,
        review, foot and un-foot all key off the ROW rather than the transport,
        so a finance user pasting a four-line invoice never needs a bucket to
        exist. The digest is computed from the bytes THIS process holds, so the
        same "the server read these bytes" property the object lane works to
        establish is true here by construction.

        The same bytes are ONE document: a re-post resolves to the existing row
        (`duplicate: true`, 200) instead of creating a second one.
        Agency plan (`vendor_connections` feature).
      operationId: devIngestVendorDocumentInline
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, filename, body]
              properties:
                vendor: { type: string, maxLength: 64 }
                filename: { type: string, maxLength: 255 }
                contentType:
                  type: string
                  default: text/csv
                  enum: [text/csv, text/plain, application/json]
                body: { type: string, description: UTF-8 text, at most 256 KiB. }
                periodStart: { type: string, nullable: true }
                periodEnd: { type: string, nullable: true }
      responses:
        "200":
          description: Duplicate — resolved to the existing document
        "201":
          description: Ingested and parsed
        "400":
          description: invalid_body, invalid_json, or unsupported_document
        "403":
          description: plan_required — the Agency `vendor_connections` feature
  /v1/developer/actuals/documents/upload-url:
    post:
      tags: [Developer]
      summary: Mint a V4 signed PUT URL for a vendor invoice
      description: |
        The row is created BEFORE the upload so the object path has an owner: an
        object with no row is unattributable garbage, and a row with no object is
        a pending upload the sweep can reject after 24 h. The `sha256` you send
        is a DEDUPE HINT ONLY — at finalize the server re-downloads the object
        and recomputes the digest itself; a mismatch rejects the upload and never
        updates the row to match what arrived.

        `upload` is null when the digest already resolved to a stored document —
        there is nothing to upload. 503 `vendor_docs_not_configured` when this
        deployment has no bucket; the inline lane (POST /actuals/documents)
        behaves identically. Agency plan (`vendor_connections` feature).
      operationId: devMintVendorDocumentUpload
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, filename, contentType, sizeBytes, sha256]
              properties:
                vendor: { type: string, maxLength: 64 }
                filename: { type: string, maxLength: 255 }
                contentType:
                  type: string
                  enum: [text/csv, text/plain, application/json, application/pdf]
                sizeBytes: { type: integer, minimum: 1 }
                sha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                periodStart: { type: string, nullable: true }
                periodEnd: { type: string, nullable: true }
      responses:
        "200":
          description: Duplicate — the digest resolved to a stored document, `upload` is null
        "201":
          description: Row minted, signed PUT returned
        "400":
          description: invalid_body or unsupported_document
        "403":
          description: plan_required — the Agency `vendor_connections` feature
        "503":
          description: vendor_docs_not_configured — use the inline lane
  /v1/developer/actuals/documents/{id}/finalize:
    post:
      tags: [Developer]
      summary: Verify the uploaded bytes and parse the document
      description: |
        Re-downloads the object, recomputes sha256 from the bytes THE SERVER
        READ, and only then marks the row uploaded and parses it. Idempotent: a
        second call on an already-verified document is a no-op, not an error, so
        a client retrying on a flaky connection is safe.
        Agency plan (`vendor_connections` feature).
      operationId: devFinalizeVendorDocument
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verified and parsed
        "403":
          description: plan_required — the Agency `vendor_connections` feature
        "404":
          description: document_not_found
        "409":
          description: not_an_upload, not_uploaded, or a digest mismatch
        "503":
          description: vendor_docs_not_configured
  /v1/developer/actuals/documents/{id}/lines:
    get:
      tags: [Developer]
      summary: Parsed and human-corrected invoice lines
      description: |
        Lines are editable while the document is unfooted. `costRaw` is non-NULL
        only for a USD-family unit — a EUR line arrives as a null dollar figure
        with its verbatim `costNative` string beside it. `rawLine` keeps what the
        vendor actually printed, so a correction can always be compared to it.
        Agency plan (`vendor_connections` feature).
      operationId: devListVendorDocumentLines
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document plus its lines
        "403":
          description: plan_required — the Agency `vendor_connections` feature
        "404":
          description: document_not_found
    patch:
      tags: [Developer]
      summary: Correct invoice lines and optionally confirm review
      description: |
        Addresses lines by `lineNo`, which is stable across a re-parse, so a
        re-parse that reorders rows can never move someone's correction onto a
        different line. Any human touch demotes the line's provenance to
        `corrected`; the parsed original stays in `rawLine`.

        `confirmReview: true` marks every line reviewed and promotes the
        document to `parsed`. It lives on this route because it is the terminal
        act of the SAME human pass that corrects the lines — a reviewer fixes
        three rows and confirms in one request, so the correction and the
        confirmation cannot end up on different sides of a page reload.

        A footed document 409s: its lines sit behind an `invoiced` stamp and must
        be un-footed before editing.
        Agency plan (`vendor_connections` feature).
      operationId: devPatchVendorDocumentLines
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lines:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [lineNo]
                    properties:
                      lineNo: { type: integer, minimum: 1 }
                      description: { type: string, nullable: true }
                      vendorRequestId: { type: string, nullable: true }
                      units:
                        type: object
                        additionalProperties: { type: string }
                      costNative: { type: string, nullable: true }
                      costUnit: { type: string, nullable: true }
                      costNano: { type: string, nullable: true }
                      costRaw: { type: string, nullable: true }
                      needsReview: { type: boolean }
                      excluded:
                        type: boolean
                        description: An excluded line still EXISTS — the invoice total it came from still has to reconcile.
                confirmReview: { type: boolean }
      responses:
        "200":
          description: Updated lines
        "400":
          description: invalid_body or invalid_json
        "403":
          description: plan_required — the Agency `vendor_connections` feature
        "404":
          description: document_not_found
        "409":
          description: document_footed, line_not_found, or no_lines
  /v1/developer/actuals/documents/{id}/foot:
    post:
      tags: [Developer]
      summary: Foot a vendor invoice against the vendor-cost ledger
      description: |
        Promotes the document's lines into the audit store and re-stamps the legs
        they cover as `invoiced`. A foot is a PROVENANCE PROMOTION, not a
        re-pricing: `costRaw` carries through unchanged and `statusBeforeInvoice`
        is retained, so the exact-vs-period-rate badging survives it.

        `dryRun: true` runs the identical computation and rolls it back — free,
        and worth doing before an irreversible finance action.

        An unexplained variance above max(0.5%, $1) leaves the ledger EXACTLY as
        it found it, marks the document `disputed`, and opens an
        `invoice_foot_variance` finding. A re-foot on unchanged inputs writes
        nothing (`changed: false`) — `footInputHash` makes it a no-op rather than
        a duplicate promotion. A non-USD document foots units-only
        (`mode: units_only`): no dollars anywhere, no FX.

        Emits `vendor_actuals.invoice.footed` on a real (non-dry) run.
        Agency plan (`vendor_connections` feature).
      operationId: devFootVendorDocument
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun: { type: boolean }
      responses:
        "200":
          description: Foot result
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { type: object, nullable: true }
                  foot:
                    type: object
                    properties:
                      documentId: { type: integer }
                      changed: { type: boolean }
                      footStatus:
                        type: string
                        enum: [footed, disputed]
                      mode:
                        type: string
                        enum: [usd, units_only]
                      parsedTotalRaw: { type: string }
                      ledgerTotalRaw: { type: string }
                      varianceRaw: { type: string }
                      unexplainedRaw: { type: string }
                      thresholdRaw: { type: string }
                      stampsWritten: { type: integer }
                      adjustmentsWritten: { type: integer }
                      linesPromoted: { type: integer }
                      findings:
                        type: array
                        items: { type: object }
                      runId: { type: string }
                  dryRun: { type: boolean }
        "400":
          description: invalid_body or invalid_json
        "403":
          description: plan_required — the Agency `vendor_connections` feature
        "404":
          description: document_not_found
        "409":
          description: foot_failed, document_footed, or needs_review

  /v1/developer/interactions:
    get:
      tags: [Developer]
      summary: Cost per AI task — one row per interaction (voice call, SMS or job)
      description: |
        The COGS unit here is the TASK, not the vendor line: every leg of one
        interaction — telephony, STT, LLM, TTS, tools — joined into a single
        cost. `/actuals/*` slices the same money by vendor; this slices it by
        the work it paid for.

        THREE DIFFERENT CLAIMS, NEVER ADDED HERE. `totalRaw` is your reconciled
        vendor cost and is **null** (never 0) while any leg is still pending —
        `totalBlockedBy` names why and `totalLabel` reads "partial".
        Money on the Floe ledger is split by WHO PRODUCED it:
        `floeSettledRaw` is what Floe settled and charged you (keyless, Floe
        Phone, x402, marketplace; `floeChargeRaw` is the same figure),
        `orchestratorReconciledRaw` is your orchestrator's reported call cost
        (Vapi/Retell/Bland), and `selfReportedRaw` is floe-guard's own estimate
        of spend on your keys, which is never billed. Each is **null**, not 0,
        when there is none. `paidRaw` is the vendor half plus all three and is
        null while the vendor half is partial. A client that adds the halves itself will
        double-count on the day one of them changes shape.

        `orderBy=cost` is the outlier list and sorts on the range-scoped LOWER
        bound, so a partially-costed task ranks on what is known so far.

        `subtotals` is null under a `channel` or `outcome` filter and on every
        cursor page — do not substitute a page sum for it. `resolution` is
        likewise first-page only. Free plan; any role.
      operationId: devListInteractions
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: customerId
          in: query
          schema: { type: string }
        - name: campaignId
          in: query
          schema: { type: string }
        - name: agentId
          in: query
          schema: { type: string }
        - name: vendor
          in: query
          schema: { type: string }
        - name: channel
          in: query
          description: Filters on the interaction's derived channel.
          schema:
            type: string
            enum: [voice, chat, email, video, job, sms]
        - name: status
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          description: >
            The FLO-633 quality signal — the agent's self-report on the call.
            Not an outcome claim; filter claims with `outcome_kind`.
          schema: { type: string, enum: [success, failure, partial, unknown] }
        - name: outcome_kind
          in: query
          description: >
            Calls holding a CURRENT outcome claim (a chain head) of this kind,
            matched through the claim bindings. Trimmed and lowercased. Under
            this filter `subtotals` is null (a leg-grain block cannot honour a
            claim filter); `distribution` is filtered to the same calls.
          schema: { type: string, maxLength: 64 }
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [started, cost]
            default: started
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of tasks with their joined cost
          content:
            application/json:
              schema:
                type: object
                properties:
                  interactions:
                    type: array
                    items:
                      type: object
                      properties:
                        interactionId: { type: string, description: "Operator-facing id, `int_` + 16 hex." }
                        channel: { type: string, enum: [voice, chat, email, video, job, sms] }
                        direction: { type: string, nullable: true }
                        startedAt: { type: string, format: date-time, nullable: true }
                        endedAt: { type: string, format: date-time, nullable: true }
                        durationMs: { type: integer, nullable: true }
                        agentId: { type: string, nullable: true }
                        customerId: { type: string, nullable: true }
                        campaignId: { type: string, nullable: true }
                        outcome:
                          type: string
                          nullable: true
                          description: The quality signal (agent self-report), not a claim.
                        outcomes:
                          type: array
                          description: >
                            The current outcome CLAIM heads bound to this call, in
                            kind order. Empty when it has none. A corrected claim is
                            one entry: its head.
                          items:
                            type: object
                            required: [eventId, kind, status, quantity]
                            properties:
                              eventId: { type: string, pattern: '^oev_[0-9a-f]{16}$' }
                              kind: { type: string }
                              status: { type: string, enum: [reported, confirmed, disputed, void, reversed] }
                              quantity: { type: integer, minimum: 1 }
                        legCount: { type: integer }
                        floeCarriedLegCount:
                          type: integer
                          description: Legs Floe paid for. They count toward the task but carry no vendor bill of yours.
                        vendors: { type: array, items: { type: string } }
                        byKind: { type: object }
                        topKind: { type: string, nullable: true }
                        composition: { type: object }
                        exactRaw: { type: string }
                        periodRateRaw: { type: string }
                        invoicedRaw: { type: string }
                        invoicedFrom: { type: object }
                        groupsRaw: { type: string }
                        groupCount: { type: integer }
                        adjustmentsRaw: { type: string }
                        totalRaw:
                          type: string
                          nullable: true
                          description: Null while any leg is unpriced — never 0 for "unknown".
                        totalBlockedBy: { type: array, items: { type: string } }
                        totalLabel: { type: string, nullable: true }
                        nonUsd: { type: boolean }
                        floeChargeRaw:
                          type: string
                          nullable: true
                          description: What Floe settled and charged for this task — the same figure as floeSettledRaw. Null (not 0) when there is none.
                        floeSettledRaw:
                          type: string
                          nullable: true
                          description: Floe-settled money (x402, keyless, marketplace, Floe Phone). Billed. Null when none.
                        orchestratorReconciledRaw:
                          type: string
                          nullable: true
                          description: Orchestrator call-end cost (Vapi/Retell/Bland Reconcile Mode). Billed. Null when none.
                        selfReportedRaw:
                          type: string
                          nullable: true
                          description: floe-guard ledger-sync spend — the caller's own estimate. Real cost, never billed. Null when none.
                        floeChargeRequests: { type: integer, description: Floe-settled money rows only. }
                        paidRaw:
                          type: string
                          nullable: true
                          description: Vendor half + all three Floe-ledger parts. Null while the vendor half is partial.
                        marginRaw: { type: string, nullable: true }
                        marginPartial: { type: boolean }
                        marginBps: { type: integer, nullable: true }
                        revenueRaw:
                          type: string
                          nullable: true
                          description: |
                            P2.3 — the VENDOR SLICE of revenue: the reconciled
                            vendor cost the card's basis admits, plus the markup
                            earned on it. NOT the client's whole invoice, which
                            also carries per-unit and fixed lines this surface
                            never sees. Null exactly when `marginRaw` is.
                        marginBlockedBy:
                          type: array
                          description: |
                            P2.3 — why margin/revenue are null, so a dash can
                            name its reason rather than reading as a bug.
                            Empty iff `marginRaw` is stated.
                          items:
                            type: string
                            enum:
                              - spans_multiple_customers
                              - unattributed_customer
                              - no_rate_card
                              - card_prices_no_vendor_cost
                              - non_usd
                  nextCursor: { type: string, nullable: true }
                  hasMore: { type: boolean }
                  orderBy: { type: string, enum: [started, cost] }
                  subtotals:
                    type: object
                    nullable: true
                    description: Range-wide. Null under a channel/outcome filter and on cursor pages.
                  range: { type: object }
                  costOwner: { type: string, enum: [developer] }
                  costOwnerNote: { type: string }
                  resolution:
                    type: object
                    nullable: true
                    description: First page only. Leg counts (total/bound/unresolved/unswept), `unresolvedByReason`, `resolutionBps`.
                  distribution:
                    type: object
                    nullable: true
                    description: >
                      Per-task cost spread — calls, partialCalls, lowerBound,
                      p50Raw, p95Raw, maxRaw. FIRST PAGE ONLY: null on every
                      cursor page, exactly like `subtotals` and `resolution`
                      (the handler computes all three behind the same
                      `firstPage` guard). A client must not substitute a
                      page-local spread for it.
                  historyFloor: { type: string, nullable: true }
                  historyClamped: { type: boolean }
        "400":
          description: invalid_query — `orderBy`, `channel`, `outcome` or `status` outside its allowed set

  /v1/developer/interactions/rollups:
    get:
      tags: [Developer]
      summary: Per-task cost rolled up by client, campaign, agent, channel, outcome or task type
      description: |
        Same money as `/interactions`, grouped. Each row adds a duration and a
        cost-per-minute.

        `costPerMinuteRaw` is stated ONLY when every input is a complete claim;
        otherwise it is null and `costPerMinuteBlockedBy` names why —
        `partial_cost` (a task still unpriced), `open_interactions` (a task has
        not ended), `no_duration`. An unknown-duration $/min is unknowable
        rather than a lower bound, so it is never labelled "partial".

        `channel` is NOT accepted as a filter here and returns 400, even though
        `by=channel` groups on it: this grain has no honest leg-level
        translation for the filter yet, and returning unfiltered totals from a
        request that looks filtered is the failure being avoided.

        The rollup joins INNER through the leg bindings, so unresolved and
        unswept legs are absent from every row; `resolution` (first page only)
        states that omission. Pro plan (`attribution_reports`); any role.
      operationId: devListInteractionRollups
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: by
          in: query
          schema:
            type: string
            enum: [customer, campaign, agent, channel, outcome, task_type]
            default: customer
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: vendor
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: campaignId
          in: query
          schema: { type: string }
        - name: agentId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of rollup rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  by: { type: string, enum: [customer, campaign, agent, channel, outcome, task_type] }
                  rollups:
                    type: array
                    items:
                      type: object
                      description: >
                        The grouped vendor-cost row (same shape as /actuals/rollups)
                        plus the per-task metrics below. `residualRaw` and
                        `coverageBps` ride along on by=customer only; the margin
                        fields appear when the client's rate card prices vendor cost.
                      properties:
                        key: { type: string }
                        taskId: { type: string, nullable: true }
                        legCount: { type: integer }
                        firstOccurredAt: { type: string, format: date-time }
                        lastOccurredAt: { type: string, format: date-time }
                        vendors: { type: array, items: { type: string } }
                        agentId: { type: string, nullable: true }
                        customerId: { type: string, nullable: true }
                        campaignId: { type: string, nullable: true }
                        composition: { type: object }
                        exactRaw: { type: string }
                        periodRateRaw: { type: string }
                        invoicedRaw: { type: string }
                        invoicedFrom: { type: object }
                        groupsRaw: { type: string }
                        groupCount: { type: integer }
                        adjustmentsRaw: { type: string }
                        totalRaw:
                          type: string
                          nullable: true
                          description: Null while any leg is unpriced — never 0 for "unknown".
                        totalBlockedBy: { type: array, items: { type: string } }
                        totalLabel: { type: string, nullable: true }
                        nonUsd: { type: boolean }
                        residualRaw:
                          type: string
                          nullable: true
                          description: by=customer only — uncaptured-usage residual.
                        coverageBps:
                          type: integer
                          nullable: true
                          description: by=customer only.
                        marginRaw: { type: string, nullable: true }
                        marginPartial: { type: boolean }
                        marginBps: { type: integer, nullable: true }
                        revenueRaw:
                          type: string
                          nullable: true
                          description: |
                            P2.3 — the VENDOR SLICE of revenue: the reconciled
                            vendor cost the card's basis admits, plus the markup
                            earned on it. NOT the client's whole invoice. Stated
                            on by=customer, and on by=campaign where the
                            campaign's legs name exactly one carded client — a
                            campaign is an INDEPENDENT tag and can span several,
                            and a card's allotments and tiers do not slice
                            linearly across them. Null exactly when `marginRaw`
                            is.
                        marginBlockedBy:
                          type: array
                          description: |
                            P2.3 — why margin/revenue are null. `spans_multiple_customers`
                            (no single card applies), `unattributed_customer`
                            (the legs name NO client — a TAGGING job, not a
                            pricing one: adding a card would have nothing to
                            attach to), `no_rate_card` (one client, but no card
                            version covers the row's whole span, including one
                            that changed mid-row), `card_prices_no_vendor_cost`
                            (retainer-only / per-unit / `none` basis — zero by
                            absence, not a fact), `non_usd`. Empty iff
                            `marginRaw` is stated.
                          items:
                            type: string
                            enum:
                              - spans_multiple_customers
                              - unattributed_customer
                              - no_rate_card
                              - card_prices_no_vendor_cost
                              - non_usd
                        distinctCustomers:
                          type: integer
                          description: |
                            P2.3 — distinct customers this group's legs name,
                            counting the `(unattributed)` sentinel as one. Lets
                            a suppressed margin say "spans N clients" instead of
                            dashing silently. 1 with a null customer means
                            UNTAGGED, not single-client — read it with
                            `marginBlockedBy`.
                        interactionCount: { type: integer }
                        openInteractions:
                          type: integer
                          description: Tasks with no end yet. Interpret `durationMs` with this.
                        durationMs:
                          type: integer
                          description: Closed-task span only.
                        costPerMinuteRaw:
                          type: string
                          nullable: true
                          description: >
                            Stated only when every input is a complete claim;
                            otherwise null, with costPerMinuteBlockedBy naming why.
                        costPerMinuteBlockedBy:
                          type: array
                          items:
                            type: string
                            enum: [partial_cost, open_interactions, no_duration]
                        floeChargeRaw:
                          type: string
                          nullable: true
                          description: >
                            P2.9 — what FLOE charged for this key's Floe-carried
                            work (keyless, Floe Phone, x402), 6-dp. Null (never
                            0) when Floe carried nothing for the key. The whole
                            property is ABSENT when a filter the charge seam
                            cannot answer is present (vendor, status, client,
                            agent): a charge is one payment across all its legs
                            and cannot be narrowed to the ones that matched, so
                            it is suppressed rather than reported unfiltered.
                            Test `'floeChargeRaw' in row` to tell "Floe carried
                            nothing" from "not answerable here". Floe-settled
                            money only; the other producers are below.
                        floeSettledRaw:
                          type: string
                          nullable: true
                          description: Same as floeChargeRaw. Absent whenever floeChargeRaw is.
                        orchestratorReconciledRaw:
                          type: string
                          nullable: true
                          description: Orchestrator call-end cost for the key. Billed. Absent whenever floeChargeRaw is.
                        selfReportedRaw:
                          type: string
                          nullable: true
                          description: floe-guard self-reported spend for the key. Never billed. Absent whenever floeChargeRaw is.
                        floeChargeRequests:
                          type: integer
                          description: >
                            Charge rows behind `floeChargeRaw` — one charge can
                            pay for several legs. Absent whenever
                            `floeChargeRaw` is.
                        paidRaw:
                          type: string
                          nullable: true
                          description: >
                            P2.9 — `totalRaw` plus all three Floe-ledger parts
                            (settled, orchestrator, self-reported): what this
                            key actually COST, and the only figure here safe to
                            compare against another paid figure. Null while the
                            vendor half is partial, because adding a known
                            charge to a lower bound would render it as though it
                            were a total. Absent whenever `floeChargeRaw` is.
                            Covers exactly the interactions `interactionCount`
                            counts — an interaction Floe carried end to end has
                            no developer-owned leg, so it contributes neither a
                            row nor a charge at this grain.
                  nextCursor: { type: string, nullable: true }
                  hasMore: { type: boolean }
                  range: { type: object }
                  costOwner: { type: string, enum: [developer] }
                  costOwnerNote:
                    type: string
                    description: >
                      States the cost-owner scope. Mentions `floeChargeRaw` only
                      when the rows carry it — the note and the fields move
                      together, so a response never advertises a charge figure
                      it is not reporting.
                  floeChargeUnkeyed:
                    type: object
                    description: >
                      P2.9 — charges that resolved to no row, reported beside the
                      rows rather than folded into one. ABSENT exactly when the
                      rows carry no charge fields. Normally
                      `{ chargeRaw: "0", requests: 0 }`: `proxy_request` is a
                      join identifier, so one charge always resolves to one
                      interaction and the unkeyed branch is a structural
                      backstop rather than a live path — except for
                      orchestrator call-end rows whose platform sent no
                      itemised report: with no orchestrator_call link they
                      bind to no call, and land here with a reason.
                    properties:
                      chargeRaw: { type: string, description: Floe-settled money only. }
                      requests: { type: integer, description: Floe-settled rows only. }
                      orchestratorReconciledRaw: { type: string, nullable: true, description: Orchestrator call-end money that resolved to no row. Null when none. }
                      selfReportedRaw: { type: string, nullable: true, description: floe-guard self-reported money that resolved to no row. Never billed. Null when none. }
                      orchestratorUnboundRaw:
                        type: string
                        nullable: true
                        description: >
                          The part of orchestratorReconciledRaw with no call to
                          bind to (no orchestrator_call link). Null under an
                          interaction-level filter, which it cannot satisfy.
                      orchestratorUnboundReason:
                        type: string
                        nullable: true
                        enum: [no_platform_report, null]
                        description: Why that money is unbound — the platform sent no itemised report for the call.
                  resolution: { type: object, nullable: true }
                  historyFloor: { type: string, nullable: true }
                  historyClamped: { type: boolean }
        "400":
          description: invalid_query — includes `channel`, which this route refuses outright
        "403":
          description: plan_required — the Pro `attribution_reports` feature

  /v1/developer/interactions/rollups.csv:
    get:
      tags: [Developer]
      summary: Server-rendered CSV of the interaction rollup
      description: |
        The same dimension, range and filters as GET /interactions/rollups,
        rendered server-side so a large export is an `<a href>` rather than a
        client-side blob. Both routes resolve their scope through the SAME
        parser, so the file and the rollup on screen cannot disagree about what
        a filter selected. Every field goes through the formula-injection
        guard.

        Walked to exhaustion rather than paged: `cursor` is ignored here,
        because a whole-range export has no page to resume from and honouring a
        stale one would write a file that starts in the middle and still looks
        complete. Over 100,000 groups the request is REFUSED with 413
        `export_too_large` rather than truncated.

        `total_raw` is BLANK, never `0`, wherever the group is a partial claim
        — `total_label` then says so. `cost_per_minute_raw` is stated only when
        the total is complete, every call in the group has closed and the span
        is positive; otherwise `cost_per_minute_blocked_by` names why.
        `historyFloor` / `historyClamped` ride on the X-Floe-History-Floor and
        X-Floe-History-Clamped headers and in the file's `#` preamble.

        Reading the rollup is free (`attribution_reports`); exporting it rides
        `exports` (Pro) on top. Any role.
      operationId: devExportInteractionRollupsCsv
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: by
          in: query
          description: Grouping dimension. Defaults to customer.
          schema:
            type: string
            enum: [customer, campaign, agent, channel, outcome, task_type]
            default: customer
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: vendor
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: agentId
          in: query
          schema: { type: string }
        - name: campaignId
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: Comma-separated subset of the reconciliation statuses.
          schema: { type: string }
        - name: outcome
          in: query
          description: Filter on the interaction's derived outcome (distinct from by=outcome).
          schema: { type: string }
      responses:
        "200":
          description: text/csv
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid by / range / filter, or channel (unsupported at this grain)
        "403":
          description: plan_required — the export rides `exports` (Pro)
        "413":
          description: export_too_large — narrow the range or filter further

  /v1/developer/interactions/{publicId}:
    get:
      tags: [Developer]
      summary: One task — every leg, its cost, and the identifiers that joined them
      description: |
        The task's legs with per-leg cost and status, the per-kind breakdown,
        the money block, and the join identifiers that made these legs one
        task.

        A saved link to a MERGED task never 404s: the canonical task answers and
        `requestedId` carries the id that was asked for. It is null when the
        requested id was already canonical.

        A Floe-carried leg's `costRaw` is null — one Floe charge can pay for
        several legs, so its share is not knowable per leg. The charge is
        reported once for the task as `floeChargeRaw`. Free plan; any role.
      operationId: devGetInteraction
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            pattern: "^int_[0-9a-f]{16}$"
      responses:
        "200":
          description: The task, its legs and its identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  interactionId: { type: string }
                  requestedId:
                    type: string
                    nullable: true
                    description: Set only when the requested id was merged into this one.
                  channel: { type: string, enum: [voice, chat, email, video, job, sms] }
                  direction: { type: string, nullable: true }
                  startedAt: { type: string, format: date-time, nullable: true }
                  endedAt: { type: string, format: date-time, nullable: true }
                  durationMs: { type: integer, nullable: true }
                  agentId: { type: string, nullable: true }
                  customerId: { type: string, nullable: true }
                  campaignId: { type: string, nullable: true }
                  outcome: { type: string, nullable: true }
                  costOwner: { type: string, enum: [developer] }
                  costOwnerNote: { type: string }
                  legs:
                    type: array
                    items:
                      type: object
                      properties:
                        legId: { type: integer }
                        vendor: { type: string }
                        legKind: { type: string }
                        occurredAt: { type: string, format: date-time }
                        captureSource: { type: string }
                        attemptOutcome: { type: string }
                        matchedVia: { type: string, nullable: true }
                        units: { type: object, nullable: true }
                        reconciliationStatus: { type: string }
                        statusReason: { type: string, nullable: true }
                        costOwner: { type: string, enum: [developer, platform] }
                        costRaw:
                          type: string
                          nullable: true
                          description: Null on a Floe-carried leg — see floeChargeRaw.
                        currency: { type: string }
                        costScope: { type: string }
                  links:
                    type: array
                    description: The identifiers that joined these legs into one task.
                    items:
                      type: object
                      properties:
                        vendor: { type: string }
                        identifierKind: { type: string }
                        identifier: { type: string }
                        createdAt: { type: string, format: date-time }
                  byKind: { type: object }
                  totalRaw: { type: string, nullable: true }
                  totalBlockedBy: { type: array, items: { type: string } }
                  totalLabel: { type: string, nullable: true }
                  floeChargeRaw: { type: string, nullable: true, description: Floe-settled money; same as floeSettledRaw. Null when none. }
                  floeSettledRaw: { type: string, nullable: true, description: Floe-settled money (x402, keyless, marketplace, Floe Phone). Billed. Null when none. }
                  orchestratorReconciledRaw: { type: string, nullable: true, description: The orchestrator's call-end cost for this call. Billed. Null when none. }
                  selfReportedRaw: { type: string, nullable: true, description: floe-guard self-reported spend. Never billed. Null when none. }
                  floeChargeRequests: { type: integer, description: Floe-settled rows only. }
                  paidRaw: { type: string, nullable: true, description: Vendor cost plus all three Floe-ledger parts. Null while the vendor half is partial. }
                  historyFloor: { type: string, nullable: true }
                  historyClamped: { type: boolean }
        "400":
          description: invalid_query — malformed interaction id
        "404":
          description: interaction_not_found

  /v1/agents/policies:
    get:
      tags: [Agent]
      summary: List own spend policies
      operationId: agentListPolicies
      parameters:
        - name: includeRevoked
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Policy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentPolicy"
    post:
      tags: [Agent]
      summary: Create a spend policy (adding tightens — refused only when it would widen an enforced allowlist)
      description: |
        kind='api'/'vendor' rows double as the merchant allowlist entries.
        While selfServiceLocked AND the matching allowlistMode dimension is
        enforced, creating one would GRANT a new allowed host/payee, so it
        is refused; every other create still tightens and is allowed.
      operationId: agentCreatePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Created
        "403":
          description: self_service_locked — would widen an enforced allowlist dimension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNext"
        "409":
          description: duplicate_active_policy

  /v1/agents/policies/{policyId}:
    patch:
      tags: [Agent]
      summary: Update own policy (tighten-only when selfServiceLocked)
      operationId: agentUpdatePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "403":
          description: self_service_locked — only a pure limitRaw reduction is allowed while locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNext"
        "404":
          description: Not found
    delete:
      tags: [Agent]
      summary: Revoke own policy (refused when selfServiceLocked)
      operationId: agentDeletePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
        "403":
          description: self_service_locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNext"
        "404":
          description: Not found

  /v1/agents/policies/{policyId}/reset:
    post:
      tags: [Agent]
      summary: Reset a policy's spend window (refused when selfServiceLocked)
      operationId: agentResetPolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Window reset
        "403":
          description: self_service_locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNext"
        "404":
          description: Not found

  /v1/agents/allowlist-mode:
    get:
      tags: [Agent]
      summary: Read the merchant allowlist enforcement mode
      operationId: agentGetAllowlistMode
      responses:
        "200":
          description: Mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [off, host, vendor, both]
    put:
      tags: [Agent]
      summary: Set the merchant allowlist enforcement mode
      description: |
        While selfServiceLocked the mode may only GAIN enforcement
        dimensions (off ⊂ host|vendor ⊂ both); dropping or swapping one
        turns a gate off and is operator-only.
      operationId: agentSetAllowlistMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [off, host, vendor, both]
      responses:
        "200":
          description: Updated (may carry a no_active_entries lockout warning)
        "403":
          description: self_service_locked — the mode may only gain enforcement dimensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNext"

  /v1/agents/spend-summary:
    get:
      tags: [Agent]
      summary: Rolling-window spend total
      operationId: agentGetSpendSummary
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        "200":
          description: Aggregate spend
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: string
                  since:
                    type: string
                  until:
                    type: string
                  totalSpendRaw:
                    type: string
                  totalSpendUsdc:
                    type: string
                  successCount:
                    type: integer
                  failedCount:
                    type: integer

  /v1/agents/outcomes:
    post:
      tags: [Agent]
      summary: Emit an outcome for a task; Floe binds it to the call
      description: |
        P3.1 — the outcome FACT. Report what a task produced — a booked
        meeting, a qualified lead, a resolution — against the task id you
        already have. Floe resolves that id to the call it belongs to and
        binds the claim there, so cost and outcome sit on one row.

        NOT the same thing as POST /v1/agents/actions/{actionId}/outcome,
        which is the per-action QUALITY signal (status + score) feeding the
        quality throttle. This route produces a billable claim; that one never
        reaches an invoice. They share a word and nothing else.

        `outcomeKind` is opaque to Floe — lowercased, <=64 chars, never
        interpreted. The closed vocabulary that decides what an outcome is
        WORTH lives on the rate card, where money meaning belongs.

        Append-only. Every emit writes a new event; nothing is updated. The
        billable claim is the head of the chain for an (identifier, kind).
        Correcting one means emitting again with `supersedesEventId` naming
        the event you are correcting — by event id, because
        (identifier, kind) is ambiguous once a chain has three rows.

        TWO CLAIMS OF ONE KIND CAN LAND ON ONE CALL and that is not an error:
        a post-call webhook reporting against the orchestrator's id and your
        agent reporting against the task id may be one meeting reported twice,
        or two meetings booked once. Floe cannot tell, so it keeps both and
        opens an `outcome_claim_collision` finding for a human rather than
        guessing. PLANNED, NOT YET ENFORCED (P3.2/P4.3): close will refuse a
        period holding an unresolved collision on a kind your card prices.
      operationId: agentEmitOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, outcomeKind, idempotencyKey]
              properties:
                taskId:
                  type: string
                  description: >
                    The X-Floe-Task-Id this outcome is about. An id that names
                    no call is REFUSED — an outcome nothing can bill is worse
                    than no outcome, because it looks like one.
                outcomeKind:
                  type: string
                  maxLength: 64
                  description: >
                    Opaque, lowercased. Documented canonical values —
                    `resolution`, `meeting_booked`, `qualified_lead`,
                    `escalation`, `abandoned` — are a convention, not an enum.
                status:
                  type: string
                  enum: [reported]
                  default: reported
                  description: >
                    AGENT KEYS MAY ONLY REPORT. Confirming, voiding and
                    resolving a collision are operator acts on a developer
                    credential — the evidence justifying them (a CRM webhook, a
                    calendar invitation) reaches the operator's backend minutes
                    to days after the call, not the agent's process. See
                    POST /v1/developer/outcomes/{eventId}/confirm.
                quantity:
                  type: integer
                  minimum: 1
                  default: 1
                  description: >
                    Two meetings booked on one call is quantity 2 on ONE
                    claim, not two claims.
                occurredAt:
                  type: string
                  format: date-time
                  description: >
                    When the outcome happened — the spend anchor. Defaults to
                    the start of the call the task id resolves to, so a late
                    report still lands on the day the call ran.
                externalSystem:
                  type: string
                  maxLength: 64
                  description: >
                    The namespace the reference belongs to (`salesforce`,
                    `google_calendar`). Lowercased.
                externalRef:
                  type: string
                  maxLength: 256
                  description: >
                    The id in that namespace, stored VERBATIM — CRM and
                    calendar ids are case-sensitive. Equality on
                    (externalSystem, externalRef) is the ONLY provable-duplicate
                    signal; anything short of it stays a finding for a human.
                    Redacted by a subject erasure while the claim survives.
                note:
                  type: string
                  maxLength: 500
                idempotencyKey:
                  type: string
                  maxLength: 200
                  description: >
                    Required. Orchestrator webhooks retry; a replay returns
                    the stored event rather than writing a second claim.
                # NO supersedesEventId / duplicateOfEventId on this surface.
                # Revising, voiding and resolving a collision are operator acts
                # — see POST /v1/developer/outcomes/{eventId}/confirm|void.
                # Unknown fields are REJECTED (400), not ignored.
      responses:
        "200":
          description: >
            Replay of a known idempotency key — the stored event, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEventEnvelope'
        "201":
          description: The claim was recorded and bound to its call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeEventEnvelope'
        "400":
          description: invalid_task_id, or a body that fails validation
        "404":
          description: >
            task_not_found — no call in this account carries that task id.
            Refused rather than stored unattached.
        "409":
          description: >
            outcome_claim_exists (a current claim of this kind exists; pass
            supersedesEventId to revise it) or outcome_claim_billed (the
            predecessor sits in a closed statement, so the correction is a
            reversal in the next open period, never an edit), or
            customer_attribution_conflict (the call's legs are tagged with more
            than one customer, so the outcome cannot be attributed; send one
            X-Floe-Customer-Id per task id).

  /v1/x402/forecast:
    post:
      tags: [x402 Estimate]
      summary: Batch cost forecast + policy preflight
      operationId: forecastX402Costs
      parameters:
        - name: X-Floe-Customer-Id
          in: header
          required: false
          description: |
            The end-client every plan item is for, unless an item sets its own
            customerId. Resolved exactly like a live call: this header, then the
            agent's default customer, then its project's default. Customer
            policies are checked against the resolved id. When the account
            requires customer attribution and any item has no resolvable id,
            the forecast is refused with the live call's 400
            customer_id_required body, plus `items`: the indexes of the items
            that would be refused.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
                      method:
                        type: string
                        pattern: "^[A-Z]{3,7}$"
                      count:
                        type: integer
                        minimum: 1
                        maximum: 10000
                      taskId:
                        type: string
                        maxLength: 128
                      customerId:
                        type: string
                        minLength: 1
                        maxLength: 128
                        description: |
                          The end-client this item is for. Overrides the
                          X-Floe-Customer-Id header for this item. Trimmed and
                          lowercased; blank or over 128 characters is a 400.
      responses:
        "200":
          description: Forecast + policyPreflight (ok flag + per-policy breaches)
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecast:
                    type: object
                  policyPreflight:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      breaches:
                        type: array
                        items:
                          type: object
                          properties:
                            itemIndex:
                              type: integer
                            policyId:
                              type: integer
                            kind:
                              type: string
                            matchKey:
                              type: string
                              nullable: true
                            label:
                              type: string
                              nullable: true
                            limitRaw:
                              type: string
                            projectedSpentRaw:
                              type: string
        "400":
          description: blocked_destination, customer_id_required, or invalid input
        "429":
          description: Rate limit exceeded
        "502":
          description: forecast_failed

  /v1/transfers/prepare:
    post:
      tags: [Transfers]
      summary: Reserve a transfer and return calldata or an execute handle
      description: |
        Directions: to_agent (deposit; client signs the returned calldata,
        then POST /:id/confirm), from_agent (withdrawal; server-signed —
        POST /:id/execute next), agent_to_agent (move between two owned
        agents; server-signed), embedded_to_external (embedded wallet →
        arbitrary address; client-signed). Pre-flight checks: on-chain
        balance, the non-withdrawable welcome credit
        (withdrawal_exceeds_user_balance), and — for wallet-mode agents —
        the spendable balance net of in-flight x402 reservations
        (withdrawal_exceeds_available).
      operationId: prepareTransfer
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, amountRaw]
              properties:
                direction:
                  type: string
                  enum: [to_agent, from_agent, agent_to_agent, embedded_to_external]
                agentId:
                  type: integer
                  description: Required for to_agent / from_agent / agent_to_agent (the SOURCE agent).
                toAgentId:
                  type: integer
                  description: Required for agent_to_agent (the DESTINATION agent; must differ from agentId).
                toAddress:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{40}$"
                  description: Required for embedded_to_external.
                onrampId:
                  type: integer
                  description: Optional (to_agent only) — binds the transfer source to that onramp row's non-custodial wallet (Leg-2 sweep).
                amountRaw:
                  type: string
                  pattern: "^[1-9]\\d{0,18}$"
                  description: Amount, raw USDC (6 decimals). No leading zero; capped at 1e18 raw units.
      responses:
        "200":
          description: >
            Prepared. Client-signed directions return the unsigned calldata
            (chainId, to, data, value); server-signed directions return
            `nextAction: "execute"` instead. Both carry transferId,
            direction, signerKind, fromAddress, toAddress, amountRaw, and
            availableRaw (raw USDC, 6 decimals).
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId:
                    type: string
                    format: uuid
                  direction:
                    type: string
                  signerKind:
                    type: string
                    enum: [external_eoa, embedded_wallet, privy_server]
                  chainId:
                    type: integer
                    description: Client-signed directions only.
                  to:
                    type: string
                    description: USDC contract (client-signed directions only).
                  data:
                    type: string
                    description: ERC-20 transfer calldata (client-signed directions only).
                  value:
                    type: string
                  fromAddress:
                    type: string
                  toAddress:
                    type: string
                  amountRaw:
                    type: string
                  availableRaw:
                    type: string
                  nextAction:
                    type: string
                    enum: [execute]
                    description: Server-signed directions only.
        "400":
          description: Invalid body | withdrawal_exceeds_user_balance | withdrawal_exceeds_available
        "403":
          description: Onramp row belongs to a different developer, or agent-key credential (developer_credential_required)
        "404":
          description: Unknown developer / agent not found or not yours / onramp row not found
        "409":
          description: Insufficient balance | agent has no Privy wallet | onramp mismatch
        "502":
          description: RPC error reading balance

  /v1/transfers/{id}/execute:
    post:
      tags: [Transfers]
      summary: Server-sign and broadcast a from_agent / agent_to_agent transfer
      description: |
        Wallet-mode withdrawals are signed EIP-3009 by the payment-signer
        wallet and broadcast by the Privy executor; legacy/credit-line rows
        use the sponsored ERC20.transfer path. Idempotent — re-running on a
        row already past 'prepared' returns the stored tx hash (a CAS
        guards the broadcast against parallel calls).
      operationId: executeTransfer
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Broadcast (or the prior outcome on an idempotent re-run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId:
                    type: string
                  status:
                    type: string
                  txHash:
                    type: string
                    nullable: true
        "400":
          description: Wrong direction (only from_agent / agent_to_agent are server-executed) | withdrawal_exceeds_user_balance
        "403":
          description: Transfer belongs to a different developer
        "404":
          description: Not found
        "409":
          description: Agent missing Privy credentials
        "502":
          description: Broadcast failed (row marked failed)
        "503":
          description: Privy not configured

  /v1/transfers/{id}/confirm:
    post:
      tags: [Transfers]
      summary: Report the client-signed tx hash (to_agent / embedded_to_external)
      description: Flips the row to 'pending'; the watcher resolves the receipt. Idempotent for the same hash; a different hash after another confirm won 409s with the stored hash.
      operationId: confirmTransfer
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txHash]
              properties:
                txHash:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{64}$"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId:
                    type: string
                  status:
                    type: string
                  txHash:
                    type: string
                    nullable: true
        "400":
          description: Invalid txHash or wrong direction (server-signed rows record via /execute)
        "403":
          description: Transfer belongs to a different developer
        "404":
          description: Not found
        "409":
          description: Already confirmed with a different transaction hash

  /v1/transfers/{id}/link-onramp:
    post:
      tags: [Transfers]
      summary: Link a to_agent transfer to its Leg-1 onramp row
      description: |
        Marks this transfer as the Leg-2 sweep of a specific onramp row —
        flips the onramp's sweep_status not_started → prompted. The
        transfer's endpoints must match the onramp's non-custodial → agent
        pair (409 Mismatch otherwise). Idempotent for the same pair; one
        transfer per onramp.
      operationId: linkTransferOnramp
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onrampId]
              properties:
                onrampId:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid onrampId or wrong direction (to_agent only)
        "403":
          description: Transfer or onramp belongs to a different developer
        "404":
          description: Transfer or onramp row not found
        "409":
          description: Endpoint mismatch, or already linked to a different transfer/onramp

  /v1/transfers:
    get:
      tags: [Transfers]
      summary: Transfer history
      description: Internal agent_to_signer forwarding rows are hidden. agent_to_agent rows surface in BOTH agents' histories when filtering by agentId.
      operationId: listTransfers
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfers:
                    type: array
                    items:
                      type: object
                      description: wallet_transfers row (id, direction, fromAddress, toAddress, amountRaw, status, txHash, ...).

  /v1/onramp/geo:
    get:
      tags: [Onramp]
      summary: Resolve the onramp flow for the caller's region
      description: hosted → use /session-token (Coinbase popup); headless → use /headless/create-order (US-only inline iframe). Authed so unauthenticated probes can't map geo behavior.
      operationId: getOnrampGeo
      security:
        - developerSession: []
      responses:
        "200":
          description: Region + flow
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    nullable: true
                  mode:
                    type: string
                    enum: [hosted, headless]

  /v1/onramp/session-token:
    post:
      tags: [Onramp]
      summary: Mint a CDP onramp session (hosted popup flow)
      description: |
        Leg 1 of the two-leg funding design — fiat lands in a NON-CUSTODIAL
        wallet (the developer's EOA or Privy embedded wallet; custodial
        agent wallets are rejected 403), then Leg 2 sweeps it to the agent
        via /v1/transfers. Persists a pending audit row first and returns
        its id (`onrampId`) plus a `correlationId` the client must pass as
        `partnerUserRef` on the Coinbase popup URL. destinationScope=
        'account' skips the agent requirement entirely (funds stay in the
        non-custodial wallet).
      operationId: createOnrampSessionToken
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationKind, destinationAddress]
              properties:
                destinationKind:
                  type: string
                  enum: [embedded, external]
                destinationAddress:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{40}$"
                destinationScope:
                  type: string
                  enum: [agent, account]
                  default: agent
                  description: account cannot be combined with agentId.
                agentId:
                  type: integer
                  description: Which agent Leg-2 targets. Omitted → the single legacy agent.
                presetFiatAmount:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100000
      responses:
        "200":
          description: Session minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                  channelId:
                    type: string
                    nullable: true
                  correlationId:
                    type: string
                    format: uuid
                  onrampId:
                    type: integer
                    nullable: true
                  mode:
                    type: string
                    enum: [hosted]
                  nonCustodialAddress:
                    type: string
                  agentWalletAddress:
                    type: string
                    nullable: true
        "400":
          description: Invalid body / client IP undeterminable
        "403":
          description: destinationAddress not yours, or a custodial agent wallet
        "404":
          description: Unknown developer / agent not found or not yours
        "409":
          description: No embedded wallet | no agent wallet | Wrong flow (headless region — use /headless/create-order)
        "502":
          description: CDP session-token request failed
        "503":
          description: CDP Onramp not configured

  /v1/onramp/sessions:
    get:
      tags: [Onramp]
      summary: List onramp rows for the caller
      operationId: listOnrampSessions
      security:
        - developerSession: []
      parameters:
        - name: recoveryOnly
          in: query
          schema:
            type: boolean
          description: >
            Only rows where Leg-1 succeeded but Leg-2 hasn't completed
            (sweep_status not_started|failed) — powers the "funds waiting"
            recovery banner. 'prompted' rows are intentionally excluded (a
            Leg-2 broadcast is already in flight).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Rows, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      description: onramp_transactions row (status, sweepStatus, fiatAmount, nonCustodialAddress, agentWalletAddress, ...).

  /v1/onramp/headless/create-order:
    post:
      tags: [Onramp]
      summary: Create a CDP headless onramp order (US-only inline flow)
      description: |
        Returns a paymentLink for the inline iframe instead of a session
        token. Requires partner-verified email + phone OTP tokens (mint via
        /verify-email/* and /verify-phone/*). Geo-gated: non-headless
        regions get 403 — use /session-token. Destination rules identical
        to /session-token. One of paymentAmount / purchaseAmount is
        required (decimal USD strings, ≤ 100000).
      operationId: createOnrampHeadlessOrder
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationKind, destinationAddress, emailToken, phoneToken, agreementAcceptedAt]
              properties:
                destinationKind:
                  type: string
                  enum: [embedded, external]
                destinationAddress:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{40}$"
                destinationScope:
                  type: string
                  enum: [agent, account]
                  default: agent
                agentId:
                  type: integer
                paymentAmount:
                  type: string
                  description: Fiat charge, decimal USD string (≤ 6 dp).
                purchaseAmount:
                  type: string
                  description: Crypto purchase, decimal string (≤ 6 dp).
                emailToken:
                  type: string
                phoneToken:
                  type: string
                agreementAcceptedAt:
                  type: string
                  format: date-time
                domain:
                  type: string
                  maxLength: 255
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  correlationId:
                    type: string
                    format: uuid
                  orderId:
                    type: string
                  onrampId:
                    type: integer
                    nullable: true
                  paymentLink:
                    type: string
                  status:
                    type: string
                  mode:
                    type: string
                    enum: [headless]
                  nonCustodialAddress:
                    type: string
                  agentWalletAddress:
                    type: string
                    nullable: true
        "400":
          description: Invalid body / client IP undeterminable
        "401":
          description: OTP required — email or phone verification token missing, expired, or invalid
        "403":
          description: Headless unavailable in this region, or destination not yours / custodial
        "404":
          description: Unknown developer / agent
        "409":
          description: No embedded wallet | no agent wallet
        "502":
          description: CDP createOrder failed
        "503":
          description: CDP Onramp not configured

  /v1/onramp/verify-email/send:
    post:
      tags: [Onramp]
      summary: Send an email OTP (headless onramp verification)
      operationId: sendOnrampEmailOtp
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Sent
        "400":
          description: Invalid email
        "429":
          description: Resend rate limit — retry after the indicated wait
        "502":
          description: Email delivery failed
        "503":
          description: Email OTP not configured

  /v1/onramp/verify-email/check:
    post:
      tags: [Onramp]
      summary: Check an email OTP and mint a verification token
      description: A recently-verified email can re-mint the token without a new code (60-day re-verification window).
      operationId: checkOnrampEmailOtp
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^\\d{6}$"
      responses:
        "200":
          description: Verified — pass `token` as emailToken to /headless/create-order
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  verifiedAt:
                    type: string
                    format: date-time
        "400":
          description: Invalid email/code, wrong code, or too many attempts
        "404":
          description: No verification in flight

  /v1/onramp/verify-phone/send:
    post:
      tags: [Onramp]
      summary: Send a phone OTP (US mobile only)
      description: CDP requires a real US cell number — VoIP, non-US, and landline numbers are rejected when carrier lookup is available.
      operationId: sendOnrampPhoneOtp
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  description: E.164 (e.g. +14155551234).
      responses:
        "200":
          description: Sent
        "400":
          description: Invalid, VoIP, non-US, or non-mobile number
        "429":
          description: Resend rate limit
        "502":
          description: SMS delivery failed
        "503":
          description: Phone OTP not configured

  /v1/onramp/verify-phone/check:
    post:
      tags: [Onramp]
      summary: Check a phone OTP and mint a verification token
      operationId: checkOnrampPhoneOtp
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code]
              properties:
                phoneNumber:
                  type: string
                code:
                  type: string
                  pattern: "^\\d{4,8}$"
      responses:
        "200":
          description: Verified — pass `token` as phoneToken to /headless/create-order
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  verifiedAt:
                    type: string
                    format: date-time
        "400":
          description: Invalid number/code or wrong code
        "404":
          description: No verification in flight

  /v1/onramp/webhook:
    post:
      tags: [Onramp]
      summary: CDP onramp status webhook (public)
      description: Server-to-server from Coinbase. Trust boundary is the CDP webhook signature verified inside the handler; matched to rows by partnerUserRef (correlationId) with a status-direction guard so delayed retries can't revert terminal states.
      operationId: onrampWebhook
      security: []
      responses:
        "200":
          description: Acknowledged

  /v1/offramp/start:
    post:
      tags: [Offramp]
      summary: Start an offramp order (USDC → fiat)
      description: |
        embedded_wallet — returns sessionToken + payUrl inline.
        agent_wallet — kicks off Leg-1 (server-signed agent → developer
        wallet) and returns the order in leg1_pending; the session token is
        minted later by GET /orders/{ref} once Leg-1 confirms.
      operationId: startOfframp
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceKind, amountRaw]
              properties:
                sourceKind:
                  type: string
                  enum: [embedded_wallet, agent_wallet]
                agentId:
                  type: integer
                  description: Required for sourceKind=agent_wallet.
                amountRaw:
                  type: string
                  pattern: "^\\d+$"
                  description: Amount, raw USDC (6 decimals).
      responses:
        "200":
          description: Order (+ sessionToken/payUrl on the embedded path)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/OfframpOrder"
                  sessionToken:
                    type: string
                    nullable: true
                  payUrl:
                    type: string
                    nullable: true
        "400":
          description: Invalid body / client IP undeterminable / orchestrator-reported error
        "503":
          description: Offramp not configured

  /v1/offramp/orders:
    get:
      tags: [Offramp]
      summary: Paginated offramp order history
      operationId: listOfframpOrders
      security:
        - developerSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/OfframpOrder"
                  nextCursor:
                    type: integer
                    nullable: true
        "400":
          description: Invalid limit / cursor

  /v1/offramp/orders/{ref}:
    get:
      tags: [Offramp]
      summary: Order detail (mints a fresh session token when awaiting_form)
      description: Single-use CDP tokens expire in ~5 minutes, so they are minted on demand rather than persisted.
      operationId: getOfframpOrder
      security:
        - developerSession: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order (+ sessionToken/payUrl when applicable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/OfframpOrder"
                  sessionToken:
                    type: string
                    nullable: true
                  payUrl:
                    type: string
                    nullable: true
        "403":
          description: Order belongs to a different developer
        "404":
          description: Not found

  /v1/offramp/orders/{ref}/tx:
    post:
      tags: [Offramp]
      summary: Record the Leg-2 broadcast (USDC transfer to the CDP deposit address)
      description: Transitions awaiting_send → sent.
      operationId: recordOfframpTx
      security:
        - developerSession: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txHash]
              properties:
                txHash:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{64}$"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/OfframpOrder"
        "400":
          description: Invalid txHash
        "403":
          description: Order belongs to a different developer
        "404":
          description: Not found
        "409":
          description: Wrong state for a Leg-2 broadcast

  /v1/offramp/orders/{ref}/cancel:
    post:
      tags: [Offramp]
      summary: Cancel an order (non-terminal pre-Leg-2 states only)
      operationId: cancelOfframpOrder
      security:
        - developerSession: []
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/OfframpOrder"
        "403":
          description: Order belongs to a different developer
        "404":
          description: Not found
        "409":
          description: Not cancellable in the current state

  /v1/offramp/webhook:
    post:
      tags: [Offramp]
      summary: CDP offramp status webhook (public)
      description: Trust boundary is the Hook0 signature verified inside the handler. Recognized-but-rejected events still 200 so CDP stops retrying; only signature failures 401.
      operationId: offrampWebhook
      security: []
      responses:
        "200":
          description: Acknowledged (or benign drop)
        "401":
          description: Invalid signature

  /v1/admin/agents:
    get:
      tags: [Admin]
      summary: List all agents with balances
      operationId: adminListAgents
      security:
        - adminApiKey: []
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminAgent"

  /v1/admin/agents/{id}:
    patch:
      tags: [Admin]
      summary: Suspend or activate agent
      operationId: adminPatchAgent
      security:
        - adminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string

  /v1/admin/developers/{wallet}/plan:
    patch:
      tags: [Admin]
      summary: Grant, change, or clear a developer's plan (staff override)
      description: |
        Sets an admin plan grant on the account (`plan_source=admin`), which
        overrides whatever Stripe says until `expiresAt` (null = no expiry).
        This is how Enterprise is linked (D10 — sales-led: create the
        Customer + subscription in the Stripe Dashboard, then pass their ids
        here) and how legacy accounts are grandfathered
        (`pnpm --filter @floe/api plans:grant-legacy`). `plan: null` clears
        the grant — the account falls back to its Stripe subscription (or
        Free). Emits `billing.plan.changed` to the developer's webhooks when
        the effective plan changes.
      operationId: adminPatchDeveloperPlan
      security:
        - adminApiKey: []
      parameters:
        - name: wallet
          in: path
          required: true
          description: Account (owner) wallet address, 0x…
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan:
                  type: string
                  nullable: true
                  enum: [free, pro, agency, enterprise, null]
                  description: Plan to grant; null clears the admin grant.
                note:
                  type: string
                  maxLength: 2000
                  description: Free-form audit note (e.g. deal reference, "grandfather").
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: When the grant lapses (the reconcile timer expires it). null / omitted = never.
                stripeCustomerId:
                  type: string
                  nullable: true
                  description: Link a staff-created Stripe Customer (cus_…) — Enterprise usage is metered against it.
                stripeSubscriptionId:
                  type: string
                  nullable: true
                  description: Link a staff-created Stripe subscription (sub_…) so the reconcile timer keeps it in sync.
      responses:
        "200":
          description: Effective plan after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  developerWallet:
                    type: string
                  accountId:
                    type: string
                    description: Floe public account id (`acct_<12 hex>`) — NOT a Stripe account id.
                    example: acct_0123456789ab
                  plan:
                    $ref: "#/components/schemas/AccountPlanName"
                  source:
                    $ref: "#/components/schemas/AccountPlanSource"
                  adminExpiresAt:
                    type: string
                    format: date-time
                    nullable: true
                  row:
                    allOf:
                      - $ref: "#/components/schemas/AccountPlanRow"
                    nullable: true
        "400":
          description: invalid_request — body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "404":
          description: not_found — unknown developer wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"

  /v1/admin/plans:
    get:
      tags: [Admin]
      summary: List account plan rows (ops)
      description: |
        Persisted account_plans rows with optional filters, plus a count of
        accounts per effective plan. Free accounts that never touched
        billing have no row and are not listed (they are counted under
        `free` only if a row exists).
      operationId: adminListPlans
      security:
        - adminApiKey: []
      parameters:
        - name: plan
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountPlanName"
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountPlanSource"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
      responses:
        "200":
          description: Plan rows + per-plan counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountPlanRow"
                  counts:
                    type: object
                    description: Rows per plan, keyed by plan name.
                    additionalProperties:
                      type: integer
                    example: { free: 12, pro: 4, agency: 2, enterprise: 1 }

components:
  securitySchemes:
    walletAddress:
      type: apiKey
      in: header
      name: X-Wallet-Address
      description: Agent wallet address (0x...)
    walletSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: EIP-191 signature of "Floe Credit API\nTimestamp:{ts}"
    walletTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Unix timestamp (within 5 min of server time)
    agentApiKey:
      type: http
      scheme: bearer
      description: >
        Agent API key (floe_..., without _live_). A RUNTIME credential — it
        pays for calls and drives agent self-service, and is the only
        credential the inference gateway accepts. Refused (403
        developer_credential_required) on every /v1/developer route and the
        money-movement surfaces /v1/transfers, /v1/onramp, /v1/offramp.
    developerApiKey:
      type: http
      scheme: bearer
      description: >
        Developer API key (floe_live_...), minted via POST /v1/developer/keys.
        Accepted everywhere `developerSession` is — the two are
        interchangeable operator credentials.
    adminApiKey:
      type: http
      scheme: bearer
      description: Admin API key
    developerSession:
      type: http
      scheme: bearer
      description: >
        Developer (operator) credential. Despite the bearer-JWT declaration,
        every route marked with this scheme accepts ANY developer credential
        interchangeably: the `floe_session` HttpOnly cookie set by
        POST /v1/developer/auth/privy or POST /v1/developer/auth/verify (the
        dashboard's normal path), the same JWT as `Authorization: Bearer
        <jwt>` (legacy fallback), a `floe_live_*` developer API key (Bearer),
        or the wallet-signature headers (X-Wallet-Address + X-Signature +
        X-Timestamp). Agent keys (`floe_*` without `_live_`) are refused with
        403 developer_credential_required. A Privy access token is NOT a
        developer credential — it is accepted by POST /v1/developer/auth/privy
        only.

        EXCEPTION: POST /v1/developer/auth/verify mints a session and therefore
        takes a fresh wallet signature ONLY — a developer key, an existing
        session cookie/JWT, or an agent key are each refused with 401.
    sessionCookie:
      type: apiKey
      in: cookie
      name: floe_session
      description: >
        HttpOnly dashboard session cookie (HMAC-signed JWT, 7-day sliding
        window) set by POST /v1/developer/auth/privy (email / Google sign-in,
        from a verified Privy access token) or POST /v1/developer/auth/verify
        (a fresh wallet signature). Same format whichever route issued it.
        Equivalent to `developerSession`.
    privyAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A Privy access token (ES256 JWT issued by privy.io for this
        deployment's Privy app — the dashboard's `getAccessToken()`). Accepted
        as a credential ONLY by POST /v1/developer/auth/privy, which exchanges
        it for the `floe_session` cookie; every other route refuses it.

    caseSession:
      type: apiKey
      in: cookie
      name: floe_case_session
      description: >
        L0.8 buyer case session (HttpOnly, Secure, SameSite=Lax, Path=/v1/case,
        8 h) set by POST /v1/case/session from a csh_ link plus a Privy email
        sign-in. Accepted only under /v1/case; refused by every developer
        route. Re-checked on every request against the link (live, not
        replaced) and an active membership; any miss is 404 case_not_found.
        Every request but the session mint also sends X-Floe-Case-Link (409
        case_session_mismatch when missing or for another link).
  headers:
    FloeCostUsdc:
      description: Total charge for this call, raw 6-decimal USDC integer string (e.g. "12500" = $0.0125). "0" on passthrough (provider error — no charge). "deferred" on a streamed (SSE) response — the cost is only known at the terminal usage chunk and is metered as the body drains, so it rides the debit + the OpenAI usage chunk rather than a numeric header.
      schema:
        type: string
    FloePaymentAmount:
      description: Decimal-USDC alias of X-Floe-Cost-USDC (e.g. "0.0125").
      schema:
        type: string
    FloePayment:
      description: How the call was paid — gateway (keyless rails), byok (developer's own vendor key; Floe bills the service fee only), or passthrough (no charge).
      schema:
        type: string
        enum: [gateway, byok, passthrough]
    FloeModel:
      description: The catalog model that served the call.
      schema:
        type: string
    FloeRail:
      description: The execution rail that served the call.
      schema:
        type: string
    FloeBudgetRemaining:
      description: Remaining spendable after this call, DECIMAL USDC string (pre-call ceiling minus this call's cost, floored at zero) — lets an agent self-gate the next call without a round-trip. Best-effort.
      schema:
        type: string
    FloeAttempts:
      description: Number of sources tried (present only when > 1 — failover happened).
      schema:
        type: string

  schemas:
    SystemStatus:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        overall:
          type: string
          enum: [operational, degraded, down]
        indexer:
          type: object
          properties:
            status:
              type: string
            lastUpdateTimestamp:
              type: integer
              nullable: true
            lagSeconds:
              type: integer
              nullable: true
        oracle:
          type: object
          properties:
            status:
              type: string
            circuitBreaker:
              type: object
              properties:
                isActive:
                  type: boolean
                reason:
                  type: integer
                reasonText:
                  type: string
            prices:
              type: array
              items:
                type: object
                properties:
                  symbol:
                    type: string
                  priceUsd:
                    type: string
                  isStale:
                    type: boolean
        markets:
          type: array
          items:
            type: object
            properties:
              marketId:
                type: string
              loanToken:
                type: string
              collateralToken:
                type: string
              availableLiquidityUsd:
                type: string
              totalTvlUsd:
                type: string
              activeLoanCount:
                type: integer
        activity:
          type: object
          properties:
            matchesLast24h:
              type: integer
            totalMatches:
              type: integer
            avgTimeToMatchSeconds:
              type: number
    LedgerEntry:
      type: object
      description: |
        One immutable, period-stamped ledger entry (docs/scope/00-ledger-model.md).
        `source`, `lineage` and `restatement` are the stored provenance records,
        verbatim (snake_case keys). `amount` is integer text in the unit's
        smallest denomination (USDC micro-units for money) — never a float.
      required: [id, initiativeId, period, type, origin, metric, amount, unit, source, confidenceGrade, isEstimate,
        dimensions, lineage, locked, superseded, supersededAt, supersedesEntryId, restates, priorPeriod, restatement,
        reason, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        initiativeId:
          type: string
          pattern: '^init_[0-9a-f]{24}$'
        period:
          type: string
          example: 2026-08
        type:
          type: string
          enum: [cost, value, baseline, forecast, assumption]
        origin:
          type: string
          enum: [ingested, computed, declared]
        metric:
          type: string
        amount:
          type: string
          example: "-1250"
        unit:
          type: string
          example: usdc_micro
        source:
          type: object
          required: [system]
          properties:
            system:
              type: string
            extract_at:
              type: string
              nullable: true
            sample_n:
              type: integer
              nullable: true
            ref:
              type: string
              nullable: true
        confidenceGrade:
          type: string
          enum: [A, B, C, D]
        isEstimate:
          type: boolean
          description: True for grade D (benchmark, vendor-asserted or asserted method)
        dimensions:
          type: object
          additionalProperties:
            type: string
        lineage:
          type: object
          required: [formula_id, input_entry_ids]
          properties:
            formula_id:
              type: string
              nullable: true
              example: sum_cost@1
            input_entry_ids:
              type: array
              items:
                type: string
            method_version_id:
              type: string
        locked:
          type: boolean
          description: True once the entry's period is locked
        superseded:
          type: boolean
          description: True when a supersede replaced this entry
        supersededAt:
          type: string
          format: date-time
          nullable: true
        supersedesEntryId:
          type: string
          format: uuid
          nullable: true
          description: The open-period entry this one corrects
        restates:
          type: string
          format: uuid
          nullable: true
          description: The locked-period entry this one restates
        priorPeriod:
          type: string
          nullable: true
          description: The period the economic event belongs to, when it landed later because that period was locked
        restatement:
          type: object
          nullable: true
          properties:
            method:
              type: string
              enum: [delta, replacement]
            old_amount:
              type: string
            new_amount:
              type: string
        reason:
          type: string
          nullable: true
        createdBy:
          type: string
          description: "`dev:<member wallet>` or `job:<name>`"
        createdAt:
          type: string
          format: date-time
    LedgerCorrectionResponse:
      type: object
      required: [entry, isNew]
      properties:
        entry:
          $ref: "#/components/schemas/LedgerEntry"
        isNew:
          type: boolean
          description: False on a replay of a request already recorded
    LedgerInvalidRequest:
      type: object
      required: [error, field, message]
      properties:
        error:
          type: string
          enum: [invalid_request]
        field:
          type: string
          nullable: true
          description: The request field at fault; null when the body is not JSON
          example: reason
        message:
          type: string
          example: "reason is required: say why the figure changed"
    CaseMember:
      type: object
      required: [id, email, role, invitedBy, createdAt, revokedAt]
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string, enum: [buyer_finance, buyer_viewer] }
        invitedBy: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
    VendorCase:
      type: object
      required: [publicId, name, counterpartyName, status, createdAt, owner, viewerIsOwner, share, members]
      properties:
        publicId: { type: string, pattern: '^case_[0-9a-f]{16}$' }
        name: { type: string }
        counterpartyName: { type: string }
        status: { type: string, enum: [draft, shared, locked, closed] }
        createdAt: { type: string, format: date-time }
        owner:
          type: object
          required: [memberId, label]
          properties:
            memberId: { type: integer, description: account_members id }
            label: { type: string, description: The member's email, else wallet }
        viewerIsOwner:
          type: boolean
          description: >-
            True when the acting member IS the case's owner (their account_members
            id = owner.memberId). The owner may invite / remove buyers and issue /
            revoke the link without being an admin.
        share:
          type: object
          required: [issued, expiresAt, revokedAt, viewCount]
          properties:
            issued: { type: boolean }
            expiresAt: { type: string, format: date-time, nullable: true }
            revokedAt: { type: string, format: date-time, nullable: true }
            viewCount: { type: integer }
        members:
          type: array
          items: { $ref: "#/components/schemas/CaseMember" }
    CaseOwner:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string, enum: [case_member, vendor] }
        label:
          type: string
          description: >-
            An email or vendor label. On buyer routes (/v1/case/*), a member of a
            different case on the same initiative reads as "another counterparty
            member", with no role, and a vendor with no email on file reads
            "vendor" (never a raw wallet).
        role: { type: string, enum: [buyer_finance, buyer_viewer], description: Absent when the member is redacted or removed }
    CaseAssumptionValue:
      type: object
      nullable: true
      required: [entryId, value, grade, citation, asOf, period, caseRef, from, setBy, entryScenario, frozenAtLock]
      properties:
        entryId:
          type: string
          description: >-
            The resolved ledger entry's id. Send it as `entryId` on
            POST /v1/case/assumptions/{key}/approve so a value that changed
            since load is refused (409 value_changed).
        value: { type: string, description: Integer text in the assumption's unit }
        buyerUnapproved:
          type: boolean
          description: >-
            Present when a case is in view (GET /v1/case, or the vendor list with
            ?case=). True for a VENDOR-AUTHORED value (by the entry's author —
            for a lock copy, the copied default's — whoever owns the assumption
            now) the buyer has not approved on this case — that exact entry —
            on an unlocked case. Cleared only by the buyer's approval or the
            baseline lock, never by grade. An approval by a member since
            removed from the case no longer counts.
        approvedBy:
          type: object
          nullable: true
          required: [label, at]
          description: >-
            Present when a case is in view. The approval that currently clears
            the flag for this exact entry on this case (its approver is an
            active member); null when none.
          properties:
            label: { type: string, description: The approver's email (buyer-surface label rules) }
            at: { type: string, format: date-time }
        entryScenario:
          type: string
          nullable: true
          description: >-
            The scenario the shown entry was declared in — e.g. `all` when an
            `all` value answers `expected`.
        frozenAtLock:
          type: boolean
          description: >-
            True for a baseline lock's copy of a default (materialize_on_lock@1);
            citation, asOf and setBy are then the copied default's.
        grade: { type: string, enum: [A, B, C, D] }
        citation: { type: string, nullable: true }
        asOf: { type: string, nullable: true }
        period: { type: string }
        caseRef: { type: string, nullable: true, description: Null = the initiative default }
        from:
          type: string
          enum: [case, default]
          description: >-
            `case` = this case's own value (including a lock's copy of a
            default, which shows that default's citation, asOf and setBy);
            `default` = the vendor's initiative default
        setBy:
          type: object
          required: [kind, label]
          description: >-
            Who created this value. Same labels and redaction as CaseOwner; on
            buyer routes a vendor with no email on file reads "vendor", never a wallet.
          properties:
            kind: { type: string, enum: [case_member, vendor] }
            label: { type: string }
    CaseAssumption:
      type: object
      required: [key, name, unit, owner, editable, values]
      properties:
        key: { type: string }
        name: { type: string }
        unit: { type: string }
        owner: { $ref: "#/components/schemas/CaseOwner" }
        editable: { type: boolean }
        values:
          type: object
          description: Keyed by scenario (conservative, expected, vendor_claim, all)
          additionalProperties: { $ref: "#/components/schemas/CaseAssumptionValue" }
    CaseJournal:
      type: object
      required: [revisions, ownership]
      properties:
        revisions:
          type: array
          items:
            type: object
            required: [key, entryId, period, scenario, caseRef, who, when, old, new, reason, kind, citation, asOf, grade, impactStatus]
            properties:
              key: { type: string }
              entryId: { type: string }
              period: { type: string }
              scenario: { type: string, nullable: true, description: Null when the entry carries no scenario }
              caseRef: { type: string, nullable: true }
              who: { type: string, description: An email or vendor label, never a raw ref }
              when: { type: string, format: date-time }
              old: { type: string, nullable: true }
              new: { type: string }
              reason: { type: string, nullable: true }
              kind:
                type: string
                enum: [first, supersede, restatement, materialized]
                description: "`materialized` = the copy of a default a baseline lock made (who = the locking buyer)"
              citation:
                type: string
                nullable: true
                description: The source cited; on `materialized`, the copied default's (never the formula id)
              asOf: { type: string, format: date-time, nullable: true, description: When the figure was true; on `materialized`, the copied default's }
              setBy:
                type: object
                required: [kind, label]
                description: "`materialized` only — who set the copied default (same labels as CaseOwner)"
                properties:
                  kind: { type: string, enum: [case_member, vendor] }
                  label: { type: string }
              grade: { type: string, enum: [A, B, C, D] }
              impactStatus:
                type: string
                nullable: true
                enum: [pending, computed, not_applicable, null]
                description: >-
                  This revision's impact slots in one word: any pending → pending;
                  all computed → computed; otherwise not_applicable (nothing
                  consumes the assumption yet); null when it has no slots.
        ownership:
          type: array
          description: >-
            Owner CHANGES only, oldest first: `created` for a key's first header,
            then `handover` each time the owner differs from the one before.
            Name / description revisions are not listed.
          items:
            type: object
            required: [key, kind, from, to, by, when, reason]
            properties:
              key: { type: string }
              kind: { type: string, enum: [created, handover] }
              reason: { type: string, nullable: true, description: Why the owner changed (required when it moves away from a buyer) }
              from:
                allOf: [{ $ref: "#/components/schemas/CaseOwner" }]
                nullable: true
                description: Null on `created`
              to: { $ref: "#/components/schemas/CaseOwner" }
              by: { type: string, description: Who made the change (email or vendor label) }
              when: { type: string, format: date-time }
        approvals:
          type: array
          description: Buyer approvals on THIS case, oldest first (GET /v1/case/journal only).
          items: { $ref: "#/components/schemas/CaseValueApproval" }
    CaseValueApproval:
      type: object
      required: [key, scenario, entryId, value, setBy, by, when]
      properties:
        key: { type: string }
        scenario: { type: string, enum: [conservative, expected, vendor_claim, all] }
        entryId: { type: string, description: The exact value entry approved }
        value: { type: string, nullable: true, description: The approved entry's value (integer text) }
        setBy:
          type: object
          nullable: true
          required: [kind, label]
          description: Who set the approved value (for a lock copy, the copied default's author)
          properties:
            kind: { type: string, enum: [case_member, vendor] }
            label: { type: string }
        by: { type: string, description: The approving buyer's email (or a redacted label) }
        when: { type: string, format: date-time }
        approverRemoved:
          type: boolean
          description: >-
            Journal only: the approver has since been removed from the case, so
            this approval no longer clears the buyerUnapproved flag.
    NotAssumptionOwner:
      type: object
      required: [error, message]
      properties:
        error: { type: string, enum: [not_assumption_owner, read_only_member] }
        owner: { $ref: "#/components/schemas/CaseOwner" }
        message: { type: string }
    CaseNotFound:
      type: object
      required: [error, message]
      properties:
        error: { type: string, enum: [case_not_found] }
        message: { type: string, enum: ['This case link is invalid, revoked or expired.'] }
    CaseSessionMember:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [buyer_finance, buyer_viewer] }
    CoverageResponse:
      type: object
      description: |
        Governance coverage split. Money figures carry their grade beside them
        (see FigureGrade); `coverageBps` / `attributionBps` are ratios and are
        NOT graded — read them next to the grade mixes.
      properties:
        days:
          type: integer
        totals:
          type: object
          properties:
            knownRaw:
              type: string
            knownGrade:
              $ref: "#/components/schemas/FigureGrade"
            knownGradeMix:
              $ref: "#/components/schemas/GradeMix"
            knownHeldRaw:
              type: string
              description: Held, not yet charged — NOT in knownRaw (so not in coverageBps), not graded.
            enforceableRaw:
              type: string
            enforceableGrade:
              $ref: "#/components/schemas/FigureGrade"
            enforceableGradeMix:
              $ref: "#/components/schemas/GradeMix"
            enforceableHeldRaw:
              type: string
              description: Held, not yet charged — NOT in enforceableRaw (so not in coverageBps), not graded.
            reconciledRaw:
              type: string
            reconciledGrade:
              $ref: "#/components/schemas/FigureGrade"
            reconciledGradeMix:
              $ref: "#/components/schemas/GradeMix"
            reconciledHeldRaw:
              type: string
              description: Held, not yet charged — NOT in reconciledRaw (so not in coverageBps), not graded.
            coverageBps:
              type: integer
              nullable: true
              description: Share of known spend that was pre-call enforceable, in bps. null = no spend in the window (NOT "100% covered"). Not graded.
        bySource:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                description: vapi | retell | bland | orchestrator | floe-guard | floe-phone | x402-proxy | floe-gateway
              class:
                type: string
                enum: [enforceable, reconciled]
              calls:
                type: integer
              costRaw:
                type: string
              grade:
                $ref: "#/components/schemas/FigureGrade"
              gradeMix:
                $ref: "#/components/schemas/GradeMix"
              heldRaw:
                type: string
                description: Held, not yet charged — not in costRaw, not graded.
        series:
          type: array
          description: Daily chart points (holds excluded, like the totals). Not graded — the graded figures are the totals.
          items:
            type: object
            properties:
              date:
                type: string
              enforceableRaw:
                type: string
              reconciledRaw:
                type: string
        calls:
          type: object
          description: Call counts over the same rows `totals` sums. A top-level sibling of `totals` (which holds only money figures and their grades). `byok` is the subset of `enforceable` served on the caller's own vendor key (rail byok, fee-only rows) — the signal the dashboard uses to tell a keyless-only agent from a BYOK agent whose calls landed at $0.
          properties:
            total:
              type: integer
            enforceable:
              type: integer
            reconciled:
              type: integer
            byok:
              type: integer
        attribution:
          type: object
          description: Share of known spend carrying an end-customer tag.
          properties:
            attributedRaw:
              type: string
            attributedGrade:
              $ref: "#/components/schemas/FigureGrade"
            attributedGradeMix:
              $ref: "#/components/schemas/GradeMix"
            attributedHeldRaw:
              type: string
              description: Held, not yet charged on tagged rows — not in attributedRaw.
            attributedCalls:
              type: integer
            attributionBps:
              type: integer
              nullable: true
              description: Not graded (a ratio).
        dark:
          type: string
          enum: [unknown]

    FigureGrade:
      type: string
      nullable: true
      enum: [A, B, C, D, null]
      description: |
        Server-computed confidence grade of ONE money figure, from the
        provenance of the money inside it. The console never infers it.

        Rule: the grade is the FLOOR — the lowest grade of any non-zero amount
        inside the figure. Never an average, no thresholds (one micro-dollar of
        D makes the figure D). Money with no cost yet (pending legs) adds
        nothing. `null` = the figure holds no non-zero money.

        Legend:
          A — settled and observed by a second source: x402 payment with the
              on-chain transfer observed; vendor leg reconciled exact or to the
              invoice; Floe's plan invoice finalized in Stripe.
          B — authoritative but single-sourced (NOT questionable — one system
              of record): Floe-settled keyless / BYOK fee / marketplace / Floe
              Phone charges and Floe's platform fee; x402 pending settlement;
              vendor leg period-rate; vendor-stated uncaptured residual;
              orchestrator call-end rows; Floe plan invoice draft/upcoming.
          C — human-supplied: manual figures, assumption values, handoff
              costs, a human-confirmed vendor rate.
          D — a cost figure someone asserted or benchmarked: floe-guard
              ledger sync (caller-asserted, list-price cost map); catalog /
              list-price estimates, the cost calculator, forecasts, unconfirmed
              vendor rates.

        Holds are NOT graded in cost figures. A hold (a marketplace or Floe
        Phone reservation with no x402 authorization behind it) is a ceiling
        reserved before the real cost is known, not a cost. Every cost figure
        EXCLUDES holds from its amount, grade and mix and reports them beside
        it as `heldRaw` / `<name>HeldRaw` ("held, not yet charged", ungraded,
        "0" when none). When a hold settles, the real charge replaces it and
        takes that charge's grade (usually B). In figures about money SET
        ASIDE (available balance, budget headroom) a hold grades B; none of
        the graded endpoints today is such a figure. An x402 payment in
        pending_settlement is not a hold (it was signed and sent) — B.

        Naming: an object's headline money field carries `grade` + `gradeMix`
        (+ `heldRaw`) beside it; any other money field `<name>Raw` carries
        `<name>Grade` + `<name>GradeMix` (+ `<name>HeldRaw`). Ratios (coverageBps, attributionBps) are never
        graded — read them next to the mixes.

    GradeMix:
      type: object
      description: >-
        The figure's money split by grade, in the SAME raw unit as the figure
        (6-dp USDC integer text). All four keys are always present; a grade
        with no money is "0". The four values sum to the figure.
      required: [A, B, C, D]
      properties:
        A: { type: string }
        B: { type: string }
        C: { type: string }
        D: { type: string }

    VendorTerms:
      type: object
      required: [id, vendor, termStart, termEnd, documentId, source, confidenceGrade, createdBy, createdAt]
      properties:
        id: { type: integer }
        vendor: { type: string }
        termStart: { type: string, format: date-time }
        termEnd: { type: string, format: date-time, nullable: true }
        documentId: { type: integer, nullable: true }
        source:
          type: object
          properties:
            system: { type: string }
            ref: { type: string, nullable: true }
            extract_at: { type: string, nullable: true }
        confidenceGrade: { type: string, enum: [A, B, C, D] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    VendorTermLineInput:
      type: object
      required: [kind, costComponent, unit, value, periodBasis]
      properties:
        kind: { type: string, enum: [commitment, credit, free_tier, markup, seat_fee, credit_price] }
        costComponent:
          type: string
          description: "* or a cost component: llm, stt, tts, realtime, telephony, tool, avatar, sms, ocr, gpu, compute, seat, credit, data, people"
        unit: { type: string, description: "bps for a markup; usdc_micro or a count noun for an amount; the priced noun for seat_fee / credit_price" }
        value: { type: string, description: Non-negative integer text }
        periodBasis: { type: string, enum: [term, month, none] }
        effectiveFrom: { type: string, description: "YYYY-MM-DD or a timestamp with an offset; defaults to now" }
    VendorTermLine:
      type: object
      required: [id, kind, costComponent, unit, value, periodBasis, effectiveFrom, createdBy, createdAt, current]
      properties:
        id: { type: integer }
        kind: { type: string }
        costComponent: { type: string }
        unit: { type: string }
        value: { type: string }
        periodBasis: { type: string }
        effectiveFrom: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        current: { type: boolean }
    DimensionMapResponse:
      type: object
      required: [map, isNew]
      properties:
        isNew:
          type: boolean
        map:
          $ref: "#/components/schemas/DimensionMap"
    DimensionMap:
      type: object
      required: [id, kind, key, value, effectiveFrom, createdBy, source, createdAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [api_key_team, email_domain_department, department_pnl_line]
        key:
          type: string
        value:
          type: string
        effectiveFrom:
          type: string
          format: date-time
        createdBy:
          type: string
          description: "`dev:<member wallet>` or `csv:<document id>`"
        source:
          type: string
          description: manual | csv | rule:<attribution_rule id>
        createdAt:
          type: string
          format: date-time
    OutcomeClaimRow:
      type: object
      description: >
        One outcome claim as an OPERATOR reads it. Distinct from the shape the
        agent surface returns: this one carries `assertedBy`, which is not an
        agent's to read back, and it carries the binding — the call the claim
        describes, or the reason it has none.
      required:
        - eventId
        - outcomeKind
        - status
        - quantity
        - occurredAt
        - receivedAt
        - confirmedAt
        - source
        - assertedBy
        - identifier
        - binding
        - evidence
        - billedInPeriodId
      properties:
        eventId:
          type: string
          pattern: '^oev_[0-9a-f]{16}$'
        outcomeKind:
          type: string
        status:
          type: string
          enum: [reported, confirmed, disputed, void, reversed]
        quantity:
          type: integer
        occurredAt:
          type: string
          format: date-time
          description: >
            The SPEND anchor — when the outcome HAPPENED. Not the billing
            anchor.
        receivedAt:
          type: string
          format: date-time
          description: The REPORT anchor — when Floe received the claim. Server-stamped.
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: The billing anchor. Null until an operator confirms.
        source:
          type: string
          enum: [agent, operator, orchestrator, client, floe]
        assertedBy:
          type: string
          description: >
            Scheme-prefixed and frozen at write — `key:<id>`, `dev:<wallet>`,
            `session:<subject>`, `webhook:<vendor>:<run_id>`. A string and not
            only a foreign key, because keys rotate and sessions are ephemeral,
            and a dispute a year out needs the value as it was.
        identifier:
          type: object
          description: The claim's identity tuple — what uniqueness is keyed on.
          required: [vendor, kind, identifier]
          properties:
            vendor: { type: string }
            kind:
              type: string
              enum: [floe_task, callsid, vendor_request, orchestrator_call, proxy_request]
            identifier: { type: string }
        binding:
          type: object
          required: [interactionId, customerId, campaignId, matchedVia, unresolvedReason]
          properties:
            interactionId:
              type: string
              nullable: true
              description: The call this claim is bound to; null when unbound.
            customerId:
              type: string
              nullable: true
            campaignId:
              type: string
              nullable: true
            matchedVia:
              type: string
              nullable: true
              description: >
                HOW the claim reached the call — its own identifier kind.
                DERIVED, not stored: `matched_via` is an `interaction_legs`
                column and a binding has no such field.
            unresolvedReason:
              type: string
              nullable: true
              enum: [no_current_binding, null]
              description: >
                Why the claim has no call. Present instead of dropping the row:
                a claim nothing can bill must stay visible, or it becomes a
                silent hole in the number this lane produces.
        evidence:
          type: object
          required: [externalSystem, externalRef, note, redactedAt]
          properties:
            externalSystem:
              type: string
              nullable: true
            externalRef:
              type: string
              nullable: true
              description: Stored verbatim — case-sensitive CRM and calendar ids.
            note:
              type: string
              nullable: true
            redactedAt:
              type: string
              format: date-time
              nullable: true
              description: >
                Stamped when a subject erasure cleared the three fields above.
                The claim, its kind, quantity and period stamp all survive: an
                invoice line must outlive an erasure, a CRM id need not.
        billedInPeriodId:
          type: integer
          nullable: true
          description: Set once a close has billed the claim, which then freezes.

    OutcomeEventEnvelope:
      type: object
      required: [outcome]
      description: >
        P3.1 — one outcome claim. Every id here is operator-facing: the
        bigserial never leaves the database, so a revision names its
        predecessor by the same `oev_…` this route returns.
      properties:
        outcome:
          type: object
          # `serializeOutcomeEvent` always emits every one of these. Nullable
          # and optional are different things: a generated client that types
          # the whole success body as optional makes callers guard fields that
          # are always present.
          required:
            - eventId
            - interactionId
            - outcomeKind
            - status
            - quantity
            - occurredAt
            - receivedAt
            - confirmedAt
            - source
            - externalSystem
            - externalRef
            - evidenceNote
            - supersedesEventId
            - billedInPeriodId
          properties:
            eventId:
              type: string
              pattern: '^oev_[0-9a-f]{16}$'
            interactionId:
              type: string
              nullable: true
              description: The call this claim is bound to.
            outcomeKind:
              type: string
            status:
              type: string
              enum: [reported, confirmed, disputed, void, reversed]
              description: >
                `reversed` is terminal and exists only so a credit line for an
                already-billed claim stays traceable.
            quantity:
              type: integer
            occurredAt:
              type: string
              format: date-time
              description: The SPEND anchor — when the outcome happened.
            receivedAt:
              type: string
              format: date-time
              description: The REPORT anchor — when Floe received it. Server-stamped.
            confirmedAt:
              type: string
              format: date-time
              nullable: true
            source:
              type: string
              enum: [agent, operator, orchestrator, client, floe]
              description: >
                WHO asserted this, stamped at write and frozen — never
                recomputed, because keys rotate and sessions are ephemeral, and
                a dispute a year out needs the value as it was. Only `operator`
                and `client` confirmations may bill.
            externalSystem:
              type: string
              nullable: true
            externalRef:
              type: string
              nullable: true
              description: >
                Stored verbatim. NULL once a subject erasure has redacted it —
                the claim, its kind, quantity and period stamp all survive,
                because an invoice line must outlive an erasure and a CRM id
                need not.
            evidenceNote:
              type: string
              nullable: true
            supersedesEventId:
              type: string
              nullable: true
              pattern: '^oev_[0-9a-f]{16}$'
              description: Null on a first claim; the event this one corrected otherwise.
            billedInPeriodId:
              type: integer
              nullable: true
              description: >
                Set once a close has stamped the claim. A stamped claim is
                FROZEN — correcting it is a reversal in the next open period,
                never an edit.
    VendorRate:
      type: object
      description: |
        One version of what YOU pay a vendor for one leg kind (P1.11). The
        mirror of a rate card, which is what you CHARGE a client.

        AN ESTIMATE, NOT A RECONCILED COST. Never written to
        `ledger_reconciliations`, never summed into a total, never part of a
        `cost_plus` basis — a reconciled actual always supersedes it.

        Append-only: a change is a new version with a later `effectiveFrom`.
      required:
        - id
        - vendor
        - model
        - legKind
        - unit
        - rate
        - ratePico
        - effectiveFrom
        - confirmed
      properties:
        basis:
          type: string
          enum: [list, negotiated]
        confidenceGrade:
          type: string
          enum: [A, B, C, D]
        vendorTermsId:
          type: integer
          nullable: true
        id: { type: integer }
        vendor:
          type: string
          description: Catalog vendor id, lowercased (deepgram, twilio, modal, …).
        model:
          type: string
          description: >-
            The vendor's own model/SKU key, matching floe-guard's bundled map
            key so a rate card round-trips between hosted and the OSS package.
        legKind:
          type: string
          enum: [stt, tts, telephony, avatar, sms, ocr, gpu, llm]
        unit:
          type: string
          enum:
            - usd_per_second
            - usd_per_1k_chars
            - usd_per_minute
            - input_token_1m
            - output_token_1m
            - cached_input_token_1m
            - usd_per_segment
            - usd_per_page
            - usd_per_gpu_second
          description: >-
            The canonical unit for this leg kind, enforced by a CHECK — a `gpu`
            rate declared per hour is a 3600x mis-price and is unstorable.
        rate:
          type: string
          description: >-
            Decimal USD per unit, for display — "0.0000416667". A string, not a
            number: a JSON number here is an IEEE double at the exact scale
            `ratePico` exists to avoid.
        ratePico:
          type: string
          description: >-
            The exact stored value: USD x 1e12 as integer text. Pico, not micro
            — an STT rate of $0.0000416667/sec is 0 in micro-USD and still
            fractional at nano.
        effectiveFrom:
          type: string
          format: date-time
          description: >-
            When this version starts pricing. Monotonic per vendor+model+leg;
            the version in force is the latest at or before the leg's instant.
        sourceUrl:
          type: string
          nullable: true
          description: >-
            The public price list this came from. NULL means UNVERIFIED and
            should render as such — a blank is not the same claim as a citation.
        retrievedAt:
          type: string
          format: date-time
          nullable: true
        confirmed:
          type: boolean
          description: >-
            Has a human accepted this as what they actually pay? A seeded list
            price is false and sits in the review queue. Only confirmed rates
            are served to floe-guard.
        confirmedBy:
          type: string
          nullable: true
          description: Wallet of the member who accepted it. Moves with `confirmed`.
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    ActualsCogsByChannelResponse:
      type: object
      description: Per-channel COGS for one window (GET /v1/developer/actuals/cogs-by-channel).
      required:
        - rows
        - totalRaw
        - range
      properties:
        rows:
          type: array
          description: One row per channel present in the window, ordered by cost descending.
          items:
            type: object
            required: [channel, costRaw, legs]
            properties:
              channel:
                type: string
                enum: [voice, chat, email, video, job, sms]
                description: |
                  The leg's captured channel, or its leg-kind fallback when untagged
                  (voice kinds → voice, else job). `job` is the untagged-non-voice
                  bucket as much as it is a real non-call channel.
              costRaw:
                type: string
                description: |
                  6-dp USDC integer text — Σ reconciled stamp cost over USD stamps in
                  this channel. SIGNED: negative when vendor credits exceed charges.
                  Pending and non-USD legs contribute 0.
              legs:
                type: integer
                description: Every captured leg in the channel, including those contributing 0 cost.
        totalRaw:
          type: string
          description: |
            6-dp USDC integer text — Σ of every row's costRaw, signed. Equals
            /actuals/cogs-by-leg's totalRaw for the same query; that footing is
            the reason this route exists rather than the Pro interactions rollup.
        range:
          type: object
          required: [since, until]
          description: The window actually used, after defaulting and plan-floor clamping.
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
        historyFloor:
          type: string
          format: date-time
          nullable: true
          description: The plan's earliest readable instant, when one applies.
        historyClamped:
          type: boolean
          description: True when `since` was raised to the plan's history floor.

    ActualsAssuranceResponse:
      type: object
      description: The reconciliation-assurance scalar for one scope (GET /v1/developer/actuals/assurance).
      required:
        - scope
        - reconciledRaw
        - unreconciledRaw
        - coverageBps
        - coverageBlockedBy
        - range
      properties:
        scope:
          type: string
          enum: [account, customer]
          description: account = the whole account's COGS; customer = one client's captured spend (residual excluded).
        reconciledRaw:
          type: string
          description: 6-dp USDC integer text — Σ exact/period-rate/invoiced over current USD legs in the window.
        reconciledGrade:
          $ref: "#/components/schemas/FigureGrade"
        reconciledGradeMix:
          $ref: "#/components/schemas/GradeMix"
        unreconciledRaw:
          type: string
          description: >-
            6-dp USDC integer text — the scope's pending/manual captured cost
            (Floe-metered payment, netted of reconciled siblings), plus, at
            ACCOUNT scope only, the uncaptured residual. Customer scope
            excludes the residual (unattributable to a client).
        unreconciledGrade:
          $ref: "#/components/schemas/FigureGrade"
        unreconciledGradeMix:
          $ref: "#/components/schemas/GradeMix"
        unreconciledHeldRaw:
          type: string
          description: >-
            Held, not yet charged — marketplace / Floe Phone holds behind
            unresolved legs. NOT in unreconciledRaw and not graded. A hold has
            no cost yet, so its presence blocks coverageBps with
            `unpriceable_unreconciled`. "0" when none.
        coverageBps:
          type: integer
          nullable: true
          description: reconciled ÷ (reconciled + unreconciled), in bps. null = no known spend, or the ratio is not well-defined (see coverageBlockedBy). A ratio — not graded.
        coverageBlockedBy:
          type: array
          items: { type: string }
          description: |
            Why coverageBps is null despite spend being present. One or more of:
            "non_usd" (non-USD spend, no FX), "unreadable_amount" (a reconciled
            stamp with a null cost), "unknown_group_cost" (a group whose vendor
            total couldn't be resolved), "unpriceable_unreconciled" (an
            unresolved leg with no captured cost yet — no proxy_request, or
            only a hold behind it — both scopes), "mixed_group_sibling" (a shared proxy_request mixes a
            resolved group-scope sibling with an unresolved one — both scopes),
            "signed_adjustment" (vendor credits
            pushed the ratio outside [0, known]). Empty when the ratio is stated
            or the scope is simply empty.
        range:
          type: object
          required: [since, until]
          properties:
            since: { type: string }
            until: { type: string }
        costOwner: { type: string }
        costOwnerNote: { type: string }
        historyFloor: { type: string, nullable: true }
        historyClamped: { type: boolean }

