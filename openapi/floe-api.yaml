  /v1/developer/spend-series:
    get:
      tags: [Developer]
      summary: Daily spend series for the dashboard chart
      description: |
        Aggregates proxy_requests for the developer's agents (or one owned
        agent via ?agentId=) over EITHER the last `days` UTC calendar days or
        an explicit half-open [since, until) range spanning at most 90 days.
        The two forms are mutually exclusive: passing both is a 400, since the
        caller could not otherwise tell which window the chart covers. Spend
        inclusion mirrors PolicyService.getSpend exactly (status
        success|pending AND payment_amount_raw set, valued as payment +
        platform fee) so the chart and policy enforcement can never
        disagree. A developer with no agents gets an empty zero-filled
        series, not a 404.
      operationId: devGetSpendSeries
      security:
        - developerSession: []
      parameters:
        - name: days
          in: query
          description: Rolling window ending today. Mutually exclusive with since/until.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound of a half-open range; clamped to the plan's history floor. Mutually exclusive with `days`.
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound, defaulting to now. The resulting range may span at most 90 UTC days.
        - name: agentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Dense zero-filled daily series + top-8 vendor rollup (+ 'other') + window totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: integer
                    description: Width of the window in UTC calendar days.
                  range:
                    type: object
                    description: The half-open window actually charted, after the plan's history clamp.
                    properties:
                      since:
                        type: string
                        format: date-time
                      until:
                        type: string
                        format: date-time
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: UTC calendar day, YYYY-MM-DD.
                        totalRaw:
                          type: string
                          description: Spend that day, raw USDC (6 decimals).
                  byVendor:
                    type: array
                    items:
                      type: object
                      properties:
                        host:
                          type: string
                        totalRaw:
                          type: string
                  totals:
                    type: object
                    properties:
                      requests:
                        type: integer
                        description: Every row in the window regardless of status.
                      declined:
                        type: integer
                        description: status IN (failed, rejected).
                      totalRaw:
                        type: string
        "400":
          description: >-
            Invalid days / agentId; `days` sent together with since/until; a
            malformed since or until; until <= since; or a range spanning more
            than 90 days.
        "404":
          description: Agent not found or not owned by caller

  /v1/developer/ledger:
    get:
      tags: [Developer]
      summary: Cross-source ledger rollup (Floe rails + reconciled orchestrators)
      description: |
        One money view across every execution path — gateway rails, x402
        proxy, Floe Phone, and orchestrator-reconciled spend (Vapi/Retell/
        Bland call-end ingests) — rolled up by the requested dimension.
        Untagged rows bucket under 'untagged' (tagged=false) for the
        customer/task dimensions; top 50 TAGGED rows + an 'other' remainder of
        tagged rows only. The untagged bucket never competes for the cut: it is
        always a row (when non-zero) and always reported on its own as
        `untaggedRaw`, so a small untagged bucket can't vanish into `other`.
        Every money figure is graded (see FigureGrade).

        DEPRECATED: `groupBy=campaign`. This route reads `proxy_requests`,
        which has no campaign column, so `campaign` has always returned
        **task_id** buckets — a different meaning from
        `/actuals/rollups?by=campaign` and `/interactions/rollups?by=campaign`,
        which group on a real campaign id. Use `groupBy=task` for identical
        data under its real name, or `/interactions/rollups?by=campaign` for an
        actual campaign rollup. Responses to `groupBy=campaign` carry
        `Deprecation: ?1` (RFC 9745 Structured Field Boolean), a `Link`
        successor-version header, and `Sunset: Mon, 19 Oct 2026 00:00:00 GMT`
        (RFC 8594 HTTP-date); on and after **2026-10-19** it returns
        400 `groupBy_removed` carrying the same pointer in the body.

        `customer`, `campaign` and `task` are attribution dimensions and require
        the Pro `attribution_reports` feature (403 `plan_required` below it).
        `task` is gated exactly like the `campaign` alias it replaces — renaming
        a dimension does not change who may read it. `source` and `agent` are
        open on every plan.
      operationId: devGetLedger
      security:
        - developerSession: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
        - name: groupBy
          in: query
          description: |
            `campaign` is deprecated and returns task buckets — prefer `task`.
          schema:
            type: string
            enum: [source, customer, campaign, agent, task]
            default: source
        - name: agentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Rollup rows sorted by spend
          headers:
            Deprecation:
              schema:
                type: string
                enum: ["?1"]
              description: >-
                RFC 9745 Structured Field Boolean. Present ONLY on
                `groupBy=campaign`.
            Link:
              schema:
                type: string
              description: >-
                `</v1/developer/interactions/rollups?by=campaign>;
                rel="successor-version"` — present only on `groupBy=campaign`.
            Sunset:
              schema:
                type: string
              description: >-
                RFC 8594 HTTP-date after which `groupBy=campaign` returns 400 —
                `Mon, 19 Oct 2026 00:00:00 GMT`. Present only on
                `groupBy=campaign`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: integer
                  groupBy:
                    type: string
                  totalRaw:
                    type: string
                    description: Window total, raw USDC (6 decimals).
                  grade:
                    $ref: "#/components/schemas/FigureGrade"
                  gradeMix:
                    $ref: "#/components/schemas/GradeMix"
                  untaggedRaw:
                    type: string
                    nullable: true
                    description: >-
                      Untagged (unattributed) spend in the window, raw USDC —
                      always the FULL bucket, outside the top-50 cut. "0" when
                      every row is tagged. null for groupBy=source|agent, which
                      have no tag to be missing.
                  untaggedGrade:
                    $ref: "#/components/schemas/FigureGrade"
                  untaggedGradeMix:
                    allOf:
                      - $ref: "#/components/schemas/GradeMix"
                    nullable: true
                    description: null exactly when untaggedRaw is null.
                  untaggedHeldRaw:
                    type: string
                    nullable: true
                    description: Untagged holds — held, not yet charged; NOT in untaggedRaw. null exactly when untaggedRaw is null.
                  heldRaw:
                    type: string
                    description: Held, not yet charged in the window — NOT in totalRaw or any row's costRaw, not graded. "0" when none.
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        tagged:
                          type: boolean
                          description: False = rows missing the tag (filter on this, never the label).
                        calls:
                          type: integer
                        costRaw:
                          type: string
                        grade:
                          $ref: "#/components/schemas/FigureGrade"
                        gradeMix:
                          $ref: "#/components/schemas/GradeMix"
                        heldRaw:
                          type: string
                          description: Held, not yet charged in this bucket — not in costRaw, not graded. Buckets rank by costRaw only.
                        reconciledRaw:
                          type: string
                          description: Portion of the bucket that was orchestrator-reconciled, raw USDC (6 decimals).
                        reconciledGrade:
                          $ref: "#/components/schemas/FigureGrade"
                        reconciledGradeMix:
                          $ref: "#/components/schemas/GradeMix"
              example:
                days: 30
                groupBy: customer
                totalRaw: "1160"
                grade: D
                gradeMix: { A: "900", B: "210", C: "0", D: "50" }
                untaggedRaw: "50"
                untaggedGrade: D
                untaggedGradeMix: { A: "0", B: "0", C: "0", D: "50" }
                untaggedHeldRaw: "0"
                heldRaw: "2000000"
                rows:
                  - { key: acme, tagged: true, calls: 3, costRaw: "1110", grade: B, gradeMix: { A: "900", B: "210", C: "0", D: "0" }, heldRaw: "2000000", reconciledRaw: "200", reconciledGrade: B, reconciledGradeMix: { A: "0", B: "200", C: "0", D: "0" } }
                  - { key: untagged, tagged: false, calls: 1, costRaw: "50", grade: D, gradeMix: { A: "0", B: "0", C: "0", D: "50" }, heldRaw: "0", reconciledRaw: "50", reconciledGrade: D, reconciledGradeMix: { A: "0", B: "0", C: "0", D: "50" } }
                historyFloor: null
                historyClamped: false
        "400":
          description: >-
            Invalid days / groupBy / agentId — or, on and after 2026-10-19,
            `groupBy=campaign`, which is removed.
          headers:
            Deprecation:
              schema: { type: string, enum: ["?1"] }
              description: Present when the refused dimension is `campaign`.
            Link:
              schema: { type: string }
              description: Successor-version pointer, on `campaign` only.
            Sunset:
              schema: { type: string }
              description: RFC 8594 HTTP-date, on `campaign` only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: >-
                      `groupBy_removed` once the campaign alias is past its
                      Sunset; otherwise a plain validation message.
                  message:
                    type: string
                  successor:
                    type: string
                    description: /v1/developer/interactions/rollups?by=campaign
                  equivalent:
                    type: string
                    description: >-
                      `groupBy=task` — the identical data under its real name.
        "403":
          description: >-
            `plan_required` — `customer`, `campaign` and `task` need the Pro
            `attribution_reports` feature. `source` and `agent` never 403.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [plan_required] }
                  plan: { type: string }
                  current: { type: string }
                  feature: { type: string }
                  upgradeUrl: { type: string }
        "404":
          description: Agent not found or not owned by caller

  /v1/developer/dimension-maps:
    get:
      tags: [Developer]
      summary: List the current dimension mappings
      description: |
        The current row per (kind, key), ordered by kind then key. Earlier rows
        are kept as history but not listed.
      operationId: devListDimensionMaps
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [api_key_team, email_domain_department, department_pnl_line]
      responses:
        "200":
          description: Current mappings
          content:
            application/json:
              schema:
                type: object
                required: [maps]
                properties:
                  maps:
                    type: array
                    items:
                      $ref: "#/components/schemas/DimensionMap"
        "400":
          description: invalid_kind
    post:
      tags: [Developer]
      summary: Declare a dimension mapping
      description: |
        Maps an api key to a team, an email (or email domain) to a department,
        or a department to a P&L line. Mappings are append-only and
        effective-dated: declaring a new value for a key inserts a row and
        seals the previous one. `effective_from` may be backdated so a mapping
        covers periods already ingested; it defaults to now. Declaring the
        current value and effective_from again is a no-op (200).

        Owner/admin role.
      operationId: devDeclareDimensionMap
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, key, value]
              properties:
                kind:
                  type: string
                  enum: [api_key_team, email_domain_department, department_pnl_line]
                key:
                  type: string
                  description: "`<system>:<id>` for an api key; a full email or a bare domain; a department name"
                value:
                  type: string
                  description: A team, a department, or a P&L line (cogs | rnd | sm | ga)
                effective_from:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Declared (a new row; any previous current row for the key is sealed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionMapResponse"
        "200":
          description: Already the current mapping — nothing written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionMapResponse"
        "400":
          description: invalid_kind, invalid_key, invalid_value, or invalid_effective_from
        "403":
          description: Not owner/admin

  /v1/developer/dimension-maps/import:
    post:
      tags: [Developer]
      summary: Import dimension mappings from a CSV
      description: |
        Loads one kind of mapping from a CSV, all-or-nothing. Columns are read by
        header name; an unrecognised header halts the import and is listed.
        Accepted headers (case and punctuation ignored):
        api_key_team `api_key`/`key`, `team`/`value`;
        email_domain_department `email`/`domain`/`key`, `department`/`value`;
        department_pnl_line `department`/`key`, `p&l_line`/`value`;
        all kinds accept an optional `effective_from`.
        A key listed twice is refused. Rows are recorded as `created_by =
        csv:<document id>`, where the id is the file's content hash; a document
        already imported for this kind is a replay and writes nothing.
        `effective_from` (column or query) is `YYYY-MM-DD` or a timestamp with
        an explicit offset.

        Owner/admin role.
      operationId: devImportDimensionMaps
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [api_key_team, email_domain_department, department_pnl_line]
        - name: effective_from
          in: query
          required: false
          description: Default effective_from for rows without their own
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                required: [documentId, rows, inserted, unchanged, replay]
                properties:
                  documentId:
                    type: string
                  rows:
                    type: integer
                  inserted:
                    type: integer
                  unchanged:
                    type: integer
                  replay:
                    type: boolean
                    description: This document was already imported for this kind; nothing was written
        "400":
          description: "invalid_kind, invalid_effective_from, empty, unmapped_header / ambiguous_header / missing_header (with `headers`), or invalid_rows (with numbered `rows`)"
        "403":
          description: Not owner/admin
        "413":
          description: CSV larger than 1 MiB

  /v1/developer/dimension-maps/unmapped:
    get:
      tags: [Developer]
      summary: Unmapped api keys or departments, with the period's spend
      description: |
        `kind=api_key_team`: every `dimensions.api_key` on the period's current
        cost entries with no team mapping in effect now, summed per unit,
        largest first.

        `kind=department_pnl_line`: every department that a live email/domain
        mapping points at, or that appears on the period's entries, with no P&L
        line mapping in effect now, plus the period's cost against it (0 and
        unit null when it has none).
      operationId: devListUnmappedDimensions
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [api_key_team, department_pnl_line]
        - name: period
          in: query
          required: false
          description: YYYY-MM or YYYY-Www; defaults to the current UTC month
          schema:
            type: string
      responses:
        "200":
          description: Unmapped keys or departments
          content:
            application/json:
              schema:
                type: object
                required: [kind, period, asOf, unmapped]
                properties:
                  kind:
                    type: string
                  period:
                    type: string
                  asOf:
                    type: string
                    format: date-time
                  unmapped:
                    type: array
                    items:
                      type: object
                      required: [key, unit, amount]
                      properties:
                        key:
                          type: string
                        unit:
                          type: string
                          nullable: true
                        amount:
                          type: string
                          description: Integer text in the unit's smallest denomination
        "400":
          description: invalid_kind or invalid_period

  /v1/developer/ledger/periods:
    get:
      tags: [Developer]
      summary: List ledger periods
      description: |
        The account's ledger periods that a close has touched, newest period
        first (ordered by when the period ends, so months and ISO weeks
        interleave by date). A period with no row here is open.

        Any account member can read.
      operationId: devListLedgerPeriods
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 120
            default: 24
          description: One decimal integer; a repeated or non-decimal value is 400 invalid_limit.
      responses:
        "200":
          description: Period rows, newest first
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items:
                      type: object
                      required: [key, cadence, status, lockedAt, lockedBy]
                      properties:
                        key:
                          type: string
                          example: 2026-08
                        cadence:
                          type: string
                          enum: [month, week]
                        status:
                          type: string
                          enum: [open, locked]
                        lockedAt:
                          type: string
                          format: date-time
                          nullable: true
                        lockedBy:
                          type: string
                          nullable: true
                          description: "`dev:<member wallet>` of whoever locked it"
        "400":
          description: "`invalid_limit` — limit is not an integer from 1 to 120"

  /v1/developer/ledger/periods/{key}/lock:
    post:
      tags: [Developer]
      summary: Lock a ledger period
      description: |
        Locks a month (`YYYY-MM`) or ISO week (`YYYY-Www`) of the AI Initiative
        Ledger. After a lock no row in that period ever changes: late data
        lands in the next open period as a restatement (`restates` set) or a
        late addition (`prior_period` set).

        A period can only be locked once it has fully elapsed (UTC). Locking is
        idempotent: locking a locked period returns it unchanged with
        `alreadyLocked: true` and the original `lockedAt` / `lockedBy`.

        Owner/admin role.
      operationId: devLockLedgerPeriod
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-((0[1-9]|1[0-2])|W(0[1-9]|[1-4][0-9]|5[0-3]))$'
          example: 2026-08
      responses:
        "200":
          description: Locked now, or already locked
          content:
            application/json:
              schema:
                type: object
                required: [period, alreadyLocked, entriesLocked]
                properties:
                  period:
                    type: object
                    required: [key, cadence, status, lockedAt, lockedBy]
                    properties:
                      key:
                        type: string
                      cadence:
                        type: string
                        enum: [month, week]
                      status:
                        type: string
                        enum: [locked]
                      lockedAt:
                        type: string
                        format: date-time
                      lockedBy:
                        type: string
                        description: "`dev:<member wallet>` of whoever locked it"
                  alreadyLocked:
                    type: boolean
                  entriesLocked:
                    type: integer
                    description: Entries stamped `locked` by this call (0 on a repeat)
        "400":
          description: "`invalid_period` — the key is not YYYY-MM or an ISO week the year has"
        "403":
          description: Not owner/admin
        "409":
          description: "`period_not_ended` — the period has not fully elapsed"

  /v1/developer/initiatives:
    get:
      tags: [Developer]
      summary: List initiatives
      description: |
        The account's AI initiatives — the records every ledger entry hangs
        off — newest first. Read-only. Any account member can read.
      operationId: devListInitiatives
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: One decimal integer; a repeated or non-decimal value is 400 invalid_limit.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "400":
          description: "`invalid_limit`"
        "200":
          description: Initiatives, newest first
          content:
            application/json:
              schema:
                type: object
                required: [initiatives]
                properties:
                  initiatives:
                    type: array
                    items:
                      type: object
                      required: [id, name, status, createdAt]
                      properties:
                        id:
                          type: string
                          pattern: '^init_[0-9a-f]{24}$'
                        name:
                          type: string
                        status:
                          type: string
                          enum: [draft, active, closed]
                        createdAt:
                          type: string
                          format: date-time

  /v1/developer/initiatives/{id}:
    get:
      tags: [Developer]
      summary: Get an initiative
      description: |
        One initiative by its public id (`init_…`). Another account's
        initiative returns 404, the same as a missing one. Any account member
        can read.
      operationId: devGetInitiative
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^init_[0-9a-f]{24}$'
      responses:
        "200":
          description: The initiative
          content:
            application/json:
              schema:
                type: object
                required: [initiative]
                properties:
                  initiative:
                    type: object
                    required: [id, name, status, createdAt]
                    properties:
                      id:
                        type: string
                        pattern: '^init_[0-9a-f]{24}$'
                      name:
                        type: string
                      status:
                        type: string
                        enum: [draft, active, closed]
                      createdAt:
                        type: string
                        format: date-time
        "404":
          description: "`initiative_not_found` — no such initiative in this account"

  /v1/developer/initiatives/{id}/cases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^init_[0-9a-f]{24}$' } }
    get:
      tags: [Developer]
      summary: List an initiative's shared cases (L0.8)
      description: |
        Every case (model version shared with a counterparty) on the initiative,
        oldest first, with link state and buyer members (revoked ones included).
        Any account member. Another account's initiative is 404.
      operationId: devListCases
      security:
        - developerSession: []
        - developerApiKey: []
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items: { $ref: "#/components/schemas/VendorCase" }
        "404":
          description: "`initiative_not_found`"
    post:
      tags: [Developer]
      summary: Create a case (L0.8)
      description: |
        A draft case on the initiative. The vendor-side owner defaults to the
        acting member (`ownerMemberId` = an account_members id of THIS
        account, holding role member or above — a viewer cannot own a case).
        Role: member or above.
      operationId: devCreateCase
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, counterpartyName]
              properties:
                name: { type: string, maxLength: 200 }
                counterpartyName: { type: string, maxLength: 200 }
                ownerMemberId: { type: integer, minimum: 1 }
      responses:
        "201":
          description: The case
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/VendorCase" }
        "400":
          description: "`invalid_request` / `invalid_owner_member` / `owner_role_too_low` (the owner is a viewer)"
        "403":
          description: Viewer role
        "404":
          description: "`initiative_not_found`"

  /v1/developer/initiatives/{id}/cases/{caseId}:
    get:
      tags: [Developer]
      summary: Get a case (L0.8)
      operationId: devGetCase
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: caseId, in: path, required: true, schema: { type: string, pattern: '^case_[0-9a-f]{16}$' } }
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/VendorCase" }
        "404":
          description: "`initiative_not_found` / `case_not_found`"
    patch:
      tags: [Developer]
      summary: Reassign a case's vendor owner (L0.8)
      description: |
        Sets the case's vendor-side owner (the person named when a buyer is
        refused on a vendor-owned assumption). `ownerMemberId` must be an
        account member of THIS account with role member or above. Reassign before removing that person
        from the team or demoting them to viewer (either is 409
        `member_owns_case` otherwise).
        Role: admin or above.
      operationId: devReassignCaseOwner
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: caseId, in: path, required: true, schema: { type: string, pattern: '^case_[0-9a-f]{16}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerMemberId]
              properties:
                ownerMemberId: { type: integer, minimum: 1, description: An account_members id of this account }
      responses:
        "200":
          description: The case with its new owner
          content:
            application/json:
              schema:
                type: object
                required: [case]
                properties:
                  case: { $ref: "#/components/schemas/VendorCase" }
        "400":
          description: "`invalid_request` / `invalid_owner_member` (not a member of this account) / `owner_role_too_low` (a viewer)"
        "403":
          description: Below admin
        "404":
          description: "`initiative_not_found` / `case_not_found`"

  /v1/developer/initiatives/{id}/cases/{caseId}/members:
    post:
      tags: [Developer]
      summary: Invite a buyer to a case (L0.8)
      description: |
        By email (lowercased; matched against the buyer's Privy-verified email
        at sign-in). One active membership per email per case; a role change is
        remove + invite. Role: admin or above, or this case's owner
        (`viewerIsOwner`).
      operationId: devInviteCaseMember
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: caseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [buyer_finance, buyer_viewer] }
      responses:
        "201":
          description: The member
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/CaseMember" }
        "400":
          description: "`invalid_request`"
        "403":
          description: Neither an admin nor this case's owner
        "404":
          description: "`initiative_not_found` / `case_not_found`"
        "409":
          description: "`member_already_active`"

  /v1/developer/initiatives/{id}/cases/{caseId}/members/{memberId}:
    delete:
      tags: [Developer]
      summary: Remove one buyer from a case (L0.8)
      description: Stamps revoked_at on that membership only; the link and other members keep working. Role — admin or above, or this case's owner (`viewerIsOwner`).
      operationId: devRemoveCaseMember
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The revoked membership
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/CaseMember" }
        "403":
          description: Neither an admin nor this case's owner
        "404":
          description: "`member_not_found` (or already removed), `case_not_found`, `initiative_not_found`"

  /v1/developer/initiatives/{id}/cases/{caseId}/share:
    post:
      tags: [Developer]
      summary: Issue the case link (L0.8)
      description: |
        Mints a `csh_` token, returned ONCE and stored only as its sha256. One
        live link at a time: 409 while one is live; after revoke or expiry a new
        link replaces the old, which (and every session from it) stops working.
        Moves a draft case to shared. The link alone grants nothing — the buyer
        must also sign in with an invited email. Lasts 90 days unless
        `expiresInDays` says otherwise (max 365). Role: admin or above, or this
        case's owner (`viewerIsOwner`).
      operationId: devIssueCaseLink
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: caseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expiresInDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        "201":
          description: The link, shown once
          content:
            application/json:
              schema:
                type: object
                required: [token, path, expiresAt]
                properties:
                  token: { type: string, pattern: '^csh_[0-9a-f]{48}$' }
                  path: { type: string, example: /case/csh_… }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: "`invalid_request` — expiresInDays"
        "403":
          description: Neither an admin nor this case's owner
        "404":
          description: "`initiative_not_found` / `case_not_found`"
        "409":
          description: "`share_already_issued` — a live link exists"

  /v1/developer/initiatives/{id}/cases/{caseId}/share/revoke:
    post:
      tags: [Developer]
      summary: Revoke the case link (L0.8)
      description: The link is then 404 for everyone, signed-in members included. Role — admin or above, or this case's owner (`viewerIsOwner`).
      operationId: devRevokeCaseLink
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "{ revoked: true }"
        "403":
          description: Neither an admin nor this case's owner
        "404":
          description: "`initiative_not_found` / `case_not_found`"
        "409":
          description: "`share_not_issued`"

  /v1/developer/initiatives/{id}/assumptions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Developer]
      summary: List assumptions with owner and values (L0.6/L0.8)
      description: |
        Current headers with their owner and the value per scenario: the
        initiative default, or with `?case=` the value that case reads (the
        same rule as GET /v1/case; a locked case reads only its own values, and
        each value then carries `buyerUnapproved`). `editable` = vendor-owned.
        Any account member.
      operationId: devListAssumptions
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: case, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Assumptions
          content:
            application/json:
              schema:
                type: object
                required: [assumptions]
                properties:
                  assumptions:
                    type: array
                    items: { $ref: "#/components/schemas/CaseAssumption" }
        "404":
          description: "`initiative_not_found` / `case_not_found`"
    post:
      tags: [Developer]
      summary: Create an assumption header (L0.6/L0.8)
      description: |
        `owner` is `dev:<account wallet>` (default) or `case_member:<id>` of an
        active buyer_finance on a case of this initiative. Role: member or above.
      operationId: devCreateAssumption
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, name, unit]
              properties:
                key: { type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$' }
                name: { type: string }
                unit: { type: string }
                description: { type: string }
                owner: { type: string }
      responses:
        "201":
          description: "{ assumption: { key, name, unit, description, owner } }"
        "400":
          description: "`invalid_request` / `invalid_owner`"
        "403":
          description: Viewer role
        "404":
          description: "`initiative_not_found`"
        "409":
          description: "`assumption_exists` — also when a concurrent create won the race (unique current header)"

  /v1/developer/initiatives/{id}/assumptions/journal:
    get:
      tags: [Developer]
      summary: Assumption journal (L0.6/L0.8)
      description: |
        Every value revision (who, when, old, new, reason, kind, citation,
        grade; defaults and every case) and every ownership change (each header
        row, with who made it). Any account member.
      operationId: devAssumptionJournal
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: key, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseJournal" }
        "404":
          description: "`initiative_not_found`"

  /v1/developer/initiatives/{id}/assumptions/{key}/value:
    put:
      tags: [Developer]
      summary: Declare an assumption value (L0.6/L0.8)
      description: |
        A new ledger entry (never an edit): first value, supersede in an open
        period, or a restatement into the next open period once locked. A change
        needs a reason. `caseRef` must be a case on this initiative. The vendor
        may only declare on a vendor-owned key (403 names the owner) and may not
        write a case value once the buyer locked that case's baseline (409). The
        initiative default (no caseRef) stays writable while a case is locked:
        the lock copied every default that case read into the case. Grading: a
        named source (`citation.ref`) is C at best; no ref (absent or blank), a
        benchmark, or a `vendor_claim` value (vendor-asserted) is D. Role: member
        or above.
      operationId: devDeclareAssumptionValue
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value, scenario, citation, asOf, period]
              properties:
                value: { type: string, pattern: '^-?[0-9]+$', description: Integer text in the header's unit }
                scenario: { type: string, enum: [conservative, expected, vendor_claim, all] }
                caseRef: { type: string }
                citation:
                  type: object
                  additionalProperties: false
                  properties:
                    ref: { type: string, maxLength: 500, description: The named source. Absent or blank = no source — grade D }
                    benchmark: { type: boolean, description: A benchmark or vendor-asserted figure — grade D }
                asOf: { type: string, description: YYYY-MM-DD or an offset timestamp }
                period: { type: string }
                grade: { type: string, enum: [A, B, C, D], description: Capped at C; a benchmark or a vendor_claim value is D }
                reason: { type: string }
      responses:
        "201":
          description: "{ entryId, period, value, grade, isNew: true }"
        "200":
          description: A replay of the current declaration (isNew false)
        "400":
          description: "`invalid_request` / `invalid_case_ref` / `invalid_assumption_value`"
        "403":
          description: "`not_assumption_owner`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotAssumptionOwner" }
        "404":
          description: "`initiative_not_found` / `assumption_not_found`"
        "409":
          description: "`case_baseline_locked` / `period_locked` / `revision_conflict`"

  /v1/developer/initiatives/{id}/assumptions/{key}/owner:
    put:
      tags: [Developer]
      summary: Hand an assumption to a new owner (L0.8)
      description: |
        A new header row (append-only) with created_by = the acting member; the
        journal's ownership list shows it. Target: `dev:<account wallet>` or
        `case_member:<id>` of an ACTIVE buyer_finance on a case of this
        initiative. The buyer has no way to claim one. Moving it away from a
        buyer (case_member → vendor, or → another buyer) needs a non-blank
        `reason`, kept on the header and shown in both journals. Role: member
        or above.
      operationId: devSetAssumptionOwner
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner]
              properties:
                owner: { type: string }
                reason: { type: string, maxLength: 2000, description: Required when the current owner is a buyer (a takeback or a buyer-to-buyer handover) }
      responses:
        "200":
          description: "{ assumption: { key, owner } }"
        "400":
          description: "`invalid_request` / `invalid_owner` / `reason_required` (moving it away from a buyer — to the vendor or another buyer — without a reason)"
        "403":
          description: Viewer role
        "404":
          description: "`initiative_not_found` / `assumption_not_found`"

  /v1/developer/ledger/entries:
    get:
      tags: [Developer]
      summary: List ledger entries of an initiative
      description: |
        The initiative's CURRENT ledger entries (an entry replaced by a
        supersede is omitted; read it by id). Newest period first — by when the
        period ends, so months and ISO weeks interleave by date — then newest
        written first; the order is total, so the same state always returns the
        same bytes. `hasMore` is true when `limit` cut the list.

        Another account's initiative is 404, the same as a missing one. Any
        account member can read.
      operationId: devListLedgerEntries
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: initiative
          in: query
          required: true
          schema:
            type: string
            pattern: '^init_[0-9a-f]{24}$'
        - name: period
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{4}-((0[1-9]|1[0-2])|W(0[1-9]|[1-4][0-9]|5[0-3]))$'
          example: 2026-08
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [cost, value, baseline, forecast, assumption]
        - name: limit
          in: query
          required: false
          description: One decimal integer; a repeated or non-decimal value is 400.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Current entries, newest period first
          content:
            application/json:
              schema:
                type: object
                required: [entries, hasMore]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerEntry"
                  hasMore:
                    type: boolean
        "400":
          description: "`invalid_request` — `field` names the bad query parameter (initiative, period, type or limit)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerInvalidRequest"
        "404":
          description: "`initiative_not_found`"

  /v1/developer/ledger/entries/{id}:
    get:
      tags: [Developer]
      summary: Get a ledger entry with its lineage inputs
      description: |
        One entry (current or superseded) and the entries its
        `lineage.input_entry_ids` name, resolved one hop deep inside this
        account. An input id that does not resolve here — missing, or another
        account's — is listed under `unresolvedInputIds` and never read.
        `supersededBy` / `restatedBy` name the entries that replace it.

        Another account's entry is 404, the same as a missing one. Any account
        member can read.
      operationId: devGetLedgerEntry
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/LedgerEntryId"
      responses:
        "200":
          description: The entry and its inputs
          content:
            application/json:
              schema:
                type: object
                required: [entry, inputs, unresolvedInputIds, supersededBy, restatedBy]
                properties:
                  entry:
                    $ref: "#/components/schemas/LedgerEntry"
                  inputs:
                    type: array
                    description: Resolved lineage inputs, in lineage order
                    items:
                      $ref: "#/components/schemas/LedgerEntry"
                  unresolvedInputIds:
                    type: array
                    items:
                      type: string
                  supersededBy:
                    type: string
                    format: uuid
                    nullable: true
                  restatedBy:
                    type: string
                    format: uuid
                    nullable: true
        "404":
          description: "`entry_not_found`"

  /v1/developer/ledger/entries/{id}/supersede:
    post:
      tags: [Developer]
      summary: Correct a ledger entry in an open period
      description: |
        Replaces an entry of an OPEN period: the entry is sealed and a
        correction is written in the same period with `supersedesEntryId` set.
        A correction before lock leaves no trace on the P&L.

        The new amount is typed by a person, so the correction is recorded as
        `origin: declared`, `source: {system: manual_correction, ref: dev:<member>}`,
        and grade C at most — D when the body says `estimate: true` — and never
        better than the entry it replaces (a D stays D). A correction backed by
        an uploaded, footed invoice reaches grade A only through the invoice
        route, never through this hand-typed route.

        Idempotent: the same request again returns the recorded correction with
        200 and `isNew: false`; a different amount is 409 `already_superseded`.
        An entry of a locked period is 409 `period_locked` — use restate.
        Assumption values change only through the assumptions register route
        (L0.6), `PUT /v1/developer/initiatives/{id}/assumptions/{key}/value`;
        this route refuses them with 409 `assumption_register_only`.

        Member role or higher.
      operationId: devSupersedeLedgerEntry
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/LedgerEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, reason]
              properties:
                amount:
                  type: string
                  pattern: '^(0|-?[1-9][0-9]{0,29})$'
                  description: The corrected value, integer text in the entry's unit
                  example: "120000"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                estimate:
                  type: boolean
                  default: false
                  description: The person marks the figure an estimate — grade D (and `isEstimate` true)
      responses:
        "201":
          description: Correction written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCorrectionResponse"
        "200":
          description: Replay — the correction already recorded for this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCorrectionResponse"
        "400":
          description: "`invalid_request` — `field` names the missing or bad body field"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerInvalidRequest"
        "403":
          description: Viewer role
        "404":
          description: "`entry_not_found`"
        "409":
          description: "`period_locked` (use restate), `no_change`, `already_superseded`, `supersede_conflict` (already replaced, or a restatement), `assumption_register_only`"

  /v1/developer/ledger/entries/{id}/restate:
    post:
      tags: [Developer]
      summary: Restate a ledger entry of a locked period
      description: |
        Restates an entry of a LOCKED period. The locked entry never changes
        (byte-identical); a restatement is written in the next open period with
        `restates` = the entry and `priorPeriod` = its economic period. Flows
        (cost, value, forecast) carry the delta new − old; levels (baseline)
        carry the new value; `restatement` records method, old and new.

        Provenance as for supersede: `source.system = manual_correction`, grade
        C at most (D with `estimate: true`) and never better than the restated
        entry. Grade A comes only from the invoice route, never from this
        hand-typed route. Assumption values change only through the
        assumptions register route (L0.6), `PUT /v1/developer/initiatives/{id}/assumptions/{key}/value`: 409 `assumption_register_only`.

        One restatement per entry: the same request again returns it with 200
        and `isNew: false`; a different amount is 409 `already_restated` —
        restate the restatement once its period locks. An entry of an open
        period is 409 `period_open` — use supersede.

        Owner/admin role.
      operationId: devRestateLedgerEntry
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/LedgerEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newAmount, reason]
              properties:
                newAmount:
                  type: string
                  pattern: '^(0|-?[1-9][0-9]{0,29})$'
                  description: The corrected value of the locked entry, integer text in its unit
                  example: "130000"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Why the locked figure changed. Required; blank is 400.
                estimate:
                  type: boolean
                  default: false
                  description: The person marks the figure an estimate — grade D (and `isEstimate` true)
      responses:
        "201":
          description: Restatement written in the next open period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCorrectionResponse"
        "200":
          description: Replay — the restatement already recorded for this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCorrectionResponse"
        "400":
          description: "`invalid_request` — `field` names the missing or bad body field (e.g. `reason`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerInvalidRequest"
        "403":
          description: Not owner/admin
        "404":
          description: "`entry_not_found`"
        "409":
          description: "`period_open` (use supersede), `no_change`, `already_restated`, `entry_superseded`, `assumption_register_only`"

  /v1/developer/vendor-terms:
    get:
      tags: [Developer]
      summary: Current vendor agreements
      description: |
        Agreements with vendors (L0.7), optionally for one vendor. Negotiated
        rates are vendor-rates rows with basis = negotiated that name one of
        these; the non-rate terms are its lines. Pro (`vendor_rates`).
      operationId: devListVendorTerms
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: vendor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Agreements
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms:
                    type: array
                    items: { $ref: "#/components/schemas/VendorTerms" }
        "403":
          description: "`plan_required` — needs the Pro feature `vendor_rates`."
    post:
      tags: [Developer]
      summary: Record a vendor agreement
      description: |
        Append-only: a renewal is a new agreement. Needs a sourceRef or the
        documentId of the agreement itself. Grade: B with the document on
        file, C from a named source; the caller may lower it to D. Owner/admin, Pro.
      operationId: devCreateVendorTerms
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, termStart]
              properties:
                vendor:
                  type: string
                  description: Lowercase slug — the vendor_legs vocabulary (openai, anthropic) or any vendor (connectrate).
                termStart: { type: string, description: "YYYY-MM-DD or a timestamp with an offset" }
                termEnd: { type: string, description: "After termStart; omit for open-ended" }
                documentId: { type: integer, description: One of your vendor documents — the agreement itself }
                sourceRef: { type: string, description: Where the terms come from, when no document is on file }
                confidenceGrade: { type: string, enum: [D], description: Only lowering is allowed }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms: { $ref: "#/components/schemas/VendorTerms" }
        "400":
          description: invalid_vendor, invalid_term_start, invalid_term_end, invalid_document, or missing_source
        "403":
          description: "`plan_required` (Pro `vendor_rates`) or not owner/admin"

  /v1/developer/vendor-terms/{id}:
    get:
      tags: [Developer]
      summary: One vendor agreement and its lines
      description: Every line, history included; `current` marks the ones not superseded.
      operationId: devGetVendorTerms
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The agreement and its lines
          content:
            application/json:
              schema:
                type: object
                required: [terms, lines]
                properties:
                  terms: { $ref: "#/components/schemas/VendorTerms" }
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/VendorTermLine" }
        "404":
          description: "`terms_not_found`"

  /v1/developer/vendor-terms/{id}/lines:
    post:
      tags: [Developer]
      summary: Declare or change one line of a vendor agreement
      description: |
        A change seals the current line with the same (kind, costComponent,
        unit) and inserts the new one; re-declaring it unchanged is a no-op
        (200). value is integer text: bps for a markup (0–100000),
        micro-USDC per one unit for seat_fee / credit_price, otherwise an
        amount in unit (usdc_micro or a count noun). Owner/admin, Pro.
      operationId: devDeclareVendorTermLine
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorTermLineInput" }
      responses:
        "201":
          description: Declared
          content:
            application/json:
              schema:
                type: object
                required: [line, isNew]
                properties:
                  line: { $ref: "#/components/schemas/VendorTermLine" }
                  isNew: { type: boolean }
        "200":
          description: Already the current line — nothing written
        "400":
          description: "`invalid_line` with `errors`"
        "404":
          description: "`terms_not_found`"
        "409":
          description: "`line_order` — a changed line must start after the current line's effective_from"

  /v1/developer/vendor-terms/{id}/lines/import:
    post:
      tags: [Developer]
      summary: Import vendor agreement lines from a CSV
      description: |
        All-or-nothing. Columns by header name (case and punctuation ignored):
        kind, cost_component, unit, value, period_basis, optional
        effective_from. An unrecognised header halts the import and is listed;
        a line listed twice is refused. Owner/admin, Pro.
      operationId: devImportVendorTermLines
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: effective_from
          in: query
          required: false
          description: Default effective_from for rows without their own
          schema: { type: string }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                required: [rows, inserted, unchanged]
                properties:
                  rows: { type: integer }
                  inserted: { type: integer }
                  unchanged: { type: integer }
        "400":
          description: "unmapped_header / ambiguous_header / missing_header (with `headers`), empty, or invalid_rows (with numbered `rows`)"
        "404":
          description: "`terms_not_found`"
        "409":
          description: "`line_order` — a changed line must start after the current line's effective_from; nothing is written"
        "413":
          description: CSV larger than 1 MiB

  /v1/developer/vendor-rates:
    get:
      tags: [Developer]
      summary: Vendor rates in force — what YOU pay a vendor
      description: |
        The mirror image of `/rate-cards`, which is what you CHARGE a client.
        One is COGS, the other revenue.

        AN ESTIMATE LANE, NOT THE COST BASIS. The authoritative vendor cost is
        `ledger_reconciliations` (`cost_owner='developer'`). These rows are
        never written there, never summed into a total, and never enter a
        `cost_plus` basis; a reconciled actual always supersedes an estimate,
        and the gap between them is the variance signal.

        Returns the version in force per vendor+model+leg (latest
        `effectiveFrom` at or before now) — never the highest id, which would
        surface a future-dated row as current. `rate` is a decimal string for
        display and `ratePico` the exact stored value (USD x 1e12, integer
        text): a JSON number at this scale is an IEEE double, which is what the
        storage format exists to avoid.
      operationId: devListVendorRates
      security:
        - developerSession: []
      responses:
        "200":
          description: Rates in force, plus the review queue count
          content:
            application/json:
              schema:
                type: object
                properties:
                  rates:
                    type: array
                    items: { $ref: "#/components/schemas/VendorRate" }
                  unconfirmedCount:
                    type: integer
                    description: >-
                      Rates nobody has accepted yet — list prices, not costs.
                  unitForLegKind:
                    type: object
                    additionalProperties: { type: string }
                    description: The canonical billing unit per leg kind.
        "403":
          description: '`plan_required` — needs the Pro feature `vendor_rates`.'
    post:
      tags: [Developer]
      summary: Append a vendor-rate version (admin)
      description: |
        APPEND-ONLY. A change is a new row with a later `effectiveFrom`;
        pricing a leg selects the version in force at that leg's occurred_at.
        `effectiveFrom` is MONOTONIC per vendor+model+leg — a back-dated row
        would retroactively re-price usage already costed, including a closed
        period, so it answers 409 `effective_from_regression`.

        `rate` is a DECIMAL STRING, never a number, and carries at most 12
        decimal places. A rate with more is refused rather than rounded:
        silently dropping a digit is how a bill ends up wrong by a factor
        nobody can find later.
      operationId: devCreateVendorRate
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, model, legKind, rate]
              properties:
                vendor: { type: string, maxLength: 64 }
                model: { type: string, maxLength: 128 }
                legKind:
                  type: string
                  enum: [stt, tts, telephony, avatar, sms, ocr, gpu, llm]
                  description: >-
                    `tool` and `realtime` are absent: a tool is an opaque
                    per-call price. `llm` (L0.7) names a token `unit`.
                rate:
                  type: string
                  description: Decimal USD per unit, e.g. "0.0000416667".
                effectiveFrom: { type: string, format: date-time }
                sourceUrl: { type: string, format: uri }
                retrievedAt: { type: string, format: date-time }
                confirmed:
                  type: boolean
                  default: true
                  description: >-
                    A rate you typed is confirmed; one seeded from a published
                    list price is not, and lands in the review queue.
                note: { type: string, maxLength: 200 }
                unit:
                  type: string
                  description: >-
                    Required for llm — input_token_1m, output_token_1m or
                    cached_input_token_1m (USD per 1M tokens). Otherwise fixed by
                    legKind and may be omitted.
                basis:
                  type: string
                  enum: [list, negotiated]
                  default: list
                  description: >-
                    list: a published price (grade B with a sourceUrl, D
                    without). negotiated: from an agreement — requires
                    vendorTermsId (grade C). The ledger true-up reads negotiated
                    rates from here and nowhere else.
                vendorTermsId:
                  type: integer
                  description: The agreement (POST /v1/developer/vendor-terms) a negotiated rate comes from.
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate: { $ref: "#/components/schemas/VendorRate" }
        "400":
          description: Invalid body, rate, or leg kind
        "403":
          description: '`plan_required` (Pro `vendor_rates`) or insufficient role'
        "409":
          description: '`effective_from_regression` or `version_exists`'

  /v1/developer/vendor-rates/history:
    get:
      tags: [Developer]
      summary: Every version for one vendor+model+leg
      description: >-
        The append-only timeline, newest first. What a closed period was priced
        under is the version in force at the time, so history is how a past
        figure is explained.
      operationId: devGetVendorRateHistory
      security:
        - developerSession: []
      parameters:
        - { name: vendor, in: query, required: true, schema: { type: string } }
        - { name: model, in: query, required: true, schema: { type: string } }
        - name: legKind
          in: query
          required: true
          schema:
            type: string
            enum: [stt, tts, telephony, avatar, sms, ocr, gpu]
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendor: { type: string }
                  model: { type: string }
                  legKind: { type: string }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/VendorRate" }
        "400":
          description: '`missing_key` or `unknown_leg_kind`'
        "403":
          description: '`plan_required` — needs the Pro feature `vendor_rates`.'

  /v1/developer/vendor-rates/{id}/confirm:
    post:
      tags: [Developer]
      summary: Accept a vendor rate as yours (admin)
      description: >-
        The ONE mutation an append-only row accepts, and it is one-way: it
        stamps who accepted and when. Re-confirming is a no-op that returns
        `alreadyConfirmed: true`, so the audit trail keeps the FIRST
        acceptance. Only confirmed rates are served to floe-guard.
      operationId: devConfirmVendorRate
      security:
        - developerSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The confirmed rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate: { $ref: "#/components/schemas/VendorRate" }
                  alreadyConfirmed: { type: boolean }
        "403":
          description: '`plan_required` (Pro `vendor_rates`) or insufficient role'
        "404":
          description: '`rate_not_found` — unknown id, or another account''s'

  /v1/developer/agents/{agentId}/coverage:
    get:
      tags: [Developer]
      summary: Governance coverage score (pre-call enforceable vs reconciled)
      description: |
        What share of the agent's KNOWN spend was pre-call enforceable
        (Floe was in the path) vs post-call reconciled (ingested from an
        orchestrator webhook). Spend on platforms never wired to Floe is
        definitionally invisible — framed as `dark: "unknown"`, never faked
        with a number. Out-of-range `days` values are clamped to 1–90, not
        rejected.
      operationId: devGetAgentCoverage
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Coverage totals + per-source split + daily series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageResponse"
        "404":
          description: Agent not found or not owned by caller

  /v1/developer/coverage:
    get:
      tags: [Developer]
      summary: Fleet coverage score across every agent the account owns
      description: |
        The per-agent coverage split, summed across every agent the developer
        owns. Same shape as /agents/{agentId}/coverage plus `agentCount`.
        Out-of-range `days` values are clamped to 1–90, not rejected.
      operationId: devGetFleetCoverage
      security:
        - developerSession: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Fleet coverage totals + per-source split + daily series
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CoverageResponse"
                  - type: object
                    properties:
                      agentCount:
                        type: integer
              example:
                days: 30
                agentCount: 3
                totals:
                  knownRaw: "2160"
                  knownGrade: D
                  knownGradeMix: { A: "900", B: "1210", C: "0", D: "50" }
                  knownHeldRaw: "7000000"
                  enforceableRaw: "1910"
                  enforceableGrade: B
                  enforceableGradeMix: { A: "900", B: "1010", C: "0", D: "0" }
                  enforceableHeldRaw: "7000000"
                  reconciledRaw: "250"
                  reconciledGrade: D
                  reconciledGradeMix: { A: "0", B: "200", C: "0", D: "50" }
                  reconciledHeldRaw: "0"
                  coverageBps: 8842
                bySource:
                  - { source: floe-gateway, class: enforceable, calls: 1, costRaw: "1000", grade: B, gradeMix: { A: "0", B: "1000", C: "0", D: "0" }, heldRaw: "0" }
                attribution:
                  attributedRaw: "1110"
                  attributedGrade: B
                  attributedGradeMix: { A: "900", B: "210", C: "0", D: "0" }
                  attributedHeldRaw: "2000000"
                  attributedCalls: 2
                  attributionBps: 5138
                dark: unknown

  /v1/developer/agents/{agentId}/spend-limit:
    get:
      tags: [Developer]
      summary: Read an agent's session spend limit (dashboard mirror)
      description: |
        Developer-session mirror of GET /v1/agents/spend-limit — same
        response shape, agent addressed by path instead of key.
      operationId: devGetAgentSpendLimit
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Spend limit state (active=false → limitRaw/sessionStartedAt null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendLimit"
        "404":
          description: Agent not found or not owned by caller
    put:
      tags: [Developer]
      summary: Set an agent's session spend limit (resets window)
      description: |
        Dual-write: the canonical store is the kind='session' policy row,
        mirrored into the legacy agents column. RESTARTS the session window
        (anything spent before the PUT no longer counts). Unlike the
        agent-key surface, this developer route is NOT subject to the
        tighten-only self-service lock.
      operationId: devSetAgentSpendLimit
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limitRaw]
              properties:
                limitRaw:
                  type: string
                  pattern: "^\\d+$"
                  description: Session cap, raw USDC (6 decimals). Must be > 0.
      responses:
        "200":
          description: Updated (active, limitRaw, sessionStartedAt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendLimit"
        "400":
          description: Invalid body or non-positive limitRaw
        "404":
          description: Agent not found or not owned by caller
    delete:
      tags: [Developer]
      summary: Remove an agent's session spend limit
      description: Clears both the policy row and the legacy column; enforcement stops at the next paid call.
      operationId: devDeleteAgentSpendLimit
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    enum: [false]
        "404":
          description: Agent not found or not owned by caller

  /v1/developer/agents/{agentId}/keys/{keyId}/budget:
    put:
      tags: [Developer]
      summary: Set or replace a per-API-key spend budget
      description: |
        A per-key budget is enforced on the same pay path as session/task/
        vendor caps — tightest applicable cap wins. The keyId must name an
        ACTIVE agent key of THIS agent (revoked or cross-tenant keys 404).
        A 0 budget is invalid — DELETE the budget to remove the cap instead.
      operationId: devPutKeyBudget
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budgetRaw]
              properties:
                budgetRaw:
                  type: string
                  pattern: "^[1-9]\\d*$"
                  description: Per-key spend budget, raw USDC (6 decimals).
                windowSeconds:
                  type: integer
                  minimum: 60
                  maximum: 31536000
                  description: Rolling-budget period. Omitted → service default.
      responses:
        "200":
          description: The stored budget + derived spend
          content:
            application/json:
              schema:
                type: object
                properties:
                  budget:
                    $ref: "#/components/schemas/KeyBudget"
        "400":
          description: Invalid body or invalid_budget
        "404":
          description: Agent/key not found, not owned, or key revoked
    delete:
      tags: [Developer]
      summary: Clear a per-API-key spend budget
      operationId: devDeleteKeyBudget
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [cleared]
        "404":
          description: Agent/key/budget not found or not owned

  /v1/developer/agents/{agentId}/limit-chain:
    get:
      tags: [Developer]
      summary: Every live cap constraining an agent, with derived spend
      description: |
        One row per live policy across both scopes (agent + developer/team),
        each with the same derived spend the enforcement path uses, PLUS a
        final scope='balance' row (spendable balance, netting in-flight
        reservations + task holds). Read-only; powers the dashboard's
        Limits panel.
      operationId: devGetAgentLimitChain
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The chain, balance row last
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentId:
                    type: integer
                  asOf:
                    type: string
                    format: date-time
                  chain:
                    type: array
                    items:
                      $ref: "#/components/schemas/LimitChainRow"
        "404":
          description: Agent not found or not owned by caller

  /v1/developer/agents/{agentId}/resolve:
    post:
      tags: [Developer]
      summary: Dry-run a call against the live decision gates ("Test a call")
      description: |
        Replicates the proxy's decision gates in their live order (allowlist
        → balance → policy evaluate) WITHOUT reserving, inserting, or paying
        anything — evaluate() is side-effect-free, so the verdict is the
        real enforcement decision. Decline payloads mirror the real proxy
        error bodies. `amountRaw` is the TOTAL charge (vendor amount + Floe
        platform fee) — the number every gate checks. Omitting `recipient`
        makes vendor-dimension policies fail closed, exactly like the live
        path. Omitting `customerId` is NOT the same: an untagged call simply
        matches no customer cap, mirroring enforcement, where a missing client
        id is refused upstream on strict accounts rather than failed closed
        here.
      operationId: devResolveAgentCall
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, amountRaw]
              properties:
                host:
                  type: string
                  minLength: 1
                  maxLength: 255
                recipient:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{40}$"
                  description: The 402's payee wallet, when known.
                amountRaw:
                  type: string
                  pattern: "^\\d+$"
                  description: Total charge to test, raw USDC (6 decimals).
                taskId:
                  type: string
                  minLength: 1
                  maxLength: 128
                keyId:
                  type: integer
                  minimum: 1
                  description: Simulate the call arriving on this key (404 unless an active key of this agent).
                customerId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: >
                    P2.4 — the end-client to attribute the simulated call to. On the live
                    path this comes from X-Floe-Customer-Id or the agent/project default.
                    Omitting it simulates an UNTAGGED call, which matches no customer cap —
                    the same rule enforcement applies, not a fail-closed refusal.
      responses:
        "200":
          description: >
            Verdict. approve → { decision, effectiveRemainingRaw, binding }
            where binding is the applicable cap (or balance row) with the
            least headroom. decline → { decision, decline } where decline
            mirrors the live proxy error body (host_not_allowlisted,
            vendor_not_allowlisted, insufficient_balance,
            spend_limit_exceeded, policy_exceeded, unresolvable_host,
            unresolvable_recipient).
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: string
                    enum: [approve, decline]
                  effectiveRemainingRaw:
                    type: string
                    description: Present on approve — headroom on the binding cap, raw USDC (6 decimals).
                  binding:
                    $ref: "#/components/schemas/LimitChainRow"
                  decline:
                    type: object
                    description: Present on decline — the live-path error body.
        "400":
          description: Invalid body
        "404":
          description: Agent (or keyId) not found or not owned by caller

  /v1/developer/phone/numbers:
    get:
      tags: [Developer]
      summary: Fleet phone numbers with 7d calls + MTD spend
      description: |
        Live (non-released) numbers across every agent the developer owns,
        each with a 7-day distinct-call count and month-to-date spend
        (rental + calls).
      operationId: devListFleetPhoneNumbers
      security:
        - developerSession: []
      responses:
        "200":
          description: Fleet numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  numbers:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: string
                          description: E.164.
                        agentId:
                          type: integer
                        agentName:
                          type: string
                        status:
                          type: string
                        calls7d:
                          type: integer
                        spendMtdRaw:
                          type: string
                          description: Month-to-date spend, raw USDC (6 decimals).

  /v1/developer/agents/rollup:
    get:
      tags: [Developer]
      summary: Per-agent console rollup (balance, 30d spend, phone, key count)
      description: Live fleet only — closed agents are excluded.
      operationId: devGetAgentsRollup
      security:
        - developerSession: []
      responses:
        "200":
          description: Rollup rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        status:
                          type: string
                        balanceRaw:
                          type: string
                          description: Raw USDC (6 decimals).
                        spend30dRaw:
                          type: string
                          description: 30-day billable spend, raw USDC (6 decimals).
                        phone:
                          type: string
                          nullable: true
                          description: Live E.164, if any.
                        keysCount:
                          type: integer

  /v1/developer/billing/mtd:
    get:
      tags: [Developer]
      summary: Month-to-date bill by vendor and by agent
      operationId: devGetBillingMtd
      security:
        - developerSession: []
      responses:
        "200":
          description: MTD rollup over the window [since, asOf]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MtdRollup"
                  - type: object
                    required: [since, asOf]
                    properties:
                      since:
                        type: string
                        format: date-time
                        description: Window start — 00:00 UTC on the first day of asOf's calendar month (ISO 8601, UTC).
                      asOf:
                        type: string
                        format: date-time
                        description: Window end (inclusive) — the server clock when the figure was read (ISO 8601, UTC).
              example:
                since: "2026-09-01T00:00:00.000Z"
                asOf: "2026-09-29T16:04:11.201Z"
                totalRaw: "5059000000"
                grade: D
                gradeMix: { A: "4210000000", B: "812000000", C: "0", D: "37000000" }
                heldRaw: "7000000"
                byVendor:
                  - vendor: api.exa.ai
                    costRaw: "4300000000"
                    grade: B
                    gradeMix: { A: "4210000000", B: "90000000", C: "0", D: "0" }
                    heldRaw: "0"
                  - vendor: marketplace.floelabs.xyz
                    costRaw: "0"
                    grade: null
                    gradeMix: { A: "0", B: "0", C: "0", D: "0" }
                    heldRaw: "5000000"
                byAgent:
                  - agentId: 12
                    agentName: support-bot
                    costRaw: "5059000000"
                    grade: D
                    gradeMix: { A: "4210000000", B: "812000000", C: "0", D: "37000000" }
                    heldRaw: "7000000"
                    calls: 4120

  /v1/developer/billing/invoice:
    get:
      tags: [Developer]
      summary: Current-period line-itemized invoice (JSON)
      description: Same rollup as /billing/mtd wrapped in a period envelope.
      operationId: devGetBillingInvoice
      security:
        - developerSession: []
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      period:
                        type: object
                        properties:
                          start:
                            type: string
                            format: date-time
                          end:
                            type: string
                            format: date-time
                      currency:
                        type: string
                        enum: [USDC]
                      decimals:
                        type: integer
                        enum: [6]
                  - $ref: "#/components/schemas/MtdRollup"

  /v1/developer/billing/export.csv:
    get:
      tags: [Developer]
      summary: Per-charge CSV export for the current month
      description: |
        Columns: time, agent, vendor_endpoint, amount_raw. Fields are
        RFC-4180 quoted with spreadsheet-formula-injection defense. Refused
        (413) rather than silently truncated when the month exceeds the
        10,000-row cap.

        Charges only: holds (a marketplace or Floe Phone reservation with no
        x402 authorization behind it — a ceiling reserved before the real
        cost is known) are NOT rows, so the amounts sum to
        `/billing/invoice` `totalRaw` for the same window; holds are reported
        there as `heldRaw`. A reservation-backed x402 payment still pending
        settlement IS a charge and is listed. A settled hold appears at its
        real charge.
      operationId: devExportBillingCsv
      security:
        - developerSession: []
      responses:
        "200":
          description: CSV attachment (Content-Disposition set)
          content:
            text/csv:
              schema:
                type: string
        "413":
          description: export_too_large — month exceeds the 10,000-row CSV limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [export_too_large]
                  message:
                    type: string
                  limit:
                    type: integer

  /v1/developer/billing/plan:
    get:
      tags: [Developer]
      summary: Effective SaaS plan, limits, usage, and subscription
      description: |
        The account's effective plan (FLO-701) — Free / Pro / Agency /
        Enterprise — with its limits, gated features, month-to-date tracked
        spend vs the soft cap, billed-client count, the synced Stripe
        subscription (or null), and the pricing table. Any role. Served with
        `Cache-Control: no-store`; the dashboard polls it after a Checkout
        return until the plan flips. `stripeConfigured=false` means checkout
        and portal will 503 on this deployment (plan gates still honor admin
        grants). The same summary is embedded as `plan` on GET /v1/developer/profile.
      operationId: devGetBillingPlan
      security:
        - developerSession: []
      responses:
        "200":
          description: Plan status
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanStatus"

  /v1/developer/billing/plan/usage-history:
    get:
      tags: [Developer]
      summary: Tracked spend per month for the last 12 UTC calendar months
      description: |
        Month buckets (oldest first, current month last) of tracked spend
        (success rows, raw 6-dp USDC) for the Plan card sparkline. `capRaw` is
        the CURRENT plan's soft cap repeated per month (null = uncapped). Any role.
      operationId: devGetBillingPlanUsageHistory
      security:
        - developerSession: []
      responses:
        "200":
          description: 12 monthly buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  months:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                          description: YYYY-MM (UTC)
                          example: "2026-08"
                        trackedSpendRaw:
                          type: string
                          description: Raw 6-dp USDC string.
                        capRaw:
                          type: string
                          nullable: true

  /v1/developer/billing/checkout:
    post:
      tags: [Developer]
      summary: Start a Stripe Checkout session for Pro or Agency
      description: |
        Creates (or reuses) the account's Stripe Customer and opens a hosted
        Checkout session (`mode: subscription`) for the chosen plan and
        interval. Redirect the browser to `url`; Stripe returns to
        `{DASHBOARD_URL}/billing?checkout=success&session_id=…` (then call
        GET /v1/developer/billing/checkout/{sessionId}) or `?checkout=cancel`.
        Entitlement is granted from the subscription status (webhook /
        confirm / reconcile) — never from the redirect alone.

        Owner/admin role AND a human session (cookie / JWT): developer API keys
        get 403 `session_required` (D21 — a leaked key must not be able to
        open billing). One session per account/plan/hour is minted
        (idempotency key `checkout:{accountId}:{plan}:{yyyymmddhh}`).
        Enterprise is sales-led and cannot be bought here.
      operationId: devCreateBillingCheckout
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan, interval]
              properties:
                plan:
                  type: string
                  enum: [pro, agency]
                interval:
                  type: string
                  enum: [month, year]
                  description: Annual is two months free ($950 / $4,790 vs 12 × monthly).
      responses:
        "200":
          description: Hosted Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  sessionId:
                    type: string
                    example: cs_test_a1B2c3
        "400":
          description: invalid_request — body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "403":
          description: >
            forbidden (role below admin) or session_required (developer API
            key on a money-adjacent route)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "409":
          description: subscription_exists — the account already has a live (active / trialing / past_due) subscription; change plans through POST /v1/developer/billing/portal instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "503":
          description: stripe_not_configured — Stripe is off on this deployment (GET /v1/capabilities.stripeBilling=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"

  /v1/developer/billing/checkout/{sessionId}:
    get:
      tags: [Developer]
      summary: Confirm a Checkout return and sync the plan
      description: |
        Idempotent. Retrieves the Checkout session, verifies it belongs to
        this account (`client_reference_id` = the account's public id) and,
        when `status=complete`, syncs the resulting subscription into the
        account's plan without waiting for the webhook. Returns the same
        shape as GET /v1/developer/billing/plan. Owner/admin role. A session
        minted by another account is 404 `not_found` (never disclosed).
      operationId: devConfirmBillingCheckout
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Checkout session id from the return URL (`cs_…`).
          schema:
            type: string
            pattern: "^cs_[A-Za-z0-9_]+$"
      responses:
        "200":
          description: Plan status after sync
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanStatus"
        "400":
          description: invalid_request — sessionId is not a `cs_…` id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "404":
          description: not_found — session unknown or not minted for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "503":
          description: stripe_not_configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"

  /v1/developer/billing/portal:
    post:
      tags: [Developer]
      summary: Open the Stripe Customer Portal
      description: |
        Mints a Customer Portal session for the account's Stripe Customer.
        Plan changes (Pro ↔ Agency, monthly ↔ annual, with proration),
        cancellation (at period end), payment-method updates, and plan
        invoice history all happen in the Portal — there is no Floe write
        path for them. `flow` deep-links straight into one action. Returns
        to `{DASHBOARD_URL}/billing`. Owner/admin role AND a human session
        (developer API keys get 403 `session_required`).
      operationId: devCreateBillingPortal
      security:
        - developerSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flow:
                  type: string
                  enum: [update_plan, cancel, payment_method]
                  description: Optional Portal deep link. Omit for the Portal home.
      responses:
        "200":
          description: Portal URL — redirect the browser to it
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        "403":
          description: forbidden (role below admin) or session_required (developer API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "409":
          description: no_subscription — the account has no Stripe subscription to manage; start one with POST /v1/developer/billing/checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "503":
          description: stripe_not_configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"

  # ── Rebilling: customers, rate cards, projects, billing periods (FLO-733) ──
  # Every route below inherits requireDeveloperCredential → accountContext →
  # blockViewerWrites → planContext. Writes are admin-only and plan-gated
  # (rate_cards / client_invoicing / stripe_connect → Agency); reads of
  # existing cards, periods and statements stay open so a downgraded account
  # keeps what it already priced or issued. Money is raw 6-dp USDC strings
  # (`…Raw`) or integer cents (`totalCents`, `amountCents`) — never floats.
  # The OAuth callback (GET /v1/developer/stripe/connect/callback) and the
  # Stripe webhook endpoints are deliberately undocumented (browser / Stripe
  # only, never called by an API client).

  /v1/developer/contracts:
    get:
      tags: [Developer]
      summary: The contract book — what you signed, per client
      description: |
        Newest term first. The mirror of a rate card: a rate card is what is
        CURRENTLY RATING, a contract is what was SIGNED, and the drift between
        them is the literal meaning of "signed vs deployed".

        `status` is the stored human act (`active` / `cancelled`) and never
        says `expired`; `state` is what the contract IS right now, status
        combined with the clock (`scheduled` / `active` / `expired` /
        `cancelled`). Expiry is derived on read rather than stored, so no
        background job can stop running and leave a finished term looking
        live. `needsRenewalCount` counts terms that have run out with nothing
        signed to succeed them — the point of lapsing rather than auto-renewing
        is that this number is visible.

        Reads require `attribution_reports` (Pro+); any role. Reads stay open
        after a downgrade so an account keeps sight of what it already signed.
      operationId: devListContracts
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: customerId
          in: query
          required: false
          description: Narrow to one client. Lowercased; omit for the whole book.
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          required: false
          description: |
            Contracts per page. An agency at the Agency cap holds 150 clients
            and renewals append forever, so this read pages rather than
            returning the whole history of the book in one body.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: |
            Opaque `nextCursor` from the previous page. Keyset on
            `(term_start, id)` in the order the page is served, so a contract
            signed mid-page cannot shift rows across page boundaries the way
            OFFSET would. A cursor this endpoint did not issue answers 400.
          schema:
            type: string
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contract"
                  needsRenewalCount:
                    type: integer
                    description: |
                      Terms whose end date has passed with no successor signed.
                      ACCOUNT-WIDE, not page-wide — a per-page count would
                      report a different number per page for one book.
                  nextCursor:
                    type: string
                    nullable: true
                    description: Pass as `cursor` for the next page; null on the last one.
                  commitmentUnits:
                    type: array
                    description: The unit catalog, so a client never hard-codes a second copy.
                    items:
                      type: string
                    example: [audio_minute, request, task, voice_call, usd]
        "400":
          description: |
            `invalid_limit` (outside 1-200, refused rather than clamped) or
            `invalid_cursor` (not a cursor this endpoint issued — refused
            rather than fed into the keyset predicate).
        "403":
          description: Plan lacks `attribution_reports`
    post:
      tags: [Developer]
      summary: Sign a contract term for a client
      description: |
        ONE CONTRACT IS IN FORCE AT A TIME, and a client keeps the full history
        of the ones before it. A renewal is a NEW term, never an edit —
        rewriting terms in place would silently move every margin figure ever
        computed under the old ones, including closed billing periods and
        invoices already issued.

        Enforced as NON-OVERLAPPING TERMS (409 `overlapping_term`), not as a
        uniqueness rule on status: expiry is derived, so a lapsed contract
        still reads `status=active` and a status-based constraint would reject
        the very renewal meant to succeed it. Terms are half-open — a renewal
        starting at the exact instant the previous term ends does NOT overlap
        it. A cancelled term occupies nothing and frees its whole period.

        `committedVolume` and `committedUnit` are given together or not at all
        (a volume without a unit has no meaning; a unit without a volume
        commits to nothing). The commitment is counted INDEPENDENTLY of what
        the rate card meters — a client may commit to 10,000 `task` while the
        card bills per `audio_minute`, and that is still measurable because the
        ledger carries every one of these quantities regardless of which the
        card charges for.

        `signedRateCardVersion` pins the as-signed rate card by VERSION, not as
        a scalar rate: `rate_cards` is append-only, so the reference reproduces
        the signed pricing exactly and forever, while a scalar would need
        recomputing to stay meaningful and would lose the rule structure that
        produced it.

        Owner/admin role; `rate_cards` feature (Agency+).
      operationId: devCreateContract
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, termStart, termEnd]
              properties:
                customerId:
                  type: string
                  maxLength: 128
                  description: Lowercased server-side, like every ledger surface.
                termStart:
                  type: string
                  format: date-time
                termEnd:
                  type: string
                  format: date-time
                  description: Must be strictly after `termStart`.
                committedVolume:
                  type: string
                  description: |
                    Integer text in `committedUnit`. A string, not a number: a
                    JS number cannot carry a 6-dp raw USD commitment without
                    rounding. For `usd` this is raw 6-dp USDC.
                  example: "10000"
                committedUnit:
                  type: string
                  enum: [audio_minute, request, task, voice_call, usd]
                signedRateCardVersion:
                  type: integer
                  description: The rate-card version pinned as signed.
                renewalDate:
                  type: string
                  format: date-time
                  description: Advisory only — nothing lapses off this date; `termEnd` governs.
                note:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: Signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: |
            `invalid_term` (termEnd not after termStart), or a commitment given
            with only one of volume/unit.
        "403":
          description: Not admin, or plan lacks `rate_cards`
        "409":
          description: |
            `overlapping_term` — this client already has a term covering part
            of that period. `billed_clients_cap` — the plan's billed-client
            limit is already reached.
  /v1/developer/contracts/{id}:
    get:
      tags: [Developer]
      summary: One contract
      description: |
        Scoped to the calling account — a contract belonging to another
        developer answers 404, never 403, so the endpoint does not confirm that
        an id exists elsewhere. Reads require `attribution_reports` (Pro+).
      operationId: devGetContract
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: id is not a positive integer
        "403":
          description: Plan lacks `attribution_reports`
        "404":
          description: No such contract on this account
  /v1/developer/contracts/{id}/cancel:
    post:
      tags: [Developer]
      summary: End a contract early
      description: |
        The ONE mutation a contract accepts. Terms themselves are never edited —
        that is what signing the next one is for.

        Cancelling frees the whole period: a cancelled term occupies nothing, so
        the client can be re-signed across it (otherwise a mis-typed term would
        poison that window permanently). A second cancel answers 404 rather than
        restamping a decision already made.

        Owner/admin role; `rate_cards` feature (Agency+).
      operationId: devCancelContract
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: id is not a positive integer
        "403":
          description: Not admin, or plan lacks `rate_cards`
        "404":
          description: No ACTIVE contract with that id — it may already be cancelled

  /v1/developer/customers:
    get:
      tags: [Developer]
      summary: End-customers seen in the ledger, with contact + pricing + billing status
      description: |
        Every `customer_id` that metered spend attributed to over the window
        (proxy_requests only — the authoritative money ledger; ordered by
        spend, capped at `rowCap` = 1000 rows and flagged with `truncated`
        when the cap bit — it was previously capped at 200 with no signal, so
        a large book lost rows silently), plus carded customers with no window
        usage (an idle client still needs its pricing visible). `truncated`
        describes the LEDGER SCAN only: those appended clients can push
        `customers.length` past `rowCap` without anything being dropped. Each row
        carries the current / draft rate-card version, the contact stored via
        PATCH /v1/developer/customers/{customerId} (`name`, `email`,
        `stripeCustomerId` — null until set / pushed) and per-status
        billing-period counts. Any role; needs the `attribution_reports`
        feature (Pro+). The window is clamped to the plan's history floor
        (`historyClamped`), never refused.
      operationId: devListCustomers
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Customers ordered by window spend
          content:
            application/json:
              schema:
                type: object
                properties:
                  windowDays:
                    type: integer
                  historyFloor:
                    type: string
                    format: date-time
                    nullable: true
                  historyClamped:
                    type: boolean
                  truncated:
                    type: boolean
                    description: True when the ledger scan hit `rowCap`. The rows returned are the highest-spending ones; a caller totalling them is not looking at the whole book.
                  rowCap:
                    type: integer
                    description: The row cap that applied to the ledger scan (1000). Carded/invoiced clients with no window usage are appended after it, so `customers.length` may exceed this without truncation.
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerCustomer"
        "400":
          description: days must be 1-90
        "403":
          description: plan_required — attribution_reports needs Pro or above
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"

  /v1/developer/customers/{customerId}:
    patch:
      tags: [Developer]
      summary: Set an end-customer's contact (name, email)
      description: |
        Lazy upsert — the customer entity exists from the first time anyone
        names it. `email` is REQUIRED before an invoice can be pushed
        (POST /v1/developer/billing-periods/{id}/invoice refuses with 409
        `customer_email_required`): Stripe delivers the hosted invoice by
        email. Send `null` to clear a field; omitted fields are untouched.
        Owner/admin role; `client_invoicing` feature (Agency+).
      operationId: devUpdateCustomerContact
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 200
                  nullable: true
                email:
                  type: string
                  format: email
                  maxLength: 320
                  nullable: true
      responses:
        "200":
          description: The customer entity (never exposes the owning wallet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid customerId or body
        "403":
          description: forbidden (role below admin) or plan_required (client_invoicing needs Agency)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"

  /v1/developer/customers/{customerId}/transactions:
    get:
      tags: [Developer]
      summary: Per-transaction cost / revenue / margin report for one end-customer
      description: |
        Every canonical metered row (leg) for the customer in `[from, to)`
        with its cost and — where the rate-card model defines one — a
        per-row VARIABLE revenue/margin: `cost_plus` is exact per leg,
        `per_unit request` allocates the included allotment chronologically
        per card version, `fixed` and `per_unit audio_minute` are
        aggregate-only (`perRowComplete=false`, `revenueRaw` understates).
        Each row rates under the version effective AT ITS TIMESTAMP. The
        `summary` block rates the whole range under ALL rules of the current
        version, so totals are complete even where rows show "—". Rows share
        a `taskId` per phone call (Floe Phone stamps the CallSid) for
        per-call rollups. Hard cap 2000 rows with `truncated` flagged; range
        ≤ 90 days, default the last 30; `from` is raised to the plan's
        history floor (`historyClamped`). Any role; `attribution_reports`
        feature (Pro+).
      operationId: devGetCustomerTransactions
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Margin report
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  historyFloor:
                    type: string
                    format: date-time
                    nullable: true
                  historyClamped:
                    type: boolean
                  truncated:
                    type: boolean
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                        targetHost:
                          type: string
                          nullable: true
                        rail:
                          type: string
                          nullable: true
                        taskId:
                          type: string
                          nullable: true
                          description: Call / task id shared by every leg of one phone call. null = standalone leg.
                        costRaw:
                          type: string
                          description: What Floe charged the account for this leg, raw 6-dp USDC.
                        cardVersion:
                          type: integer
                          nullable: true
                        revenueRaw:
                          type: string
                          nullable: true
                          description: Variable revenue under the effective card version; null when none was effective.
                        marginRaw:
                          type: string
                          nullable: true
                        perRowComplete:
                          type: boolean
                          description: false → the pricing has aggregate-only components (retainer / per-minute), so this row's margin understates.
                  usage:
                    $ref: "#/components/schemas/RatableUsage"
                  summary:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/RatedResult"
                      - type: object
                        properties:
                          cardVersion:
                            type: integer
        "400":
          description: Invalid customerId, from/to not ISO, from ≥ to, or range > 90 days
        "403":
          description: plan_required — attribution_reports needs Pro or above
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"

  /v1/developer/customers/{customerId}/transactions.csv:
    get:
      tags: [Developer]
      summary: Server-rendered CSV of one client's ledger
      description: |
        The same rows and the same range summary as GET
        /customers/{customerId}/transactions, rendered server-side so a large
        export is an `<a href>` rather than a client-side blob. Both routes
        build their rows and their summary through the SAME shared builder, so
        the file and the screen cannot drift.

        WHAT RECONCILES. The trailing `# Range summary` line is the summary the
        screen renders — revenue, cost and margin under ALL of the card's
        rules. It is NOT a sum of the rows above it: `fixed` and `audio_minute`
        components are priced over the whole range and have no per-row
        representation, and a row priced by them reports
        `per_row_complete=false`. Summing the row columns is a LOWER BOUND, and
        the file's preamble says so rather than letting a reader assume
        otherwise.

        Walked past the JSON route's 2,000-row page: over 100,000 charges the
        request is REFUSED with 413 `export_too_large` rather than truncated,
        because a short CSV opened in a spreadsheet is indistinguishable from a
        complete one and this file is evidence for an invoice.

        Money columns are plain decimal USD, matching the client-side export
        this replaces — changing them to raw 6-dp integers under the same
        filename would silently break every spreadsheet already built on it.

        Reading the ledger is `attribution_reports`; exporting it rides
        `exports` (Pro) on top. Any role.
      operationId: devExportCustomerTransactionsCsv
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound; clamped to the plan's history floor. Defaults to 30 days before `to`.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound, defaulting to now. The range may span at most 90 days.
      responses:
        "200":
          description: text/csv
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid customerId, a malformed from/to, from >= to, or a range over 90 days
        "403":
          description: plan_required — the export rides `exports` (Pro)
        "413":
          description: export_too_large — narrow the range

  /v1/developer/customers/margins:
    get:
      tags: [Developer]
      summary: Revenue, cost and margin for the whole client book in one request
      description: |
        The batched form of `GET /customers/{customerId}/transactions`'s
        `summary`. The contracts screen used to fire one per-client request per
        rendered row and cap itself at 25 rows to bound that fan-out; this
        returns the whole book at once.

        Rating is set-based and in-process. A money and an audio `GROUP BY`
        cover every client, and three further inputs each get their own grouped
        query, run only when a card in scope prices them: `task` and
        `voice_call` (those usage fields are optional and NEVER defaulted —
        rating throws rather than bill zero of them), and the reconciled vendor
        cost a `cost_plus` card's `vendorCostBasis` admits. Query count
        therefore scales with how many DISTINCT UNITS a book prices, never with
        how many clients it has.

        A client that cannot be rated — no card, or a card that cannot rate its
        usage — comes back `rated: false`, and the console shows "—" rather
        than a number the rating did not produce. `costRaw` on a rated row is
        the BASIS the rating used — Floe-settled cost plus any vendor dollars
        the basis admitted — which is not always the client's settled cost
        alone.

        AT MOST 200 CLIENTS PER RESPONSE. Rows are the highest-spending
        eligible clients, ordered deterministically; `truncated` and
        `omittedCount` say when the book is larger, so a caller totalling the
        rows knows whether it has the whole book. Enterprise has no
        billed-client cap, so this is reachable.

        Requires `attribution_reports` (Pro+); any role.
      operationId: devListCustomerMargins
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: days
          in: query
          required: false
          description: Window size; clamped to the plan's history floor.
          schema:
            type: integer
            default: 30
        - name: ids
          in: query
          required: false
          description: Comma-separated client ids. Omit for the whole book.
          schema:
            type: string
      responses:
        "200":
          description: Per-client margin
          content:
            application/json:
              schema:
                type: object
                properties:
                  windowDays:
                    type: integer
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  historyFloor:
                    type: string
                    format: date-time
                    nullable: true
                  historyClamped:
                    type: boolean
                  margins:
                    type: array
                    items:
                      type: object
                      properties:
                        customerId:
                          type: string
                        cardVersion:
                          type: integer
                          nullable: true
                        rated:
                          type: boolean
                          description: false → show "—"; the rating did not run for this client.
                        costRaw:
                          type: string
                        requests:
                          type: integer
                        audioSeconds:
                          type: integer
                        revenueRaw:
                          type: string
                          nullable: true
                        marginRaw:
                          type: string
                          nullable: true
                        vendorCostAppliedRaw:
                          type: string
                        vendorCostBasis:
                          type: string
                  deferred:
                    type: array
                    description: |
                      Retained in the shape, but empty: every unit the book can
                      price now has a set-wide counter, so no client is skipped
                      for cost reasons. A client still reports `rated: false`
                      when it has no rate card, or when its card cannot rate
                      its usage at all.
                    items:
                      type: string
        "400":
          description: days out of range
        "403":
          description: Plan lacks `attribution_reports`

  /v1/developer/margins/series:
    get:
      tags: [Developer]
      summary: Margin time series for a customer, a contract, or the fleet
      description: |
        P4.1. Weekly (UTC ISO weeks, Monday start) or monthly buckets, clipped
        to the window. Each row carries revenue with its SOURCE, never blended:
        `statement` for a closed period (its rated lines spread by the live
        shape, manual and true-up lines as `adjustmentsRaw` at period start),
        `rate_card` for open spans (the close's own engine, rated cumulatively
        and differenced), `none` where there is no rate card (revenue null,
        never zero). Cost is fully loaded, in four labelled parts:
        `vendorLegCostRaw`, `floeSettledRaw`, `orchestratorReconciledRaw`,
        `selfReportedRaw`. `periods` gives each closed period's statement
        total and any `restatedRaw` drift. Contracts and Stripe are not
        revenue: the contract grain returns `contract.contractMinimumRaw`
        beside revenue, and `collection` rides per bucket (`mixed` when two
        closed periods in one bucket differ). Fleet revenue sums customers
        with a card: a bucket where none is known is `none` (null, never 0),
        and one where only some are known carries `revenuePartial: true`.
        Weekly fleet buckets are limited to 182 days.

        Requires `attribution_reports` (free); any role.
      operationId: devGetMarginSeries
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: grain, in: query, required: false, schema: { type: string, enum: [customer, contract, fleet], default: fleet } }
        - { name: bucket, in: query, required: false, schema: { type: string, enum: [week, month], default: month } }
        - { name: customerId, in: query, required: false, description: Required for grain=customer., schema: { type: string } }
        - { name: contractId, in: query, required: false, description: Required for grain=contract., schema: { type: integer } }
        - { name: since, in: query, required: false, description: ISO 8601; clamped to the plan's history floor., schema: { type: string, format: date-time } }
        - { name: until, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Buckets with revenue by source and fully loaded cost
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: invalid_query (grain, bucket, range, a missing customerId / contractId, or weekly fleet over 182 days)
        "404":
          description: contract_not_found

  /v1/developer/margins/outcomes:
    get:
      tags: [Developer]
      summary: Margin per outcome for one customer and outcome kind
      description: |
        P4.1 view c. Cohort = the customer's calls in the window after the
        campaign / channel filters. A success holds a current confirmed claim
        of `kind`; reported / disputed claims are unresolved and pool with
        the failures. The pool's cost AND revenue move onto the successes with
        one weight vector (allocation method v2), so each row compares fully
        loaded cost with fully loaded revenue. Returns P25 / P50 / P90 cost and
        the tail-risk count (cost above revenue, whole revenue only). Kinds
        overlap — never add kinds together. `anchor=report` buckets successes
        by confirmation time; failed attempts stay bucketed by spend, and a
        call confirmed outside the window leaves its cohort. Closed periods
        answer from their issued statement's rated lines (`revenueSource`
        `statement` or `mixed`), never a re-rate. `noneReason` says why
        revenue is missing: `no_rate_card` or `rating_refused`.

        Requires `attribution_reports` (free); any role.
      operationId: devGetOutcomeMargin
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: customerId, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, required: true, schema: { type: string } }
        - { name: anchor, in: query, required: false, schema: { type: string, enum: [spend, report], default: spend } }
        - { name: method, in: query, required: false, description: Allocation method; defaults to the documented default., schema: { type: string } }
        - { name: campaignId, in: query, required: false, schema: { type: string } }
        - { name: channel, in: query, required: false, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: until, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Per-success rows, distribution, tail-risk KPI and totals
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: invalid_query

  /v1/developer/margins/outcome-kinds:
    get:
      tags: [Developer]
      summary: The outcome kinds a customer's current claims carry
      description: Requires `attribution_reports` (free); any role.
      operationId: devListOutcomeKinds
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: customerId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Distinct kinds
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items: { type: string }

  /v1/developer/reports:
    get:
      tags: [Developer]
      summary: List outcome / ROI reports
      description: |
        P4.2. The newest 100 reports, each with its share state: whether a
        link was issued, its expiry, revocation, the view count, and
        `referralSignups` (new accounts whose first-touch source was this
        report's "generate yours" link). Requires `attribution_reports` (free).
      operationId: devListOutcomeReports
      security:
        - developerSession: []
        - developerApiKey: []
      responses:
        "200":
          description: Reports, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Developer]
      summary: Generate an outcome / ROI report (an immutable snapshot)
      description: |
        P4.2. Freezes margin per outcome (view c) for one customer and
        outcome kind, the customer's monthly series and a tie-out: Σ cost
        against the ledger (four labelled parts), and revenue split into the
        part backed by WHOLE closed statements in the window (with statement
        line items, Stripe invoice ids and per-invoice collection status) and
        the rest. `aligned` is true only when the window matches closed
        periods. The report records the rate-card versions, allocation method
        and version, anchor and code revision. It stores ids, never names,
        and is never recomputed: regenerate for fresh numbers (a new report,
        a new id). `maskIdentifiers` (default true) hides customer, campaign
        and task ids on the shared page and in the CSV.
        Requires `attribution_reports` (free) and the member role.
      operationId: devCreateOutcomeReport
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, kind, since, until]
              properties:
                customerId: { type: string }
                kind: { type: string }
                since: { type: string, format: date-time }
                until: { type: string, format: date-time }
                anchor: { type: string, enum: [spend, report], default: spend }
                method: { type: string }
                campaignId: { type: string }
                channel: { type: string }
                maskIdentifiers: { type: boolean, default: true }
      responses:
        "201":
          description: The new report's summary
        "400":
          description: invalid_request

  /v1/developer/reports/{publicId}:
    get:
      tags: [Developer]
      summary: Read one report (owner view)
      description: |
        The stored snapshot, unmasked, plus the customer's current name
        (resolved at read, for the owner only). Requires
        `attribution_reports` (free).
      operationId: devGetOutcomeReport
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, pattern: "^rpt_[0-9a-f]{16}$" } }
      responses:
        "200":
          description: Summary, customer name and the report
        "404":
          description: report_not_found

  /v1/developer/reports/{publicId}/report.csv:
    get:
      tags: [Developer]
      summary: Download a report as CSV
      description: |
        Header block (allocation method and version, anchor, rate-card
        versions, code revision), one row per success, the tie-out and the
        statement lines with Stripe invoice ids. Follows the report's masking
        flag. Requires `exports` (Pro+).
      operationId: devGetOutcomeReportCsv
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        "403":
          description: Plan lacks `exports`
        "404":
          description: report_not_found

  /v1/developer/reports/{publicId}/share:
    post:
      tags: [Developer]
      summary: Issue the report's share link (once)
      description: |
        Returns the token ONCE; only its sha256 is stored. One link per
        report: a second issue, or an issue after revoke, is 409 — generate a
        new report for a new link. Requires Pro+ and the admin role.
      operationId: devShareOutcomeReport
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "201":
          description: "{ token, path: /share/{token}, expiresAt }"
        "400":
          description: invalid_request
        "403":
          description: Plan below Pro, or role below admin
        "404":
          description: report_not_found
        "409":
          description: share_already_issued

  /v1/developer/reports/{publicId}/revoke:
    post:
      tags: [Developer]
      summary: Revoke the report's share link, for good
      description: Idempotent. Any plan (a downgraded account can still revoke); admin role.
      operationId: devRevokeOutcomeReport
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "{ revoked: true }"
        "404":
          description: report_not_found

  /v1/public/reports/{token}:
    get:
      tags: [Developer]
      summary: Read a shared report (public, no session)
      description: |
        Token-gated and read-only over the stored snapshot: it never re-rates
        and never resolves a name. Revocation and expiry are checked on every
        read; unknown, revoked and expired links are the same 404. Each read
        bumps the owner's view count (capped per report per minute, no viewer
        identity kept). Masked reports show "Customer A", "Campaign A",
        "Task 1…" and statement lines by kind.
      operationId: publicGetOutcomeReport
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The presented report and its expiry
        "404":
          description: report_not_found

  /v1/case/session:
    post:
      tags: [Counterparty]
      summary: Open a case session (buyer sign-in, L0.8)
      description: |
        Exchanges a `csh_` case link plus a Privy access token (email sign-in)
        for the `floe_case_session` cookie (HttpOnly, Secure, SameSite=Lax,
        Path=/v1/case, 8 h). The only /v1/case route that needs no
        X-Floe-Case-Link header. The
        Privy token is verified first; the link is looked up only after. The
        verified email must have an ACTIVE membership on the case. Never creates
        a Floe developer account. Unknown / revoked / expired link or no
        membership: the one identical 404. Counts one view.
      operationId: caseOpenSession
      security:
        - privyAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, pattern: '^csh_[0-9a-f]{48}$' }
      responses:
        "200":
          description: Signed in (cookie set)
          content:
            application/json:
              schema:
                type: object
                required: [case, member]
                properties:
                  case:
                    type: object
                    required: [publicId, name, counterpartyName, status]
                    properties:
                      publicId: { type: string }
                      name: { type: string }
                      counterpartyName: { type: string }
                      status: { type: string, enum: [draft, shared, locked, closed] }
                  member: { $ref: "#/components/schemas/CaseSessionMember" }
        "400":
          description: "`invalid_request` — not JSON, or body is not { token }"
        "401":
          description: "`invalid_privy_token` — missing or invalid Privy token (the link is not looked up)"
        "404":
          description: "`case_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseNotFound" }
        "429":
          description: "`rate_limited`"
        "502":
          description: "`privy_unavailable`"
        "503":
          description: "`privy_auth_unavailable`"

  /v1/case:
    get:
      tags: [Counterparty]
      summary: Read the shared case (buyer, L0.8)
      description: |
        The case, the member, every assumption with its owner, whether THIS
        member may edit it, and per scenario the value this case reads, plus
        the baseline lock record (null until L3.3). Per scenario S: this case's
        S value, else this case's `all` value, else (unlocked cases only) the
        initiative default's S value, else the default's `all` value. `all`
        answers conservative and expected only — never vendor_claim. A locked
        case reads only its own values. Each value carries `buyerUnapproved`,
        `approvedBy`, `entryScenario` and `frozenAtLock`. A buyer_finance
        member also gets `members`: the active members of THIS case (absent
        for buyer_viewer). Case session only.
      operationId: caseGetView
      security:
        - caseSession: []
      parameters:
        - $ref: "#/components/parameters/CaseLinkHeader"
      responses:
        "200":
          description: The case view
          content:
            application/json:
              schema:
                type: object
                required: [case, member, assumptions, lock]
                properties:
                  case:
                    type: object
                    required: [publicId, name, counterpartyName, status, initiativeName]
                    properties:
                      publicId: { type: string }
                      name: { type: string }
                      counterpartyName: { type: string }
                      status: { type: string, enum: [draft, shared, locked, closed] }
                      initiativeName: { type: string }
                  member: { $ref: "#/components/schemas/CaseSessionMember" }
                  assumptions:
                    type: array
                    items: { $ref: "#/components/schemas/CaseAssumption" }
                  lock:
                    type: object
                    nullable: true
                    required: [lockedAt, lockedBy]
                    properties:
                      lockedAt: { type: string, format: date-time }
                      lockedBy: { type: string }
                  members:
                    type: array
                    description: >-
                      buyer_finance only (absent for buyer_viewer): the ACTIVE
                      members of this case, oldest invite first. `invitedBy` is
                      a label (the inviting vendor member's email, else
                      "vendor"), never a raw ref.
                    items:
                      type: object
                      required: [email, role, invitedBy, createdAt]
                      properties:
                        email: { type: string }
                        role: { type: string, enum: [buyer_finance, buyer_viewer] }
                        invitedBy: { type: string }
                        createdAt: { type: string, format: date-time }
        "404":
          description: "`case_not_found` — no/invalid session, link revoked/expired/replaced, or membership removed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseNotFound" }
        "409":
          description: "`case_session_mismatch` — X-Floe-Case-Link missing or not this session's link (checked after the 404 checks)"

  /v1/case/journal:
    get:
      tags: [Counterparty]
      summary: The case journal (buyer, L0.8)
      description: |
        Value revisions on the initiative defaults and on THIS case (other cases
        on the same deal are not shown), every ownership change (with the
        reason when it moved away from a buyer), and every buyer approval on this case. `who` and
        `by` are emails / labels. Case session only.
      operationId: caseGetJournal
      security:
        - caseSession: []
      parameters:
        - $ref: "#/components/parameters/CaseLinkHeader"
      responses:
        "200":
          description: The journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseJournal" }
        "404":
          description: "`case_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseNotFound" }
        "409":
          description: "`case_session_mismatch` — X-Floe-Case-Link missing or not this session's link (checked after the 404 checks)"

  /v1/case/assumptions/{key}/value:
    put:
      tags: [Counterparty]
      summary: Declare a value on an assumption you own (buyer, L0.8)
      description: |
        buyer_finance only, and only on a key owned by this member; always this
        case's value (the body cannot set caseRef, owner or grade). Journaled
        with created_by = the member. Case session only.
      operationId: caseDeclareValue
      security:
        - caseSession: []
      parameters:
        - $ref: "#/components/parameters/CaseLinkHeader"
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value, scenario, citation, asOf, period]
              properties:
                value: { type: string, pattern: '^-?[0-9]+$' }
                scenario: { type: string, enum: [conservative, expected, vendor_claim, all] }
                citation:
                  type: object
                  additionalProperties: false
                  properties:
                    ref: { type: string, maxLength: 500, description: The named source. Absent or blank = no source — grade D }
                    benchmark: { type: boolean, description: A benchmark or vendor-asserted figure — grade D }
                asOf: { type: string }
                period: { type: string }
                reason: { type: string, description: Required on a change }
      responses:
        "201":
          description: "{ entryId, period, value, grade, isNew: true }"
        "200":
          description: A replay (isNew false)
        "400":
          description: "`invalid_request` / `invalid_assumption_value`"
        "403":
          description: "`read_only_member` (buyer_viewer) or `not_assumption_owner` (names the owner)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotAssumptionOwner" }
        "404":
          description: "`case_not_found` / `assumption_not_found`"
        "409":
          description: "`case_session_mismatch` / `period_locked` / `revision_conflict`"

  /v1/case/assumptions/{key}/approve:
    post:
      tags: [Counterparty]
      summary: Approve the vendor value shown for a scenario (buyer_finance, L0.8)
      description: |
        Records the buyer's explicit accept of the vendor-AUTHORED value entry
        this case currently shows for `scenario` (that exact entry: a new
        vendor value is a new entry, so `buyerUnapproved` returns). Who
        authored the entry decides, not who owns the assumption now.
        Idempotent, append-only, listed in the journal's `approvals`. Only the
        buyer clears the flag — never a grade. Case session only. `entryId` is
        REQUIRED: the entry the value was loaded with; if the entry shown for
        the scenario is now a different one, nothing is approved and the
        answer is 409 `value_changed`. There is no blind approve. An approval
        by a member since removed from the case no longer counts (the flag
        returns); an active buyer_finance may approve that entry again, and
        the new approval (`by` = them) clears the flag. When another active
        buyer already approved the entry, the answer is their approval (`by` =
        the recorded approver).
      operationId: caseApproveValue
      security:
        - caseSession: []
      parameters:
        - $ref: "#/components/parameters/CaseLinkHeader"
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenario, entryId]
              properties:
                scenario: { type: string, enum: [conservative, expected, vendor_claim, all] }
                entryId: { type: string, description: The value's entryId as loaded from GET /v1/case }
      responses:
        "200":
          description: The approval (new or already recorded)
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval: { $ref: "#/components/schemas/CaseValueApproval" }
        "400":
          description: "`invalid_request` — body is not { scenario, entryId }"
        "403":
          description: "`read_only_member` (buyer_viewer)"
        "404":
          description: "`case_not_found` / `assumption_not_found`"
        "409":
          description: "`case_session_mismatch` / `nothing_to_approve` (no value is shown for the scenario, or the shown value was not authored by the vendor) / `value_changed` (`entryId` is not the entry shown now; refresh and review)"

  /v1/case/baseline/lock:
    post:
      tags: [Counterparty]
      summary: Lock the case baseline (buyer_finance, L0.8 permission side)
      description: |
        buyer_finance only. The lock store arrives with L3.3; until then this
        answers 501 `baseline_lock_unavailable`. In the lock's transaction every
        initiative default the case reads is copied into the case (origin
        computed, `materialize_on_lock@1`, lineage to the default), so the case
        then reads only its own values and a later default change never moves
        it. Once locked, the vendor can no longer write this case's values (409
        case_baseline_locked); the initiative default stays writable.

        The lock freezes what the buyer saw: `entryIds` = every value entryId
        GET /v1/case showed (order and repeats do not matter). The server
        resolves the case's values again inside the lock's transaction; a
        different set → 409 `value_changed` and nothing is written.
        Idempotent: locking a locked case writes nothing and answers 200 with
        the existing record, BEFORE any `entryIds` comparison — a retry of the
        original request (ids of the pre-lock values) never gets 409.
      operationId: caseLockBaseline
      security:
        - caseSession: []
      parameters:
        - $ref: "#/components/parameters/CaseLinkHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entryIds]
              properties:
                entryIds:
                  type: array
                  maxItems: 10000
                  items: { type: string }
                  description: Every value entryId the buyer reviewed on GET /v1/case
      responses:
        "201":
          description: "{ lock: { lockedAt, lockedBy } }"
        "200":
          description: "Already locked: { lock } — the existing record; nothing written"
        "400":
          description: "`invalid_request` — body is not { entryIds }"
        "403":
          description: "`read_only_member`"
        "404":
          description: "`case_not_found`"
        "409":
          description: "`case_session_mismatch` / `value_changed` (a value changed since load; nothing locked)"
        "501":
          description: "`baseline_lock_unavailable`"

  /v1/case/logout:
    post:
      tags: [Counterparty]
      summary: Clear the case session (L0.8)
      description: |
        Needs X-Floe-Case-Link; when the cookie verifies it must be for that
        link (a page never signs out another link's session). No database read.
      operationId: caseLogout
      security: []
      parameters:
        - $ref: "#/components/parameters/CaseLinkHeader"
      responses:
        "200":
          description: "{ ok: true }"
        "409":
          description: "`case_session_mismatch`"

  /v1/developer/rate-cards:
    get:
      tags: [Developer]
      summary: All rate-card versions for one customer
      description: |
        Newest version first. `currentVersionId` is the version rating usage
        RIGHT NOW (latest active `effectiveFrom` ≤ now) — never "highest
        version number": a draft, or a future-dated version, must display
        exactly as it rates. Any role; reads stay open after a downgrade.
      operationId: devListRateCards
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  currentVersionId:
                    type: integer
                    nullable: true
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RateCard"
        "400":
          description: customerId query param required
    post:
      tags: [Developer]
      summary: Append a new rate-card version for a customer
      description: |
        Rate cards are APPEND-ONLY: there is no PATCH/DELETE on a version —
        "editing" is posting version N+1 with a new `effectiveFrom`. Old
        versions keep rating the usage of their era forever, which is what
        makes closed statements byte-reproducible. `status=active` (default)
        starts rating at `effectiveFrom` (default now); `status=draft` parks
        the version for preview-then-activate. An active version may never
        start before the latest existing active version (400
        `effective_from_regression`) — back-dating would retroactively
        re-rate history. A customer new to billing on this account counts
        against the plan's billed-clients cap (409 `plan_limit_exceeded`).
        Owner/admin role; `rate_cards` feature (Agency+).
      operationId: devCreateRateCard
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customerId, rules]
              properties:
                customerId:
                  type: string
                  maxLength: 128
                rules:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/RateCardRule"
                status:
                  type: string
                  enum: [active, draft]
                  default: active
                effectiveFrom:
                  type: string
                  format: date-time
                  description: Defaults to now for active versions; null for drafts until activated.
                note:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCard"
        "400":
          description: Invalid body / rule, or effective_from_regression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden (role below admin) or plan_required (rate_cards needs Agency)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "409":
          description: version_conflict (concurrent create — retry) or plan_limit_exceeded (billed-clients cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/rate-cards/{id}/activate:
    post:
      tags: [Developer]
      summary: Activate a draft rate-card version
      description: |
        Stamps `effectiveFrom` (default now) and flips `draft → active` —
        the last write that row ever sees. Same monotonic-timeline guard as
        POST /v1/developer/rate-cards. Owner/admin role; `rate_cards`
        feature (Agency+).
      operationId: devActivateRateCard
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/RateCardId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                effectiveFrom:
                  type: string
                  format: date-time
      responses:
        "200":
          description: The activated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCard"
        "400":
          description: Invalid id / body, or effective_from_regression
        "403":
          description: forbidden or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "404":
          description: not_found — unknown or another account's version
        "409":
          description: not_draft — only a draft can be activated; active versions are immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/rate-cards/preview:
    post:
      tags: [Developer]
      summary: Scenario preview — rate real usage under candidate rule sets
      description: |
        Rates the customer's ACTUAL usage over the last `days` (or an
        `assumedUsage` vector for a client with no history) under up to six
        candidate rule sets side by side, with the SAME pure engine the
        period close uses — a preview can never disagree with the invoice it
        previews. Nothing is persisted. Any role; `rate_cards` feature
        (Agency+).
      operationId: devPreviewRateCards
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customerId, candidates]
              properties:
                customerId:
                  type: string
                  maxLength: 128
                days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 30
                candidates:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required: [label, rules]
                    properties:
                      label:
                        type: string
                        maxLength: 60
                      rules:
                        type: array
                        minItems: 1
                        maxItems: 20
                        items:
                          $ref: "#/components/schemas/RateCardRule"
                assumedUsage:
                  type: object
                  additionalProperties: false
                  description: Rate an assumed usage vector instead of the ledger (new client, no history).
                  required: [audioSeconds, requests, costRaw]
                  properties:
                    audioSeconds:
                      type: integer
                      minimum: 0
                    requests:
                      type: integer
                      minimum: 0
                    tasks:
                      type: integer
                      minimum: 0
                      description: Required when a candidate prices `task` (400 otherwise).
                    untaskedRequests:
                      type: integer
                      minimum: 0
                      description: Requests with no task id; defaults to 0. Above 0, a per-task option carries an `uncounted_usage` blocker.
                    voiceCalls:
                      type: integer
                      minimum: 0
                      description: Required when a candidate prices `voice_call` (400 otherwise).
                    outcomes:
                      type: object
                      additionalProperties: false
                      description: P4.4 — required per outcome unit a candidate prices (400 otherwise).
                      properties:
                        resolution: { type: integer, minimum: 0 }
                        meeting_booked: { type: integer, minimum: 0 }
                        qualified_lead: { type: integer, minimum: 0 }
                    costRaw:
                      type: string
                      pattern: "^\\d{1,15}$"
      responses:
        "200":
          description: One rated option per candidate
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  windowDays:
                    type: integer
                  usageSource:
                    type: string
                    enum: [ledger, assumed]
                  usage:
                    $ref: "#/components/schemas/RatableUsage"
                  options:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            label:
                              type: string
                        - $ref: "#/components/schemas/RatedResult"
        "400":
          description: Invalid body or an invalid rule inside a candidate
        "403":
          description: plan_required — rate_cards needs Agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"

  /v1/developer/projects:
    get:
      tags: [Developer]
      summary: List projects (with agent counts)
      description: |
        The supply-side grouping under an account (account → project →
        agents). A project's `defaultCustomerId` is the third tier of the
        attribution chain (header → agent default → project default): set it
        once and every agent in the project attributes its spend to that
        end-client with no code change. Any role.
      operationId: devListProjects
      security:
        - developerSession: []
        - developerApiKey: []
      responses:
        "200":
          description: Projects ordered by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      tags: [Developer]
      summary: Create a project
      operationId: devCreateProject
      description: Owner/admin role; `rate_cards` feature (Agency+). Names are unique per account.
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
                defaultCustomerId:
                  type: string
                  maxLength: 128
                  nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid body
        "403":
          description: forbidden or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "409":
          description: name_taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/projects/{id}:
    patch:
      tags: [Developer]
      summary: Rename a project or set its default customer
      operationId: devUpdateProject
      description: At least one of `name` / `defaultCustomerId` (null clears it). Owner/admin role; `rate_cards` feature (Agency+).
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 80
                defaultCustomerId:
                  type: string
                  maxLength: 128
                  nullable: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid id / body, or neither field provided
        "403":
          description: forbidden or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "404":
          description: not_found
        "409":
          description: name_taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/billing-periods:
    get:
      tags: [Developer]
      summary: Billing periods for one customer (newest first, keyset-paged)
      description: |
        Lifecycle `open → closed → issued`, then the collection states
        `paid / void / uncollectible` set by Stripe once the statement was
        pushed as an invoice. Any role; reads stay open after a downgrade so
        an account can still see and export what it already issued.
      operationId: devListBillingPeriods
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor taken verbatim from a previous response's
            `nextCursor`. Validated for SHAPE only — it is not signed and not
            bound to this endpoint, so a well-formed cursor is accepted and
            simply positions the window; only a malformed one is a 400. That is
            safe rather than lax: the query is always scoped to the
            authenticated wallet and `customerId`, so a hand-made cursor can
            only move the window within rows the caller may already read.
          schema:
            type: string
      responses:
        "200":
          description: Periods
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  periods:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingPeriod"
                  nextCursor:
                    type: string
                    nullable: true
                    description: Cursor for the next page; null on the last page.
                  hasMore:
                    type: boolean
        "400":
          description: Invalid customerId, limit or cursor
    post:
      tags: [Developer]
      summary: Create an OPEN billing period
      description: |
        Half-open window `[periodStart, periodEnd)`, at most 92 days, unique
        per (customer, periodStart). Manual line items can be added while
        open; close it once the window has fully elapsed. A customer new to
        billing on this account counts against the plan's billed-clients cap
        (409 `plan_limit_exceeded`). Owner/admin role; `client_invoicing`
        feature (Agency+).
      operationId: devCreateBillingPeriod
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customerId, periodStart, periodEnd]
              properties:
                customerId:
                  type: string
                  maxLength: 128
                periodStart:
                  type: string
                  format: date-time
                periodEnd:
                  type: string
                  format: date-time
                timezone:
                  type: string
                  maxLength: 128
                  default: UTC
                  description: Display timezone recorded on the statement; the window itself is the ISO instants given.
      responses:
        "201":
          description: The open period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPeriod"
        "400":
          description: Invalid body, periodStart ≥ periodEnd, or window > 92 days
        "403":
          description: forbidden or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "409":
          description: period_exists (same customer + periodStart) or plan_limit_exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/billing-periods/{id}:
    get:
      tags: [Developer]
      summary: One billing period with its statement line items
      operationId: devGetBillingPeriod
      description: Any role. Another account's period is 404 `not_found` (never disclosed).
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/BillingPeriodId"
      responses:
        "200":
          description: Period + line items (rated first, then manual)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPeriodStatement"
        "400":
          description: Invalid id
        "404":
          description: not_found

  /v1/developer/billing-periods/{id}/line-items:
    post:
      tags: [Developer]
      summary: Add a manual line item (open periods only)
      description: |
        One-off charge or credit on an OPEN period — audit-trailed (who,
        when, note). `amountRaw` is a SIGNED raw 6-dp USDC integer string;
        negative = credit. Manual items sort after the rated lines at close.
        A closed statement is immutable (409 `period_not_open`). Owner/admin
        role; `client_invoicing` feature (Agency+).
      operationId: devAddBillingPeriodLineItem
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/BillingPeriodId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, amountRaw]
              properties:
                label:
                  type: string
                  maxLength: 200
                amountRaw:
                  type: string
                  pattern: "^-?\\d{1,15}$"
                  description: Signed raw 6-dp USDC integer string (credits negative).
                  example: "-25000000"
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: The line item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementLineItem"
        "400":
          description: Invalid id / body
        "403":
          description: forbidden or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "404":
          description: not_found
        "409":
          description: period_not_open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/billing-periods/{id}/close:
    post:
      tags: [Developer]
      summary: Close a period — rate, snapshot, freeze the statement
      description: |
        Segments the period at every rate-card version boundary, rates each
        segment's ledger usage under its own version (retainers prorated by
        segment share), snapshots the rated lines with full provenance
        (card version + segment bounds) and computes `revenueRaw` /
        `costRaw` / `marginRaw` / `totalCents`. One transaction whose first
        write is a compare-and-set on `status='open'`. Re-closing returns
        the identical statement (`alreadyClosed: true`) — byte-reproducible
        forever, even after the rate card changes again. Refuses to close
        before the window has elapsed (409 `period_not_ended`), when a
        segment has usage but no effective card version (409
        `unrated_usage` — unrated spend must never silently invoice $0),
        when a per-task rule's count is only a lower bound because some
        requests carry no task id (409 `uncounted_usage`, with `blockers`),
        while a charge in the window is still held at its reserve (409
        `holds_pending`, with `holdsPending` — a pending row with no x402
        reservation, e.g. a marketplace or Floe Phone upper-bound reserve,
        whose real amount is written only when it settles), or when a
        concurrent close won (409 `close_conflict`). Owner/admin role;
        `client_invoicing` feature (Agency+).
      operationId: devCloseBillingPeriod
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/BillingPeriodId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                actualsGateOverrideReason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: >
                    OWNER only. Closes past a close gate: the vendor-actuals
                    gate (vendor cost not yet confirmed) and/or
                    `uncounted_usage` (per-task pricing over requests with no
                    task id — only the counted tasks are billed), and/or
                    `holds_pending` (the holds are billed at their reserved
                    amount, as the ledger states them at close; the response
                    carries `holdsPendingAtClose`; every hold is snapshotted
                    and the hourly true-up pass carries each one's settle
                    delta into the next open period as a `true_up` line).
                    Persisted on the period.
                    Sent when no gate blocks, it is refused with 409
                    `override_not_required`.
      responses:
        "200":
          description: The closed statement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BillingPeriodStatement"
                  - type: object
                    properties:
                      alreadyClosed:
                        type: boolean
                        description: Present (true) when the period had already left `open` — nothing was re-rated.
                      holdsPendingAtClose:
                        allOf:
                          - $ref: "#/components/schemas/BillingPeriodPendingHolds"
                        description: >
                          Present only when an owner override closed past
                          `holds_pending` — the holds billed at their reserve.
        "400":
          description: Invalid id
        "403":
          description: forbidden or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "404":
          description: not_found
        "409":
          description: period_not_ended, period_settling, unrated_usage, legacy_estimate_basis, holds_pending, vendor_actuals_pending, uncounted_usage, override_not_required, close_restart, or close_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPeriodCloseRefusal"

  /v1/developer/billing-periods/{id}/issue:
    post:
      tags: [Developer]
      summary: Mark a closed statement issued (manual / CSV flow)
      description: |
        Compare-and-set `closed → issued` and stamp `issuedAt`. This is the
        no-Stripe path: the agency downloads the statement CSV and invoices
        from it. Sending the statement through Stripe instead (POST
        /v1/developer/billing-periods/{id}/invoice) performs this transition
        itself. Issuing twice 409s `not_closed`. Owner/admin role;
        `client_invoicing` feature (Agency+).
      operationId: devIssueBillingPeriod
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/BillingPeriodId"
      responses:
        "200":
          description: The issued period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPeriod"
        "400":
          description: Invalid id
        "403":
          description: forbidden or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "404":
          description: not_found
        "409":
          description: not_closed — only a closed period can be issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/billing-periods/{id}/invoice:
    post:
      tags: [Developer]
      summary: Send a closed statement as an invoice through the account's connected Stripe
      description: |
        Pushes the frozen statement to the AGENCY's Stripe account (Stripe
        Connect, linked via POST /v1/developer/stripe/connect/start): ensures
        a Stripe Customer for the end-client, creates a draft invoice, adds
        one invoice item per statement line (integer cents), verifies the
        Stripe total equals `totalCents`, finalizes it with
        `collection_method: send_invoice` and the account's `daysUntilDue`,
        and emails it from the agency's own Stripe — their branding, their
        dunning, their payout. Floe never touches the money; the application
        fee is `STRIPE_CONNECT_APPLICATION_FEE_BPS` (default 0, recorded as
        `floeFeeRaw` either way). The period moves `closed → issued`
        (`issued` stays) and `client_invoice.sent` is emitted; Stripe's
        `invoice.paid / voided / marked_uncollectible` webhooks later move it
        to `paid / void / uncollectible` (`client_invoice.*` events).

        Resumable: every step is persisted before the next, so a retry after
        a crash resumes at the first unfinished step (idempotency keys
        `bp:{periodId}:a{pushAttempt}:…`) and never creates a second invoice.
        Re-pushing a finalized period returns the same invoice with
        `alreadyPushed: true`. A draft the agency deleted in Stripe makes the
        period pushable again (`pushError: draft_deleted`, `pushAttempt` + 1).

        Preconditions are checked in this order and each is a 409 with that
        code: `stripe_not_connected`, `connected_account_restricted`
        (`chargesEnabled=false` — finish onboarding in Stripe),
        `period_not_pushable` (status ∉ {closed, issued}, or a draft exists
        on a previously connected account), `customer_email_required`
        (set it via PATCH /v1/developer/customers/{customerId}),
        `empty_statement`, `nonpositive_total` (a $0 / credit statement —
        Stripe would auto-mark it paid and seed a credit balance), and
        `total_below_minimum` (< $0.50, Stripe's floor). A Stripe total that
        disagrees with `totalCents` deletes the draft and 409s
        `push_total_mismatch`. Refused periods stay on the CSV flow.
        Owner/admin role; `client_invoicing` feature (Agency+); 5 pushes per
        minute per account.
      operationId: devPushBillingPeriodInvoice
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/BillingPeriodId"
      responses:
        "200":
          description: Invoice sent (or already sent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePushResult"
        "400":
          description: Invalid id
        "403":
          description: forbidden (role below admin) or plan_required (client_invoicing needs Agency)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "404":
          description: not_found — unknown or another account's period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePushError"
        "409":
          description: >
            stripe_not_connected, connected_account_restricted,
            period_not_pushable, customer_email_required, empty_statement,
            nonpositive_total, total_below_minimum, or push_total_mismatch
            (see description for the order)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePushError"
        "429":
          description: push_rate_limited — more than 5 pushes in a minute for this account (`retryAfterSeconds` + a `Retry-After` header say when)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvoicePushError"
                  - type: object
                    properties:
                      retryAfterSeconds:
                        type: integer
        "502":
          description: stripe_error — a Stripe SDK error outside the push pipeline (`code` carries Stripe's error code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: stripe_not_configured (Stripe is off on this deployment) or push_failed (a Stripe request failed — retry; completed steps are kept)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePushError"

  /v1/developer/billing-periods/{id}/statement.csv:
    get:
      tags: [Developer]
      summary: Statement CSV for a billing period
      description: |
        The client-facing statement as CSV — a `#` header comment line,
        `label,kind,quantity,unit,amount_usd,source,note` rows (rated first,
        then manual; amounts as exact decimal USD) and a `# totals:` footer.
        Rated prices only: the account's cost basis and margin never appear
        in this artifact. Same bytes as the dashboard's download; served
        with `Content-Disposition: attachment`. Any role.
      operationId: devGetBillingPeriodStatementCsv
      security:
        - developerSession: []
        - developerApiKey: []
      parameters:
        - $ref: "#/components/parameters/BillingPeriodId"
      responses:
        "200":
          description: CSV statement
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="floe-statement-acme-dental-2026-07-01.csv"
          content:
            text/csv:
              schema:
                type: string
                example: |
                  # Floe statement · customer acme-dental · 2026-07-01 → 2026-08-01 · status issued · currency usd · invoice A1B2C3-0001
                  label,kind,quantity,unit,amount_usd,source,note
                  Monthly retainer,fixed,,,500,rated,
                  Voice minutes,per_unit,912,audio_minute,91.2,rated,
                  Setup fee,manual,,,150,manual,onboarding
                  # totals: revenue_usd=741.2, total_cents=74120
        "400":
          description: Invalid id
        "404":
          description: not_found

  /v1/developer/stripe/connect/start:
    post:
      tags: [Developer]
      summary: Start linking the account's own Stripe account (OAuth)
      description: |
        Mints a single-use, 15-minute OAuth `state` and returns the Stripe
        Connect authorize URL (`scope: read_write`). Redirect the browser to
        `url`; the agency signs in to — or creates — their Stripe account on
        Stripe's consent page and Stripe returns to the API host
        (`GET /v1/developer/stripe/connect/callback`, cookie-authenticated,
        never called directly), which exchanges the code exactly once and
        redirects to `{DASHBOARD_URL}/customers?stripe=connected` or
        `?stripe=error&reason=access_denied|signed_out|state_invalid|
        state_expired|state_replayed|wrong_account|role_required|
        already_connected_elsewhere|exchange_failed`. Only the member who
        started the flow can complete it, from the same browser session.
        Floe stores the connected account id only — never the agency's
        Stripe keys. Owner/admin role AND a human session (developer API
        keys get 403 `session_required`); `stripe_connect` feature (Agency+).
        The account's `email` / display name prefill Stripe's form;
        `businessName` overrides the latter.
      operationId: devStartStripeConnect
      security:
        - developerSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                businessName:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Stripe authorize URL — redirect the browser to it
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    example: https://connect.stripe.com/oauth/authorize?response_type=code&client_id=ca_…&scope=read_write&state=…
                  expiresInSeconds:
                    type: integer
                    example: 900
        "400":
          description: invalid_request — body failed validation
        "403":
          description: forbidden (role below admin), session_required (developer API key), or plan_required (stripe_connect needs Agency)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "409":
          description: already_connected — disconnect first to link a different Stripe account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectError"
        "502":
          description: stripe_error — Stripe rejected the request (`code` carries Stripe's error code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: stripe_connect_not_configured — STRIPE_CONNECT_CLIENT_ID unset (GET /v1/capabilities.stripeConnect=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectError"

  /v1/developer/stripe/connect:
    get:
      tags: [Developer]
      summary: Stripe Connect link status for the account
      description: |
        Whether a Stripe account is linked and whether it can take payments
        (`chargesEnabled` — false until the agency finishes Stripe
        onboarding; invoice pushes 409 `connected_account_restricted` until
        then), plus the invoice settings applied to every push. Flags are
        refreshed by Stripe's `account.updated` webhook and the 6-hourly
        reconcile. `redirectUri` is the OAuth redirect this deployment uses —
        it must be registered in the Stripe Connect settings. Any role.
      operationId: devGetStripeConnect
      security:
        - developerSession: []
        - developerApiKey: []
      responses:
        "200":
          description: Connect status — served with no-store (the dashboard re-reads it right after the OAuth return)
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectStatus"
    patch:
      tags: [Developer]
      summary: Update invoice settings for the connected Stripe account
      description: |
        `daysUntilDue` (1–90, default 30) is the payment term stamped on
        every pushed invoice; `invoiceFooter` (≤ 500 chars, `null` clears)
        is printed on the hosted invoice and PDF. Owner/admin role;
        `stripe_connect` feature (Agency+).
      operationId: devUpdateStripeConnect
      security:
        - developerSession: []
        - developerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                daysUntilDue:
                  type: integer
                  minimum: 1
                  maximum: 90
                invoiceFooter:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectStatus"
        "400":
          description: invalid_request — body failed validation, or neither field was given
        "403":
          description: forbidden (role below admin) or plan_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequiredError"
        "409":
          description: stripe_not_connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectError"
    delete:
      tags: [Developer]
      summary: Disconnect the linked Stripe account
      description: |
        Revokes Floe's access at Stripe (best-effort — a link already
        revoked from the Stripe dashboard is still cleared locally), marks
        the link disconnected and emits `stripe.disconnected`. Invoices
        already sent keep collecting in the agency's Stripe and their
        `paid / void` webhooks are still applied. Reconnecting the same or
        another Stripe account creates fresh Stripe Customers on the next
        push. OWNER role AND a human session (developer API keys get 403
        `session_required`).
      operationId: devDisconnectStripeConnect
      security:
        - developerSession: []
      responses:
        "200":
          description: Status after disconnect — `connected` false, `disconnectedAt` set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectStatus"
        "403":
          description: forbidden (role below owner) or session_required (developer API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanServiceError"
        "409":
          description: stripe_not_connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectError"
        "502":
          description: stripe_error — the deauthorize call failed unexpectedly (an already-revoked link is still cleared locally)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/developer/charges/recent:
    get:
      tags: [Developer]
      summary: Cross-agent recent charge line items
      description: |
        Charges only. Holds (marketplace / Floe Phone reservations with no x402
        authorization behind them) are not charges and are omitted until they
        settle, when the real charge appears. A reservation-backed x402
        payment still pending settlement is a charge and is listed. Same
        classification as the `heldRaw` split on /billing/mtd and
        /billing/invoice.
      operationId: devGetRecentCharges
      security:
        - developerSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Newest charges first
          content:
            application/json:
              schema:
                type: object
                properties:
                  charges:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        agentId:
                          type: integer
                        agentName:
                          type: string
                        vendor:
                          type: string
                          description: Machine vendor label (model provider prefix, target host, or floe-phone).
                        endpoint:
                          type: string
                        amountRaw:
                          type: string
                          description: Vendor payment + platform fee, raw USDC (6 decimals).
                  limit:
                    type: integer
        "400":
          description: Invalid limit

  /v1/developer/policies/account-cap:
    get:
      tags: [Developer]
      summary: Account-wide spend-cap rollup
      description: |
        The single scope='developer' kind='session' policy the dashboard
        provisions per account (at most one active), with derived spend
        across every owned agent over the policy's window.
      operationId: devGetAccountCap
      security:
        - developerSession: []
      responses:
        "200":
          description: Cap state (configured=false → limitRaw/windowKind/windowResetsAt null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  limitRaw:
                    type: string
                    nullable: true
                    description: Raw USDC (6 decimals).
                  spentRaw:
                    type: string
                    description: Raw USDC (6 decimals).
                  windowKind:
                    type: string
                    nullable: true
                  windowResetsAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Rolling windows only; null otherwise.

  /v1/developer/policies/defaults:
    get:
      tags: [Developer]
      summary: Account defaults applied to new agents
      description: |
        Maps onto the closest real state — sessionLimitRaw is the account
        cap's limit, autoPauseEnabled is whether its breach action is
        suspend_agent, and allowlistMode is the hardcoded 'off' system
        default (per-agent column; no account-level default exists today).
      operationId: devGetPolicyDefaults
      security:
        - developerSession: []
      responses:
        "200":
          description: Defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionLimitRaw:
                    type: string
                    nullable: true
                    description: Raw USDC (6 decimals).
                  autoPauseEnabled:
                    type: boolean
                  allowlistMode:
                    type: string
                    enum: [off]

  /v1/developer/usage/summary:
    get:
      tags: [Developer]
      summary: Headline usage KPIs across the account
      description: |
        One scan of proxy_requests across every owned agent. errorRatePct
        counts status='failed' only; policy declines (status='rejected')
        are their own tile (policiesTripped) so the two never double-count.

        Ask either by fixed `window` (7d/30d) or by an explicit half-open
        [since, until) range; a range echoes `window: "custom"`. The response
        always reports the range it actually aggregated, so a caller can show
        that several panels share one window rather than assuming it.
      operationId: devGetUsageSummary
      security:
        - developerSession: []
      parameters:
        - name: window
          in: query
          description: Fixed window. Ignored when since/until is supplied.
          schema:
            type: string
            enum: [7d, 30d]
            default: 7d
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive lower bound of a half-open range; clamped to the plan's history floor. Takes precedence over `window`.
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound, defaulting to now.
      responses:
        "200":
          description: KPI tiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    type: string
                    description: What was asked for — "7d", "30d", or "custom" for an explicit range.
                  range:
                    type: object
                    description: The half-open window actually aggregated, after the plan's history clamp.
                    properties:
                      since:
                        type: string
                        format: date-time
                      until:
                        type: string
                        format: date-time
                  calls:
                    type: integer
                  errorRatePct:
                    type: number
                  p50LatencyMs:
                    type: number
                    nullable: true
                  policiesTripped:
                    type: integer
        "400":
          description: Invalid window, a malformed since/until, or until <= since

  /v1/developer/team/members:
    get:
      tags: [Developer]
      summary: List account members (any role)
      operationId: devListTeamMembers
      security:
        - developerSession: []
      responses:
        "200":
          description: Members + the caller's own role
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        memberWallet:
                          type: string
                        role:
                          type: string
                          enum: [owner, admin, member, viewer]
                        displayName:
                          type: string
                          nullable: true
                        email:
                          type: string
                          nullable: true
                        invitedBy:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        isSelf:
                          type: boolean
                  role:
                    type: string
                    nullable: true

  /v1/developer/team/members/{wallet}:
    patch:
      tags: [Developer]
      summary: Change a member's role (owner only)
      operationId: devSetTeamMemberRole
      security:
        - developerSession: []
      parameters:
        - name: wallet
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member, viewer]
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid wallet or body
        "404":
          description: Member not found in this account
        "409":
          description: |
            Cannot demote the last owner; or `member_owns_case` — the member
            owns a case (L0.8) and the new role is below member: reassign case
            ownership first.
    delete:
      tags: [Developer]
      summary: Remove a member (admin+; only an owner can remove an admin/owner)
      description: |
        Also revokes every API key the removed member minted — keys are
        account-scoped, so without this a removed teammate's key would keep
        authenticating with full account power. Self-removal is allowed.
      operationId: devRemoveTeamMember
      security:
        - developerSession: []
      parameters:
        - name: wallet
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed (revokedKeys = count of keys revoked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  memberWallet:
                    type: string
                  revokedKeys:
                    type: integer
        "403":
          description: Only an owner can remove an admin or owner
        "404":
          description: Member not found in this account
        "409":
          description: Cannot remove the last owner

  /v1/developer/team/invites:
    get:
      tags: [Developer]
      summary: List pending invites (admin+)
      operationId: devListTeamInvites
      security:
        - developerSession: []
      responses:
        "200":
          description: Pending invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        email:
                          type: string
                        role:
                          type: string
                        invitedBy:
                          type: string
                        expiresAt:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
    post:
      tags: [Developer]
      summary: Create an invite (admin+; only an owner may grant admin)
      description: |
        The invite email is sent fire-and-forget; the token is never
        returned by any read API. 'owner' is not an invitable role. Invites
        expire after 7 days; seats are capped at 10 (members + pending
        invites).
      operationId: devCreateTeamInvite
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 256
                role:
                  type: string
                  enum: [admin, member, viewer]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      role:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      createdAt:
                        type: string
                        format: date-time
        "403":
          description: Only an owner can invite an admin
        "409":
          description: Duplicate pending invite or seat limit (10) reached

  /v1/developer/team/invites/{id}:
    delete:
      tags: [Developer]
      summary: Revoke a pending invite (admin+)
      operationId: devRevokeTeamInvite
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
        "400":
          description: Invalid invite id
        "404":
          description: No pending invite with that id

  /v1/developer/team/invites/accept:
    post:
      tags: [Developer]
      summary: Accept an invite (any authed session)
      description: |
        Not role-gated — the accepting session belongs to the invitee, who
        is by definition not yet a member. Membership is granted to the
        SERVER-derived session wallet, never a body-supplied one. Someone
        already on the team uses the invite up but keeps their role
        (`roleUnchanged: true`, `role` = their current role): an invite never
        promotes or demotes — PATCH /team/members/{wallet} does.
      operationId: devAcceptTeamInvite
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 8
                  maxLength: 256
                  description: The finv_* token from the invite email.
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  accountWallet:
                    type: string
                  accountId:
                    type: string
                    nullable: true
                  role:
                    type: string
                    description: The member's role after accepting.
                  roleUnchanged:
                    type: boolean
                    description: True when they were already a member (their role is kept).
        "404":
          description: Invite not found or already used
        "409":
          description: already_used | seat_limit
        "410":
          description: Invite expired

  /v1/developer/orchestrators:
    get:
      tags: [Developer]
      summary: List orchestrator webhook connections
      description: Webhook/pre-call URLs (capability tokens) are returned; sealed secrets never are.
      operationId: devListOrchestrators
      security:
        - developerSession: []
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrchestratorConnection"
    post:
      tags: [Developer]
      summary: Connect an agent to Vapi/Retell/Bland (admin+)
      description: |
        vapi — Floe MINTS the shared secret (whsec_*) and returns it ONCE
        in the response; paste it into the Vapi server/webhook credential.
        retell/bland — `secret` is REQUIRED (the provider-side credential:
        Retell API key / Bland webhook signing secret). Secrets are stored
        AES-256-GCM sealed and never returned by any read API. One
        connection per (agent, provider) — re-keying is an explicit rotate.
      operationId: devCreateOrchestrator
      security:
        - developerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, provider]
              properties:
                agentId:
                  description: Owned agent id (integer or digit string).
                  oneOf:
                    - type: integer
                    - type: string
                      pattern: "^\\d+$"
                provider:
                  type: string
                  enum: [vapi, retell, bland]
                secret:
                  type: string
                  minLength: 8
                  maxLength: 512
                  description: Required for retell/bland; forbidden-to-omit enforced in the handler. Optional for vapi (Floe mints one).
                label:
                  type: string
                  maxLength: 100
      responses:
        "201":
          description: Connection (+ `secret` ONCE, vapi-minted only)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OrchestratorConnection"
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: Present only when Floe minted it (vapi) — shown once.
        "400":
          description: secret_required or invalid body
        "404":
          description: Unknown agent or not owned by caller
        "409":
          description: already_connected — rotate instead

  /v1/developer/orchestrators/{id}/rotate:
    post:
      tags: [Developer]
      summary: Rotate a connection's webhook token + secret (admin+)
      description: |
        Mints a new capability token (the old webhook URLs stop working).
        vapi — omit `secret` and Floe mints a new one (returned once);
        retell/bland — the new provider credential is required.
      operationId: devRotateOrchestrator
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secret:
                  type: string
                  minLength: 8
                  maxLength: 512
      responses:
        "200":
          description: Rotated connection (+ `secret` once when vapi-minted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OrchestratorConnection"
                  - type: object
                    properties:
                      secret:
                        type: string
        "400":
          description: secret_required (retell/bland rotate without a new credential)
        "404":
          description: Not found or not owned by caller

  /v1/developer/orchestrators/{id}:
    patch:
      tags: [Developer]
      summary: Enable/disable a connection (admin+)
      operationId: devUpdateOrchestrator
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  active:
                    type: boolean
        "404":
          description: Not found or not owned by caller
    delete:
      tags: [Developer]
      summary: Remove a connection (admin+; ledger history survives)
      operationId: devDeleteOrchestrator
      security:
        - developerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
        "404":
          description: Not found or not owned by caller

  /v1/developer/agents/{agentId}/numbers:
    get:
      tags: [Developer]
      summary: List the agent's phone numbers (history included)
      operationId: devListAgentNumbers
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Numbers, newest first (released rows included)
          content:
            application/json:
              schema:
                type: object
                properties:
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhoneNumber"
                  rentalRaw:
                    type: string
                    nullable: true
                    description: First-month rental (raw 6-dp USDC, margin included) — the exact amount a purchase reserves. Null when the phone catalog is not seeded.
        "404":
          description: Agent not found or not owned by caller
    post:
      tags: [Developer]
      summary: Buy a US local number and bind it 1:1 to the agent
      description: |
        The first month's rental is reserved from the AGENT's balance
        (atomic balance + session/policy gate) BEFORE the carrier-side buy
        and settled to the exact rental once it succeeds — any carrier
        failure releases the reserve, so the developer is never charged for
        a number they didn't get. The rental price comes from the
        'floe/phone' catalog entry and is snapshot on the number row.
        At least one of `areaCode` / `phoneNumber` is required — the carrier
        picks a number by area code or exact E.164, never "any US number";
        a body with neither is refused with 400 area_code_required before
        anything is reserved. `phoneNumber` (from a prior /numbers/search)
        takes precedence over `areaCode`. One live number per agent.
        The agent-key surface `POST /v1/numbers` (floe_ key; agent identity
        from the key, no :agentId) runs the same purchase core and returns
        the same bodies and error codes.
      operationId: devBuyAgentNumber
      security:
        - developerSession: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [areaCode]
                - required: [phoneNumber]
              properties:
                areaCode:
                  type: string
                  pattern: "^[2-9]\\d{2}$"
                  description: 3-digit US area code (2xx–9xx). Required unless phoneNumber is supplied; ignored (not validated or stored) when phoneNumber is present.
                phoneNumber:
                  type: string
                  pattern: "^\\+1\\d{10}$"
                  description: Exact E.164 from a prior search (see-then-buy). Satisfies the area-code requirement on its own and takes precedence over areaCode.
      responses:
        "201":
          description: Purchased (X-Floe-Cost-USDC carries the rental debit)
          headers:
            X-Floe-Cost-USDC:
              $ref: "#/components/headers/FloeCostUsdc"
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    $ref: "#/components/schemas/PhoneNumber"
        "400":
          description: area_code_required (neither areaCode nor phoneNumber sent) | invalid_area_code | invalid body. Error bodies carry a human-readable `detail`.
        "402":
          description: insufficient_balance | spend_limit_exceeded | policy_exceeded (agent balance pays the rental)
        "403":
          description: telephony_suspended
        "404":
          description: Agent not found or not owned by caller
        "409":
          description: number_exists | no_numbers_available | agent_unavailable | agent_not_ready
        "502":
          description: provisioning_failed (nothing was charged)
        "503":
          description: telephony_unavailable (Floe Phone not configured / rates not seeded)

  /v1/developer/agents/{agentId}/numbers/search:
