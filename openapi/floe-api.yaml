        message:
          type: string

    # ── Rebilling + Stripe Connect (FLO-733) ──

    RateCardRule:
      description: >
        One pricing rule; a card's `rules` compose additively. `fixed` = a
        flat amount per period (retainer; prorated by segment share on a
        mid-period version change). `per_unit` = rate × usage after an
        optional included allotment (`audio_minute` = ceil(audio seconds /
        60); `request` = metered calls; `task` = distinct task ids, each
        counted once in the window holding its first billable request — a
        per-task rule blocks the close with `uncounted_usage` while any
        request carries no task id; `voice_call` = one per Floe-written call
        row, a Floe Phone reservation or a Reconcile Mode row, never from
        tags; `task` and `voice_call` can't share a card; `resolution` /
        `meeting_booked` / `qualified_lead` = Σ quantity of confirmed,
        unbilled outcome claims of that exact kind, confirmed by an operator
        or client inside the segment — they combine freely with every other
        unit). `tiered` =
        GRADUATED bands over the
        same units: each band prices only the units falling inside it, and
        reaching a band never reprices earlier units (a leading band at rate
        0 is an included allotment). At most ONE `per_unit`-or-`tiered` rule
        per unit — two would bill the same quantity twice. `cost_plus` = the
        client's metered cost basis × (1 + marginBps / 10000) — at most one
        per card;
        `vendorCostBasis` names which class of RECONCILED VENDOR COST joins
        that basis (absent = `none`, so vendor actuals never enter billing
        silently). The retired `includeByokEstimates` flag folded a CALL-TIME
        ESTIMATE into the basis; it is refused on write, and a live card still
        carrying it rates as `none` and blocks the close until a new version
        names a basis. Raw amounts are 6-dp USDC integer strings ≤ 15 digits.
      oneOf:
        - type: object
          required: [kind, label, amountRaw]
          properties:
            kind:
              type: string
              enum: [fixed]
            label:
              type: string
            amountRaw:
              type: string
              example: "500000000"
        - type: object
          required: [kind, unit, ratePerUnitRaw]
          properties:
            kind:
              type: string
              enum: [per_unit]
            unit:
              type: string
              enum: [audio_minute, request, task, voice_call, resolution, meeting_booked, qualified_lead]
            ratePerUnitRaw:
              type: string
              example: "100000"
            includedUnits:
              type: integer
              minimum: 0
            label:
              type: string
        - type: object
          required: [kind, unit, tiers]
          properties:
            kind:
              type: string
              enum: [tiered]
            unit:
              type: string
              enum: [audio_minute, request, task, voice_call, resolution, meeting_booked, qualified_lead]
            tiers:
              type: array
              minItems: 1
              maxItems: 10
              description: >
                Graduated bands, ascending and non-overlapping. Each band
                prices units above the previous band's `upTo` through its own.
                The LAST band MUST carry an explicit `upTo: null` — the
                open-ended remainder — so usage can never run past the card
                and bill at zero. An omitted `upTo` is refused, not normalised.
              items:
                type: object
                required: [upTo, ratePerUnitRaw]
                properties:
                  upTo:
                    type: integer
                    nullable: true
                    minimum: 1
                    maximum: 100000000
                    description: >
                      Inclusive ceiling of this band, strictly greater than the
                      previous band's. `null` on the last band only.
                  ratePerUnitRaw:
                    type: string
                    example: "100000"
            label:
              type: string
        - type: object
          required: [kind, marginBps]
          properties:
            kind:
              type: string
              enum: [cost_plus]
            marginBps:
              type: integer
              minimum: 0
              maximum: 100000
              example: 3000
            vendorCostBasis:
              type: string
              enum: [none, exact, exact_and_period_rate]
              default: none
              description: >
                Which reconciled vendor cost (ledger_reconciliations,
                cost_owner='developer') joins this rule's basis. `exact` =
                vendor-stated per-request/invoiced figures only.
                `exact_and_period_rate` also admits legs priced at the vendor's
                own realized bucket rate. Absent behaves as `none`.
            includeByokEstimates:
              type: boolean
              deprecated: true
              description: >
                RETIRED (FLO-746). Refused on write with a 400 naming
                `vendorCostBasis`. Frozen on existing card versions, where it
                rates as `none` and blocks the period close.
            label:
              type: string

    Contract:
      type: object
      description: |
        One signed term. The mirror of a rate card: a rate card is what is
        CURRENTLY RATING, this is what was SIGNED, and the gap between them is
        what "signed vs deployed" means.
      properties:
        id:
          type: integer
        customerId:
          type: string
        termStart:
          type: string
          format: date-time
        termEnd:
          type: string
          format: date-time
          description: Exclusive — a term is [termStart, termEnd).
        status:
          type: string
          enum: [active, cancelled]
          description: |
            The stored human act. Never `expired` — that is a fact about the
            clock, derived on read, so no background job can stop running and
            leave a finished term looking live.
        state:
          type: string
          enum: [scheduled, active, expired, cancelled]
          description: What the contract IS right now — `status` plus the clock.
        committedVolume:
          type: string
          nullable: true
          description: Integer text in `committedUnit`; raw 6-dp USDC when the unit is `usd`.
        committedUnit:
          type: string
          nullable: true
          enum: [audio_minute, request, task, voice_call, usd]
          description: |
            Counted INDEPENDENTLY of what the rate card meters — a commitment
            in a unit the card does not price is still measurable, because the
            ledger carries all of these quantities regardless.
        signedRateCardVersion:
          type: integer
          nullable: true
          description: |
            The as-signed rate card, by VERSION rather than as a scalar rate.
            `rate_cards` is append-only, so this reproduces the signed pricing
            exactly and forever.
        renewalDate:
          type: string
          format: date-time
          nullable: true
          description: Advisory only; `termEnd` governs.
        consumed:
          type: object
          nullable: true
          description: |
            How much of the commitment has been used, COUNTED IN THE CONTRACT'S
            OWN UNIT and independently of what the rate card meters. The window
            is the term clipped at now, so a running term is not compared
            against its full-term commitment. null when the contract carries no
            commitment, or past the per-request consumption budget — render "—",
            never a computed substitute. Only present on the list endpoint.
          properties:
            quantity:
              type: string
              description: Integer text; raw 6-dp USDC when the unit is `usd`.
            unit:
              type: string
              enum: [audio_minute, request, task, voice_call, usd]
            isLowerBound:
              type: boolean
              description: |
                true → metered requests carried no task id, so the distinct-task
                count is a FLOOR (the same condition that blocks a close with
                `uncounted_usage`). Render "at least X of N", NEVER a bare
                "X of N": presenting a floor as exact is how a client is told
                they are under a commitment they have actually met.
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    RateCard:
      type: object
      description: One immutable rate-card version.
      properties:
        id:
          type: integer
        customerId:
          type: string
        version:
          type: integer
          description: 1-based, monotonic per customer.
        status:
          type: string
          enum: [active, draft]
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
          description: null while a draft.
        currency:
          type: string
          example: usd
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RateCardRule"
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    RatableUsage:
      type: object
      description: Aggregated usage for one customer over one window — the rating input.
      properties:
        costRaw:
          type: string
          description: Floe-settled metered cost (authoritative), raw 6-dp USDC.
        audioSeconds:
          type: integer
          description: Gateway STT/TTS/realtime seconds. Floe Phone per-minute legs are NOT included yet (known limitation) — price phone-heavy clients with cost_plus / fixed, or per call (`voice_call`).
        requests:
          type: integer
        tasks:
          type: integer
          description: >
            P1.1 — distinct task ids whose first billable request falls in the
            window. Present only when the card prices `task`.
        untaskedRequests:
          type: integer
          description: >
            P1.1 — requests in the window with no task id. Present with
            `tasks`; above 0, the task count is a lower bound.
        voiceCalls:
          type: integer
          description: >
            P1.3 — voice calls in the window: one per Floe Phone reservation
            row or Reconcile Mode row, never from tags. Present only when the
            card prices `voice_call`.
        vendorCost:
          type: object
          description: >
            FLO-746 — reconciled VENDOR cost for the same window, always
            filtered `cost_owner='developer'` (a Floe-carried leg's actual is
            Floe's COGS and the agency already paid for it through costRaw).
            Enters rating only when a cost_plus rule names a vendorCostBasis.
            Replaced the retired `byokUpstreamEstRaw` call-time estimate.
          properties:
            exactRaw:
              type: string
              description: Signed raw 6-dp USDC — vendor-stated (exact + invoiced + group-scope) cost.
            periodRateRaw:
              type: string
              description: Signed raw 6-dp USDC — cost derived from the vendor's realized bucket rate. Never summed into exactRaw for display.
            pendingLegs:
              type: integer
              description: Legs a connector has not resolved yet. Carries no dollars.
            manualLegs:
              type: integer
              description: Legs no connector will ever resolve (incl. non-USD). Carries no dollars.

    RatedLineItem:
      type: object
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [fixed, per_unit, tiered, cost_plus]
        quantity:
          type: number
          nullable: true
          description: >
            Billable quantity after any included allotment; null for fixed /
            cost_plus. A `tiered` rule emits ONE LINE ITEM PER BILLABLE BAND
            (so line items are NOT 1:1 with a card's rules), and this is the
            quantity falling in that band — not the call's total.
        unit:
          type: string
          nullable: true
          enum: [audio_minute, request, task, voice_call, resolution, meeting_booked, qualified_lead, null]
        amountRaw:
          type: string

    RatedResult:
      type: object
      description: Output of the pure rating engine (`@floe/shared` rateUsage) — the same numbers a period close snapshots.
      properties:
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/RatedLineItem"
        revenueRaw:
          type: string
          description: Σ line items — what the end-client is charged.
        costRaw:
          type: string
          description: The cost basis this rating used (Floe-settled, plus the reconciled vendor cost the card's vendorCostBasis admitted).
        marginRaw:
          type: string
          description: revenueRaw − costRaw. Negative = losing money on this client.
        vendorCostAppliedRaw:
          type: string
          description: Signed raw 6-dp USDC — the vendor-actual dollars this rating applied ("0" under the none / legacy_estimate bases).
        vendorCostBasis:
          type: string
          enum: [none, exact, exact_and_period_rate, legacy_estimate]
          description: The effective basis of the card's cost_plus rule; `legacy_estimate` is the synthetic basis a frozen includeByokEstimates flag lifts to.
        blockers:
          type: array
          description: >
            Empty on every well-formed card. Non-empty BLOCKS the period
            close. `legacy_estimate_basis` — the card itself cannot close.
            `uncounted_usage` — a rule prices `task` and some requests carry
            no task id, so the task count is a lower bound.
          items:
            type: object
            properties:
              code:
                type: string
                enum: [legacy_estimate_basis, uncounted_usage]
              ruleIndex:
                type: integer
              message:
                type: string

    LedgerCustomer:
      type: object
      description: One row of GET /v1/developer/customers.
      properties:
        customerId:
          type: string
        costRaw:
          type: string
          description: Window spend, raw 6-dp USDC ("0" for carded customers with no usage in the window).
        requests:
          type: integer
        lastSeenAt:
          type: string
          description: ISO timestamp of the latest metered row; empty string when none in the window.
        rateCard:
          type: object
          properties:
            currentVersion:
              type: integer
              nullable: true
            draftVersion:
              type: integer
              nullable: true
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: Required before an invoice can be pushed.
        stripeCustomerId:
          type: string
          nullable: true
          description: The Stripe Customer created on the agency's connected account by the first push (`cus_…`).
        billingPeriods:
          type: object
          description: Period counts by status for this customer.
          properties:
            open:
              type: integer
            closed:
              type: integer
            issued:
              type: integer
            paid:
              type: integer

    Customer:
      type: object
      description: The end-customer entity (contact for statements / invoices). Never carries the owning wallet.
      properties:
        customerId:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        stripeCustomerId:
          type: string
          nullable: true
        stripeAccountId:
          type: string
          nullable: true
          description: The connected Stripe account `stripeCustomerId` lives on; a mismatch after a reconnect creates a fresh Stripe Customer on the next push.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        defaultCustomerId:
          type: string
          nullable: true
          description: Third tier of the attribution chain (header → agent default → project default).
        createdAt:
          type: string
          format: date-time
          nullable: true
        agentCount:
          type: integer

    BillingPeriod:
      type: object
      description: >
        A billing period — the unit an invoice is issued for. Lifecycle
        `open → closed → issued`; `paid / void / uncollectible` are set from
        the Stripe invoice once pushed. Money fields are null until close.
      properties:
        id:
          type: integer
        customerId:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        timezone:
          type: string
        currency:
          type: string
          example: usd
        status:
          type: string
          enum: [open, closed, issued, paid, void, uncollectible]
        closedAt:
          type: string
          format: date-time
          nullable: true
        issuedAt:
          type: string
          format: date-time
          nullable: true
        collectedAt:
          type: string
          format: date-time
          nullable: true
          description: Stripe's `status_transitions.paid_at` once the invoice was paid.
        revenueRaw:
          type: string
          nullable: true
          description: Σ rated + manual lines, raw 6-dp USDC — what the client is charged.
        costRaw:
          type: string
          nullable: true
          description: The account's cost basis for the period. NEVER show this to the end-client.
        marginRaw:
          type: string
          nullable: true
        totalCents:
          type: integer
          nullable: true
          description: Σ line-item cents (each line truncated toward zero; sub-cent remainders are kept per line so Σcents + Σremainders = revenueRaw exactly). The amount Stripe invoices.
        floeFeeRaw:
          type: string
          nullable: true
          description: Application fee Floe withheld on the connected-account invoice, raw 6-dp USDC. "0" by default (STRIPE_CONNECT_APPLICATION_FEE_BPS=0).
        stripeAccountId:
          type: string
          nullable: true
          description: The connected Stripe account the invoice was created on (`acct_…`).
        externalInvoiceId:
          type: string
          nullable: true
          description: Stripe invoice id on the agency's account (`in_…`).
        externalInvoiceStatus:
          type: string
          nullable: true
          enum: [draft, open, paid, void, uncollectible, null]
          description: Stripe's invoice status, mirrored verbatim by the push, the Connect webhook and the reconcile timer.
        invoiceHostedUrl:
          type: string
          format: uri
          nullable: true
          description: Stripe-hosted invoice page (the link the client receives).
        invoicePdfUrl:
          type: string
          format: uri
          nullable: true
        invoiceNumber:
          type: string
          nullable: true
          description: The agency's Stripe invoice number (their prefix + sequence).
        invoicePushedAt:
          type: string
          format: date-time
          nullable: true
        pushAttempt:
          type: integer
          description: Bumps on every new push attempt (salts the Stripe idempotency keys); 0 = never pushed.
        pushError:
          type: string
          nullable: true
          description: Last push failure code (e.g. `push_total_mismatch`, `draft_deleted`); cleared when a push starts.
        costVendorAppliedRaw:
          type: string
          nullable: true
          description: >
            FLO-746 — at-close snapshot of the reconciled vendor cost this
            period's rating applied. NULL means the period was closed before
            FLO-746, which is what keeps the roll-forward job off historical
            periods. AGENCY-ONLY: never rendered on the statement CSV or any
            Stripe object.
        costVendorCarriedRaw:
          type: string
          nullable: true
          description: Running total already carried forward as `true_up` lines in later periods. Signed.
        holdsCarriedRaw:
          type: string
          nullable: true
          description: >
            Running total of hold settle deltas already carried forward as
            `true_up` lines (note prefix `hold_settled`) into later periods.
            Signed 6-dp raw. '0' when an owner-overridden close billed holds at
            their reserve and snapshotted them; NULL when no holds were
            snapshotted, which keeps the period out of the holds carry.
        actualsGateOverrideReason:
          type: string
          nullable: true
          description: Owner-supplied 10–500 char reason for closing past a close gate — `vendor_actuals_pending` and/or `uncounted_usage` (per-task pricing over requests with no task id; only the counted tasks were billed).
        actualsGateOverrideBy:
          type: string
          nullable: true
          description: Member wallet that overrode the gate.
        overrideGates:
          type: array
          nullable: true
          items:
            type: string
            enum: [vendor_actuals_pending, uncounted_usage, holds_pending, legacy_unrecorded]
          description: >
            The gates the override closed past. Set exactly when
            `actualsGateOverrideReason` is. `legacy_unrecorded` marks an
            override recorded before the gates were.
        createdAt:
          type: string
          format: date-time

    StatementLineItem:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
          enum: [rated, manual, true_up]
          description: >
            `true_up` (FLO-746) is a late vendor actual for an already-closed
            period, priced under that period's card version and carried into
            the next open one. It cannot be created or edited via
            POST /line-items — disagreement is an offsetting manual credit.
        kind:
          type: string
          enum: [fixed, per_unit, tiered, cost_plus, manual]
          description: >
            The rule kind that produced this row (`manual` for an operator
            row). Stored as unconstrained text, not a DB enum, so a new
            pricing model never needs a migration to be closable and a closed
            period keeps reproducing whatever kind rated it.
        label:
          type: string
        quantity:
          type: number
          nullable: true
          description: >
            Billable quantity for this row. A `tiered` rule persists ONE ROW
            PER BILLABLE BAND, so rated rows are NOT 1:1 with a card's rules
            and this is the band's quantity, not the period total.
        unit:
          type: string
          nullable: true
        amountRaw:
          type: string
          description: Signed raw 6-dp USDC (manual credits negative).
        amountCents:
          type: integer
          description: Truncated toward zero — the Stripe invoice-item amount.
        roundingRemainderRaw:
          type: string
          description: amountRaw − amountCents × 10000, so cents reconcile to the microdollar.
        cardVersion:
          type: integer
          nullable: true
          description: Provenance — the rate-card version that rated this line (null for manual).
        segmentFrom:
          type: string
          format: date-time
          nullable: true
        segmentTo:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
          description: Member wallet that added a manual item.
        note:
          type: string
          nullable: true
        sortOrder:
          type: integer
          description: rated 0..n, true_up 500, manual 1000.
        costRaw:
          type: string
          nullable: true
          description: >
            FLO-746 — what Floe's own rail charged for the usage this line
            rebills. Non-null only on a cost_plus line. AGENCY-ONLY: never on
            the statement CSV, never on a Stripe object.
        costVendorRaw:
          type: string
          nullable: true
          description: Signed raw 6-dp USDC — the reconciled vendor cost behind the same line (cost_owner='developer' only). AGENCY-ONLY.
        periodAdjustmentId:
          type: integer
          nullable: true
          description: Soft ref to the period_adjustments row a `true_up` line carried forward.

    BillingPeriodStatement:
      type: object
      properties:
        period:
          $ref: "#/components/schemas/BillingPeriod"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/StatementLineItem"

    PushedInvoice:
      type: object
      description: The Stripe invoice on the agency's connected account, as recorded on the period.
      properties:
        id:
          type: string
          example: in_1PqR…
        status:
          type: string
          enum: [draft, open, paid, void, uncollectible]
        hostedUrl:
          type: string
          format: uri
          nullable: true
        pdfUrl:
          type: string
          format: uri
          nullable: true
        number:
          type: string
          nullable: true
        totalCents:
          type: integer
        applicationFeeCents:
          type: integer
          description: 0 unless STRIPE_CONNECT_APPLICATION_FEE_BPS is set.

    InvoicePushResult:
      type: object
      description: Response of POST /v1/developer/billing-periods/{id}/invoice.
      properties:
        period:
          $ref: "#/components/schemas/BillingPeriod"
        invoice:
          $ref: "#/components/schemas/PushedInvoice"
        alreadyPushed:
          type: boolean
          description: true when the period had already been finalized on Stripe before this call — nothing was re-sent.
        warnings:
          type: array
          items:
            type: string
            enum: [phone_minutes_estimated]
          description: >
            `phone_minutes_estimated` — the account rents phone numbers and
            Floe Phone per-minute legs are not yet in the per-minute rating
            input, so per-minute lines may under-count. Cost lines are exact.

    StripeConnectStatus:
      type: object
      description: Response of GET / PATCH / DELETE /v1/developer/stripe/connect.
      properties:
        configured:
          type: boolean
          description: Mirrors GET /v1/capabilities.stripeConnect (STRIPE_CONNECT_CLIENT_ID set).
        connected:
          type: boolean
        stripeAccountId:
          type: string
          nullable: true
          example: acct_1PqRstUvWxYz
        livemode:
          type: boolean
          nullable: true
        chargesEnabled:
          type: boolean
          description: false until the agency finishes Stripe onboarding; pushes 409 connected_account_restricted until then.
        payoutsEnabled:
          type: boolean
        detailsSubmitted:
          type: boolean
        businessName:
          type: string
          nullable: true
        defaultCurrency:
          type: string
          nullable: true
          example: usd
        daysUntilDue:
          type: integer
          description: Payment term stamped on every pushed invoice (default 30).
        invoiceFooter:
          type: string
          nullable: true
        connectedBy:
          type: string
          nullable: true
          description: Member wallet that completed the OAuth link.
        connectedAt:
          type: string
          format: date-time
          nullable: true
        disconnectedAt:
          type: string
          format: date-time
          nullable: true
        redirectUri:
          type: string
          format: uri
          description: The OAuth redirect URI this deployment uses — must be registered in Stripe's Connect settings.
          example: https://credit-api.floelabs.xyz/v1/developer/stripe/connect/callback

    ConnectError:
      type: object
      description: Machine-readable Stripe Connect error (`error` is the code; `message` is for humans).
      properties:
        error:
          type: string
          enum: [stripe_connect_not_configured, already_connected, stripe_not_connected, session_required, plan_required, invalid_request]
        message:
          type: string
        stripeAccountId:
          type: string
          description: On already_connected — the account currently linked.

    InvoicePushError:
      type: object
      description: Machine-readable invoice-push error (`error` is the code; `message` is for humans). Extra keys (`status`, `customerId`, `totalCents`, `minimumCents`, `stripeAccountId`, `code`) accompany some codes.
      properties:
        error:
          type: string
          enum:
            - not_found
            - stripe_not_configured
            - stripe_not_connected
            - connected_account_restricted
            - period_not_pushable
            - customer_email_required
            - empty_statement
            - nonpositive_total
            - total_below_minimum
            - push_total_mismatch
            - push_rate_limited
            - push_failed
        message:
          type: string

    AccountPlanRow:
      type: object
      description: |
        Admin projection of a persisted account_plans row. `plan`/`source` are the
        EFFECTIVE values (admin grant > entitled Stripe subscription > Free) with
        `reason` explaining the resolution; `storedPlan`/`storedSource` are the
        raw columns. Absent (`null`) for Free accounts that never touched billing.
      properties:
        developerWallet:
          type: string
        accountId:
          type: string
          description: Floe public account id (`acct_<12 hex>`) — NOT a Stripe account id.
          example: acct_0123456789ab
        plan:
          $ref: "#/components/schemas/AccountPlanName"
        source:
          $ref: "#/components/schemas/AccountPlanSource"
        reason:
          type: string
          description: Why the effective plan resolved as it did.
          enum: [no_row, admin_grant, no_subscription, subscription_not_entitled, unknown_price, subscription]
        storedPlan:
          $ref: "#/components/schemas/AccountPlanName"
        storedSource:
          $ref: "#/components/schemas/AccountPlanSource"
        subscriptionStatus:
          type: string
          nullable: true
        stripeCustomerId:
          type: string
          nullable: true
        stripeSubscriptionId:
          type: string
          nullable: true
        stripePriceId:
          type: string
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        cancelAt:
          type: string
          format: date-time
          nullable: true
        billingEmail:
          type: string
          nullable: true
        adminNote:
          type: string
          nullable: true
        adminGrantedBy:
          type: string
          nullable: true
        adminExpiresAt:
          type: string
          format: date-time
          nullable: true
        lastStripeEventAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ErrorNext:
      type: object
      description: Machine-readable next-step contract carried by onboarding-relevant errors.
      properties:
        error:
          type: string
        message:
          type: string
        next:
          type: object
          properties:
            hint:
              type: string
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
            path:
              type: string

    AdminAgent:
      type: object
      properties:
        id:
          type: string
        privyWalletAddress:
          type: string
        status:
          type: string
        balance:
          type: string
        creditLimit:
          type: string
          nullable: true
        creditUsed:
          type: string
        activeLoanCount:
          type: integer
        delegationActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OpenAiError:
      type: object
      description: >
        OpenAI-shaped gateway error. On wrong_credential_type the
        machine-readable `next` remediation rides ALONGSIDE the `error`
        object (additive top-level key) so OpenAI-compatible clients keep
        parsing unchanged.
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
        next:
          type: object
          properties:
            hint:
              type: string
            method:
              type: string
            path:
              type: string

    KeyBudget:
      type: object
      description: A key's current spend budget + derived spend (see PolicyService KeyBudgetView).
      properties:
        policyId:
          type: integer
        limitRaw:
          type: string
          description: Budget cap, raw USDC (6 decimals).
        spentRaw:
          type: string
          description: Derived spend in the current window, raw USDC (6 decimals).
        remainingRaw:
          type: string
          description: max(0, limit - spent), raw USDC (6 decimals).
        windowKind:
          type: string
          enum: [once, rolling, session]
        windowResetsAt:
          type: string
          format: date-time
          nullable: true
          description: Refill time for rolling windows; null otherwise.

    LimitChainRow:
      type: object
      description: >
        One link in an agent's spend-limit chain — a live policy's effective
        cap plus the same derived spend the enforcement path uses. The route
        layer appends a final scope='balance' row (spendable balance). FIXED
        CONTRACT — the dev-dashboard is coded against this shape.
      properties:
        scope:
          type: string
          enum: [agent, developer, balance]
        kind:
          type: string
          nullable: true
          enum: [session, task, api, vendor, key, customer, null]
          description: null only for the balance row.
        label:
          type: string
          nullable: true
        policyId:
          type: integer
          nullable: true
          description: null for the balance row and the synthesized legacy session (id -1).
        matchKey:
          type: string
          nullable: true
        limitRaw:
          type: string
          description: Effective limit, raw USDC (6 decimals).
        spentRaw:
          type: string
          description: Raw USDC (6 decimals).
        remainingRaw:
          type: string
          description: max(0, limit - spent), raw USDC (6 decimals).
        windowKind:
          type: string
          nullable: true
        windowResetsAt:
          type: string
          format: date-time
          nullable: true

    MtdRollup:
      type: object
      description: |
        Month-to-date bill rollup shared by /billing/mtd and /billing/invoice.
        Every money figure is graded (see FigureGrade). The total mixes Floe's
        platform fee (B), floe-guard ledger-sync rows (D) and orchestrator
        call-end rows (B) with settled spend — the grade and mix say so.
        Holds are NOT in any amount here (they were before figure grades):
        they are reported as `heldRaw`. `calls` still counts rows in flight.
      properties:
        totalRaw:
          type: string
          description: Month-to-date total, raw USDC (6 decimals).
        grade:
          $ref: "#/components/schemas/FigureGrade"
        gradeMix:
          $ref: "#/components/schemas/GradeMix"
        heldRaw:
          type: string
          description: Held, not yet charged — marketplace / Floe Phone holds. NOT part of the figure beside it, not graded. "0" when none.
        byVendor:
          type: array
          items:
            type: object
            properties:
              vendor:
                type: string
                description: Machine vendor label (model provider prefix, target host, or floe-phone).
              costRaw:
                type: string
                description: Raw USDC (6 decimals).
              grade:
                $ref: "#/components/schemas/FigureGrade"
              gradeMix:
                $ref: "#/components/schemas/GradeMix"
              heldRaw:
                type: string
                description: Held, not yet charged on this line (not in costRaw, not graded). "0" when none.
        byAgent:
          type: array
          items:
            type: object
            properties:
              agentId:
                type: integer
              agentName:
                type: string
              costRaw:
                type: string
                description: Raw USDC (6 decimals).
              grade:
                $ref: "#/components/schemas/FigureGrade"
              gradeMix:
                $ref: "#/components/schemas/GradeMix"
              heldRaw:
                type: string
                description: Held, not yet charged on this line (not in costRaw, not graded). "0" when none.
              calls:
                type: integer

    PhoneNumber:
      type: object
      description: Public Floe Phone number shape — carrier SIDs/subaccounts are Floe-internal and never exposed.
      properties:
        id:
          type: integer
        phoneNumber:
          type: string
          description: E.164.
        status:
          type: string
        areaCode:
          type: string
          nullable: true
        monthlyRentalRaw:
          type: string
          description: Snapshot rental price, raw USDC (6 decimals). Renewals debit this snapshot.
        nextRenewalAt:
          type: string
          format: date-time
          nullable: true
        graceUntil:
          type: string
          format: date-time
          nullable: true
        releasedAt:
          type: string
          format: date-time
          nullable: true
        releaseReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ActionOutcome:
      type: object
      description: Caller-reported outcome for one action (Floe never judges quality).
      properties:
        status:
          type: string
          enum: [success, failure, partial, unknown]
        scoreBps:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        reportCount:
          type: integer
        reportedAt:
          type: string
          format: date-time

    OrchestratorConnection:
      type: object
      description: >
        An orchestrator webhook connection. The webhook/pre-call URLs carry
        the capability token and ARE returned; the sealed verification
        secret never is (the token identifies, the secret authenticates).
      required: [id, provider, active, webhookUrl, preCallUrl]
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [vapi, retell, bland, pipecat, livekit]
        agentWallet:
          type: string
        label:
          type: string
          nullable: true
        active:
          type: boolean
        lastEventAt:
          type: string
          format: date-time
          nullable: true
        webhookUrl:
          type: string
          description: Call-end delivery URL to paste into the provider.
        preCallUrl:
          type: string
          description: >-
            Pre-call admission URL for all providers. Vapi callers append
            ?assistantId=<id>. Bland has no native pre-call webhook, so it wires
            this into a Pathway Webhook node that branches on the HTTP status:
            Floe returns 200 {"allowed":true} to admit or 402 {"allowed":false}
            to deny. AUTH EXCEPTION: unlike every other webhook (which the parent
            `secret` signs), the Bland pre-call authenticates on its capability
            token ALONE — a static Pathway node cannot compute an HMAC and the
            check is read-only. Treat the URL as a secret and rotate to revoke.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OfframpOrder:
      type: object
      description: Serialized offramp order (failureReason only surfaces when status is terminal-failed).
      properties:
        ref:
          type: string
          description: partnerUserRef — the order's public id.
        sourceKind:
          type: string
          enum: [embedded_wallet, agent_wallet]
        agentId:
          type: integer
          nullable: true
        status:
          type: string
        devEoaAddress:
          type: string
          nullable: true
        agentWalletAddress:
          type: string
          nullable: true
        requestedAmountRaw:
          type: string
          description: Raw USDC (6 decimals).
        finalAmountRaw:
          type: string
          nullable: true
          description: Raw USDC (6 decimals).
        fiatEstimate:
          type: string
          nullable: true
        cdpDepositAddress:
          type: string
          nullable: true
        cdpTransactionId:
          type: string
          nullable: true
        leg1TransferId:
          type: string
          nullable: true
        leg1TxHash:
          type: string
          nullable: true
        leg2TxHash:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        asset:
          type: string
        chain:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeveloperSession:
      type: object
      description: >
        The account a dashboard session was just issued for
        (POST /v1/developer/auth/privy, POST /v1/developer/auth/verify).
      properties:
        walletAddress:
          type: string
          description: The account key (lowercase 0x address).
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        accountId:
          type: string
          nullable: true
          description: Stable public account id (`acct_…`).
        createdAt:
          type: string
          format: date-time
          nullable: true
        privyDid:
          type: string
          nullable: true
          description: Privy user id pinned to the account (`did:privy:…`), write-once; NULL until its first email / Google / Privy-wallet sign-in (POST /v1/developer/auth/privy). A wallet-signature sign-in never sets it.
        walletActivatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the account opted into the wallet UI; NULL until then.

    PrivyAuthError:
      type: object
      description: POST /v1/developer/auth/privy refusal — `error` is the machine code, `message` a sentence for humans.
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_privy_token
            - embedded_wallet_pending
            - wallet_signature_required
            - identity_ambiguous
            - identity_conflict
            - case_identity
            - rate_limited
            - privy_unavailable
            - privy_auth_unavailable
            - privy_app_mismatch
        message:
          type: string
        canContinueAsDeveloper:
          type: boolean
          description: "On `case_identity`: repeating the request with `allowNew: true` creates the developer account."
        retryable:
          type: boolean
          description: Present (true) on embedded_wallet_pending only.
        retryAfterSeconds:
          type: integer
          description: Present on rate_limited only.

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items: {}

    BillingPeriodPendingHolds:
      type: object
      description: >
        Charges in the period still held at their reserve — `proxy_requests`
        rows with status `pending` and no x402 reservation. `count` and
        `heldRaw` cover every hold; `holds` lists at most 50.
      required: [count, heldRaw, holds, truncated]
      properties:
        count:
          type: integer
        heldRaw:
          type: string
          description: Σ held amount (payment + platform fee), raw 6-decimal USDC.
        truncated:
          type: boolean
          description: True when `holds` lists fewer than `count`.
        holds:
          type: array
          items:
            type: object
            required: [id, heldRaw]
            properties:
              id:
                type: integer
                description: The proxy_requests row id.
              targetHost:
                type: string
                nullable: true
              heldRaw:
                type: string
              createdAt:
                type: string
                format: date-time
                nullable: true
              ageSeconds:
                type: integer
                nullable: true
                description: How long the hold has been open, in seconds, when the response was built.
    BillingPeriodCloseRefusal:
      type: object
      description: >
        A refused close. `error` names the refusal. `unrated_usage` and the
        timing / conflict refusals carry `message`; `legacy_estimate_basis`
        and `uncounted_usage` carry `detail` plus the `blockers` behind it.
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        detail:
          type: string
        untaskedRequests:
          type: integer
          description: On `uncounted_usage` — requests in the period with no task id.
        overridable:
          type: boolean
          description: On `uncounted_usage` and `holds_pending` — true; an owner may close with `actualsGateOverrideReason`.
        holdsPending:
          allOf:
            - $ref: "#/components/schemas/BillingPeriodPendingHolds"
          description: On `holds_pending` — the unsettled holds behind the refusal.
        vendorActuals:
          type: object
          description: >
            On `vendor_actuals_pending` — the vendor-actuals gate behind the
            refusal. Only `manualLegs` and `pendingPastSlaLegs` block.
          properties:
            manualLegs:
              type: integer
              description: Legs no connector will ever resolve — block immediately.
            pendingLegs:
              type: integer
              description: Legs a connector has not resolved yet.
            pendingPastSlaLegs:
              type: integer
              description: Pending legs older than their vendor's actuals SLA.
            oldestPendingAt:
              type: string
              format: date-time
              nullable: true
            blockingVendors:
              type: array
              items:
                type: string
        blockers:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum: [legacy_estimate_basis, uncounted_usage]
              ruleIndex:
                type: integer
              message:
                type: string

  parameters:
    LedgerEntryId:
      name: id
      in: path
      required: true
      description: A ledger entry id (uuid). Another account's entry is 404.
      schema:
        type: string
        format: uuid
    CaseLinkHeader:
      name: X-Floe-Case-Link
      in: header
      required: true
      description: >-
        L0.8 — sha256 hex of the page's csh_ case link. Must equal the case
        session's link; missing or different → 409 case_session_mismatch (after
        the identical-404 checks).
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    CustomerId:
      name: customerId
      in: path
      required: true
      description: The end-customer tag (the `X-Floe-Customer-Id` value). Trimmed + lower-cased; ≤ 128 chars.
      schema:
        type: string
        maxLength: 128
    RateCardId:
      name: id
      in: path
      required: true
      description: Rate-card version row id (not the version number).
      schema:
        type: integer
    BillingPeriodId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
