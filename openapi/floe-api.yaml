      type: object
      description: >
        P2.5 — the shared body every per-plan COUNT cap returns (agents,
        account API keys, keys per agent, billed clients), so a client handles
        them all in one branch instead of one per resource. Always 409: the
        account's current state forbids the write, and upgrading is what
        changes it.
      required: [error, message, limit, max, current, upgradeUrl]
      properties:
        error:
          type: string
          enum: [plan_limit_exceeded]
        message:
          type: string
          description: Human-readable, and it NAMES the plan — "your plan allows 5" is useless to someone who doesn't know which plan they're on, and the number now depends on it.
        limit:
          type: string
          enum: [agents, api_keys, keys_per_agent, billed_clients]
          description: Which cap was hit.
        max:
          type: integer
          description: The plan's limit for this resource. Never null — an unlimited plan skips the check entirely rather than reporting one.
