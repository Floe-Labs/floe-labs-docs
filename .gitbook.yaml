root: ./

structure:
  readme: README.md
  summary: SUMMARY.md

# Redirects for pages whose published URL changed in the value-first IA reorg
# (GitBook derives a page's URL from its SUMMARY.md section: kebab(section)/filename).
# Keys are the OLD site-relative path, values the NEW one. Keep in sync with SUMMARY.md.
redirects:
