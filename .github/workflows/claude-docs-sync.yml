# Documentation sync — receiver.
#
# Triggered by floe-monorepo's notify-docs.yml whenever a change to Floe's
# public surface merges there. This workflow checks out the monorepo
# read-only, has Claude Code review the diff against these docs, and — only
# if a page is actually invalidated — opens a draft pull request with the
# minimal updates. Draft PRs are proposals: every change is reviewed and
# merged by a person. If nothing is affected, the run ends without output.
#
# Can also be run manually (workflow_dispatch) with an explicit commit range,
# which is useful for testing or for backfilling a missed change.
#
# Setup:
#   - Secrets: ANTHROPIC_API_KEY, and DOCS_SYNC_TOKEN with Contents read
#     access on Floe-Labs/floe-monorepo (used for the read-only checkout).
#   - Repository setting: Actions → General → "Allow GitHub Actions to
#     create and approve pull requests" must be enabled.
name: Claude docs sync

on:
  repository_dispatch:
    types: [monorepo-change]
  workflow_dispatch:
    inputs:
      before:
        description: 'Monorepo commit SHA before the change'
        required: true
        type: string
      after:
        description: 'Monorepo commit SHA after the change'
        required: true
        type: string

concurrency:
  group: claude-docs-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BEFORE: ${{ github.event.client_payload.before || inputs.before }}
      AFTER: ${{ github.event.client_payload.after || inputs.after }}
    steps:
      # Fail fast on malformed input: BEFORE/AFTER must be commit SHAs before
      # they are used in git commands. Also derives a canonical compare URL
      # from the validated values rather than trusting one from the payload.
      - name: Validate commit range
        run: |
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{7,40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "::error::BEFORE is not a usable commit SHA: '$BEFORE'"
            exit 1
          fi
          if ! [[ "$AFTER" =~ ^[0-9a-f]{7,40}$ ]] || [[ "$AFTER" =~ ^0+$ ]]; then
            echo "::error::AFTER is not a usable commit SHA: '$AFTER'"
            exit 1
          fi
          echo "COMPARE_URL=https://github.com/Floe-Labs/floe-monorepo/compare/${BEFORE}...${AFTER}" >> "$GITHUB_ENV"
          echo "AFTER7=${AFTER:0:7}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Floe-Labs/floe-monorepo
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: monorepo
          fetch-depth: 0
          # Read-only checkout: don't leave the token on disk for later steps.
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this input the action tries an OIDC exchange for a Claude
          # GitHub App token, which fails here: the explicit permissions block
          # above denies `id-token: write`, and this repo authenticates with a
          # plain API key rather than the app. The workflow token already
          # carries the contents/pull-requests write access the job needs.
          github_token: ${{ github.token }}
          # The SHAs and compare link are interpolated as literals on purpose.
          # Claude Code's Bash allowlist (`Bash(git:*)`) refuses any command
          # containing shell expansion (`$BEFORE`), and `env`/`printenv` are
          # not allowlisted — so a prompt that says "run git diff $BEFORE..$AFTER"
          # is un-runnable: every run burned 8-12 turns on permission denials
          # trying to discover the range, then guessed it from `git log`.
          # BEFORE/AFTER are regex-validated above, so inlining them is safe.
          prompt: |
            A change merged to floe-monorepo main. The monorepo is checked out
            READ-ONLY at ./monorepo (never edit anything under it; it is a
            different repository). Its HEAD may already be newer than the
            range below — only the range below matters.

            Commit range to review (literal SHAs — use them as written):
              BEFORE = ${{ env.BEFORE }}
              AFTER  = ${{ env.AFTER }}
              Compare link: ${{ env.COMPARE_URL }}

            Do not try to read environment variables (`env`, `printenv`,
            `echo $VAR`) and do not put `$VARIABLES` in shell commands — the
            tool allowlist rejects both and each attempt wastes a turn.

            1. Inspect the change:
               git -C monorepo log --oneline ${{ env.BEFORE }}..${{ env.AFTER }}
               git -C monorepo diff --stat ${{ env.BEFORE }}..${{ env.AFTER }}
               then `git -C monorepo diff ${{ env.BEFORE }}..${{ env.AFTER }} -- <path>`
               per file of interest (Read/Grep/Glob also work under ./monorepo).
            2. Decide which pages in THIS docs repo the change invalidates.
               Follow CLAUDE.md strictly — especially the out-of-scope list
               (on-chain lending is not documented here), the changelog
               append-only rule, and SUMMARY.md navigation. Internal-only
               changes (refactors, tests, monitoring) usually invalidate
               nothing.
            3. If nothing is invalidated: print a one-line reason and STOP.
               Do not create a branch, commit, or PR.
            4. Otherwise: create branch docs-sync/${{ env.AFTER7 }},
               make the minimal edits, commit with a message starting
               "docs-sync:", push, then open a DRAFT PR:
               gh pr create --draft \
                 --title "[docs-sync] <what changed>" \
                 --body "<summary of edits + the compare link ${{ env.COMPARE_URL }}>"
               If you changed nav/content, regenerate llms-full.txt with
               `npx tsx scripts/build-llms-full.ts` (allowlisted); if you
               changed x402-directory entries, run
               `npx tsx scripts/build-directory.ts`.
               Shell hygiene (each violation is a denied turn): commit with
               one or more `-m` flags — no heredocs; write the PR body to a
               file with the Write tool and pass `--body-file <path>` instead
               of a multi-line `--body` string.
          # --max-turns: the action fails the run if Claude's turn count
          # exceeds this, even when Claude finished successfully (see run
          # 32208982660: "successful result after 43 turns, exceeding the
          # configured maximum of 40"). Keep headroom for large diffs.
          # Allowlist: `head`/`grep`/`echo` are already auto-allowed by
          # Claude Code; `gh pr list/view` let Claude check for an existing
          # docs-sync PR; `npx tsx scripts/...` are the two zero-dependency
          # generators CLAUDE.md asks the bot to run.
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(npx tsx scripts/build-llms-full.ts),Bash(npx tsx scripts/build-directory.ts)"

      # The action hides Claude's transcript (show_full_output is off because
      # this repo is public and the monorepo diff is private). Surface just the
      # turn count and the commands that were permission-denied — no tool
      # output, no file contents — so the next failure is diagnosable from the
      # job log alone.
      - name: Report turn budget and permission denials
        if: always()
        continue-on-error: true
        run: |
          f="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$f" ]; then echo "no execution file"; exit 0; fi
          jq -r '
            .[] | select(.type == "result") |
            "turns=\(.num_turns) subtype=\(.subtype) denials=\((.permission_denials // []) | length)",
            ((.permission_denials // [])[] |
              "  denied: \(.tool_name) \(.tool_input.command // .tool_input.file_path // "")")
          ' "$f"
